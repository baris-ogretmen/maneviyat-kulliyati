const BDS=[
["Mekke, Kâbe ve Fil Vakası","Hikâyemiz, kuru dağların arasında, suyu az ama bereketi çok bir vadide başlar: Mekke. Asırlar önce Hazreti İbrâhim, eşi Hacer'i ve oğlu İsmâil'i Allah'ın emriyle bu ıssız vadiye bırakmıştı. Hacer annemiz su ararken Safâ ile Merve arasında yedi kez koştu; sonunda bebeğin ayaklarının dibinden zemzem fışkırdı. Yıllar sonra baba ile oğul, Rablerinin emriyle Kâbe'nin temellerini yükselttiler ve dua ettiler: Rabbimiz, bunların içinden onlara âyetlerini okuyacak, kitabı ve hikmeti öğretecek bir peygamber gönder. Bu dua, yaklaşık iki buçuk bin yıl sonra kabul olunacaktı. Zamanla Mekke halkı tevhidi unuttu; Kâbe'nin etrafı putlarla doldu. Yine de Mekke ticaretin, şiirin ve haccın merkeziydi; Kureyş kabilesi de Kâbe'nin hizmetini yürütmenin şerefini taşıyordu. Efendimizin doğduğu yıl, Yemen valisi Ebrehe, insanları kendi yaptırdığı kiliseye çekmek için Kâbe'yi yıkmaya karar verdi. Önünde fillerin yürüdüğü büyük bir orduyla Mekke'ye geldi. Kureyş'in reisi Abdülmuttalib, Ebrehe'nin askerlerinin el koyduğu develerini geri istedi. Ebrehe şaşırdı: Kâbe'yi yıkmaya geldim, sen ise develerini soruyorsun. Abdülmuttalib'in cevabı tarihe geçti: Ben develerin sahibiyim; Kâbe'nin de bir sahibi var, O onu korur. Ordu harekete geçtiğinde öndeki fil Kâbe'ye doğru yürümedi, çöktü kaldı. Ardından gökyüzünü sürü sürü kuşlar kapladı; attıkları pişmiş çamurdan taşlarla ordu, yenilmiş ekin yaprakları gibi oldu. Kur'ân-ı Kerîm bu olayı Fîl sûresinde anlatır. Araplar o yıla Fil Yılı dediler. İşte Âlemlere rahmet olarak gönderilecek Peygamber, Allah'ın evini koruduğu bu yılda dünyaya gelecekti. Bugüne mesaj: Bir işin sahibi Allah ise, sebepler ne kadar büyük görünürse görünsün, son sözü O söyler. Biz elimizden geleni yapar, gerisini O'na bırakırız."],
["Doğum ve Süt Anne Halîme","Efendimiz Hazreti Muhammed, Fil Yılı'nda, Rebîülevvel ayında, bir pazartesi günü Mekke'de dünyaya geldi. Miladi olarak beş yüz yetmiş bir yılına denk gelir; meşhur görüşe göre ayın on ikinci gecesiydi. Babası Abdullah, o doğmadan birkaç ay önce, ticaret dönüşü Medine'de vefat etmişti. Yani Efendimiz dünyaya yetim olarak gözlerini açtı. Annesi Âmine Hâtun, müjdeyi dedesi Abdülmuttalib'e gönderdi. Dede sevinçle torununu kucakladı, Kâbe'ye götürüp Allah'a şükretti ve ona o güne kadar pek duyulmamış bir isim verdi: Muhammed, yani çokça övülen. Mekke'nin eşrafı, çocuklarını sağlıklı büyüsünler, temiz Arapça öğrensinler diye çölde yaşayan süt annelere verirdi. Benî Sa'd kabilesinden Halîme, o yıl Mekke'ye en son gelenlerdendi. Devesi zayıf, kendisi yorgundu; zengin aileler ona çocuk vermemişti. Kocasıyla konuştu: Eli boş dönmektense şu yetimi alalım. İşte o yetim, Halîme'nin evine bereket olarak girdi. Kurumuş memeler süt verdi, zayıf deve canlandı, kıtlık yılında onların koyunları tok dönmeye başladı. Halîme, bu çocuğun sıradan bir çocuk olmadığını anladı. Efendimiz Benî Sa'd yurdunda dört-beş yaşına kadar kaldı. Rivayetlere göre bu yıllarda iki melek gelip mübarek göğsünü açmış, kalbini temizleyip yerine koymuştu; buna şakk-ı sadr denir. Halîme bu olaydan sonra endişelenip onu annesine teslim etti. Efendimiz ömrü boyunca süt annesini unutmadı. Yıllar sonra Halîme yanına geldiğinde ayağa kalkar, hırkasını yere serip onu üzerine oturturdu. Bugüne mesaj: Bereket, çoğu zaman insanların küçük gördüğü yerdedir. Halîme'nin yetimi kucaklaması, onun hayatının en büyük kazancı oldu. Bir yetimi sevindiren, kendi kapısına bereket çağırır."],
["Yetimlik Yılları ve Şam Yolculuğu","Efendimiz altı yaşındayken annesi Âmine, onu Medine'deki akrabalarına ve babasının kabrine götürdü. Dönüş yolunda, Ebvâ denilen yerde Âmine Hâtun hastalanıp vefat etti. Küçük Muhammed, dadısı Ümmü Eymen ile birlikte Mekke'ye boynu bükük döndü. Artık hem babasız hem annesizdi. Onu dedesi Abdülmuttalib bağrına bastı. Kâbe'nin gölgesindeki minderine kendi çocuklarını bile oturtmayan bu yaşlı reis, torununu yanına oturtur, sırtını sıvazlar, onun büyük bir şanı olacak, derdi. Fakat iki yıl sonra, Efendimiz sekiz yaşındayken dedesi de vefat etti. Vasiyeti üzerine yeğenini amcası Ebû Tâlib himayesine aldı. Ebû Tâlib'in malı azdı ama gönlü genişti; yeğenini kendi çocuklarından ayırmadı. Efendimiz de amcasının yükünü hafifletmek için Mekke'nin çevresinde ücretle koyun güttü. Daha sonra şöyle buyuracaktı: Allah'ın gönderdiği her peygamber koyun gütmüştür. Koyun gütmek sabrı, şefkati ve sorumluluğu öğretir. Efendimiz on iki yaşlarındayken amcası ticaret için Şam'a gidecekti. Yeğeni ondan ayrılmak istemedi, amcası da onu kervana kattı. Kervan Busrâ'da konakladığında Bahîrâ adında bir rahip, kervanın üzerinde dolaşan bir bulutu ve ağacın dallarının ona eğildiğini fark etti. Kervandakileri yemeğe davet etti, çocukla konuştu, ona bazı sorular sordu. Sonra Ebû Tâlib'e döndü: Bu çocuğun büyük bir geleceği var. Onu iyi koru ve fazla ileri götürme. Ebû Tâlib de yeğenini alıp Mekke'ye döndü. Bugüne mesaj: Allah, yetim bıraktığı kulunu yalnız bırakmaz; ona sevgi dolu kalpler gönderir. Bizim de çevremizdeki yetimlere ve kimsesizlere o sevgi dolu kalp olmamız gerekir."],
["Gençlik ve el-Emîn Unvanı","Efendimizin gençliği, putlara tapınmanın, içkinin ve kabile kavgalarının yaygın olduğu bir toplumda geçti. Ama o, gençliğinde hiçbir puta secde etmedi, içki içmedi, eğlence meclislerine katılmadı. Mekke'de Haram aylarda çıkan Ficâr savaşlarında amcalarına ok toplayarak yardım etti; fakat bu kanlı çekişmelerin acısını yakından gördü. Yirmi yaşlarındayken önemli bir olay yaşandı. Yemenli bir tüccar mallarını Mekke'nin ileri gelenlerinden birine sattı, ama parasını alamadı. Garip adam Kâbe'nin yanında yüksek sesle hakkını istedi. Bunun üzerine Mekke'nin bazı ileri gelenleri Abdullah bin Cüd'ân'ın evinde toplandı ve bir yemin ettiler: Mekke'de kim zulme uğrarsa, yerli olsun yabancı olsun, hakkı alınıncaya kadar onun yanında olacağız. Bu ittifaka Hılfu'l-Fudûl, yani Faziletliler Antlaşması denir. Genç Muhammed de oradaydı. Yıllar sonra peygamber olduğunda bile şöyle diyecekti: O antlaşmaya bugün çağrılsam yine katılırım. Efendimiz ticaretle uğraştı. Alışverişte doğruydu, sözünde dururdu, kimseyi aldatmazdı. Emanete öyle sadıktı ki Mekkeliler ona isim bile koydular: el-Emîn, yani güvenilir insan. Mekke halkı en kıymetli emanetlerini ona bırakırdı. İşin ilginci, ileride ona düşman olanlar bile emanetlerini yine ona bırakmaya devam edeceklerdi. Hicret gecesi Hazreti Ali'yi Mekke'de bırakmasının bir sebebi de bu emanetleri sahiplerine teslim etmekti. Bugüne mesaj: Peygamberlikten önce Efendimizi tanıtan en güzel söz, el-Emîn sözüydü. İnsan, bir dava anlatmadan önce güvenilir olmalıdır. Bir öğretmen, bir baba, bir esnaf için de en güçlü söz, doğru ve güvenilir bir hayattır."],
["Hazreti Hatice ve Hacerü'l-Esved","Mekke'nin saygın ve zengin tüccarlarından Hatice binti Huveylid, ticaret kervanlarını güvenilir insanlarla gönderirdi. Muhammed el-Emîn'in dürüstlüğünü duyunca, ona mallarını Şam'a götürmesini teklif etti; yanına da kölesi Meysere'yi verdi. Kervan beklenenden fazla kâr ile döndü. Meysere de yolculuk boyunca gördüğü güzel ahlakı, dürüstlüğü ve vakarı hanımına tek tek anlattı. Hazreti Hatice, bu genç adamın sıradan biri olmadığını anladı ve aracı göndererek evlenme teklif etti. Efendimiz yirmi beş yaşındaydı; amcalarıyla gidip Hatice'yi istediler ve evlendiler. Bu evlilik yirmi beş yıl sürdü; Hazreti Hatice hayatta olduğu sürece Efendimiz başka bir hanımla evlenmedi. Bu yuvada Kâsım, Zeyneb, Rukiyye, Ümmü Gülsüm, Fâtıma ve Abdullah dünyaya geldi. Erkek çocukları küçük yaşta vefat etti; bu acılara sabırla katlandılar. Efendimiz otuz beş yaşındayken bir sel Kâbe'nin duvarlarını zayıflattı. Kureyş Kâbe'yi yeniden inşa etmeye karar verdi. Duvarlar yükselip Hacerü'l-Esved'in yerine konma vakti geldiğinde kabileler arasında büyük bir anlaşmazlık çıktı. Her kabile bu şerefi kendisi istiyordu; neredeyse kılıçlar çekilecekti. Sonunda şöyle karar verdiler: Harem'in kapısından ilk giren kişi hakem olsun. Kapıdan ilk giren Muhammed el-Emîn oldu. Hepsi sevindi: Emîn geldi, onun hükmüne razıyız. Efendimiz bir örtü istedi, taşı ortasına koydu ve her kabilenin reisinden örtünün bir ucundan tutmasını istedi. Taş hizasına gelince kendi mübarek eliyle yerine yerleştirdi. Kan dökülmeden mesele çözüldü. Bugüne mesaj: Hikmet, herkesi kazandıran çözümü bulabilmektir. Sınıfta, ailede ve toplumda çıkan anlaşmazlıklarda kimseyi dışarıda bırakmayan yolu aramak, peygamber sünnetidir."],
["Hira Mağarası ve İlk Vahiy","Efendimiz otuz beş yaşından sonra yalnızlığı sever oldu. Mekke'nin yakınındaki Nur Dağı'nda, Hira denilen küçük mağaraya çekilir, günlerce orada tefekkür ederdi. Bu dönemde gördüğü rüyalar, sabahın aydınlığı gibi aynen çıkıyordu. Kırk yaşına geldiğinde, Ramazan ayının bir gecesinde, Hira'da Cebrâil aleyhisselâm göründü ve ona şöyle dedi: Oku! Efendimiz, Ben okuma bilmem, diye cevap verdi. Melek onu sıkıca kucakladı, bıraktı ve tekrar, Oku, dedi. Bu üç kez tekrarlandı. Sonra ilk âyetler indi: Yaratan Rabbinin adıyla oku. O, insanı bir aşılanmış yumurtadan yarattı. Oku, Rabbin sonsuz kerem sahibidir. O, kalemle öğretendir. İnsana bilmediğini öğretendir. Dikkat edin; insanlığa gelen son mesajın ilk kelimesi okumak, ilk araçlarından biri de kalemdi. Efendimiz bu büyük olayın heyecanıyla titreyerek evine döndü: Beni örtün, beni örtün. Hazreti Hatice onu örttü, sakinleşince olanları dinledi ve tarihin en güzel teselli cümlelerinden birini söyledi: Hayır, vallahi Allah seni asla utandırmaz. Çünkü sen akrabanı gözetirsin, düşkünün yükünü taşırsın, yoksulu kazandırırsın, misafiri ağırlarsın, hak yolunda karşılaşılan sıkıntılarda yardım edersin. Sonra onu, eski kitapları bilen amcasının oğlu Varaka bin Nevfel'e götürdü. Varaka dinledi ve şöyle dedi: Bu, Mûsâ'ya gelen o büyük melektir. Keşke kavmin seni yurdundan çıkaracağı zaman genç olsaydım. Efendimiz şaşırdı: Beni çıkaracaklar mı? Varaka, Senin getirdiğin gibi bir şey getiren herkes düşmanlıkla karşılanmıştır, dedi. Bugüne mesaj: Din, Oku emriyle başladı. İlim öğrenmek ve öğretmek ibadettir. Bir de şunu unutmayalım: Zor anında Hazreti Hatice gibi güzel bir söz söylemek, bir insanı ayağa kaldırabilir."],
["İlk Müslümanlar ve Dârü'l-Erkam","İlk vahiyden sonra bir süre vahiy kesildi; Efendimiz bu dönemde büyük bir özlem duydu. Ardından Müddessir sûresinin ilk âyetleri indi: Ey örtüsüne bürünen! Kalk ve uyar. Rabbini yücelt. Davet başlamıştı. İlk iman eden, Hazreti Hatice oldu. Kadınlar arasında da, insanlar arasında da ilk Müslüman odur. Çocuklardan ilk iman eden, Efendimizin yanında büyüyen amcasının oğlu Ali'ydi; henüz on yaşlarındaydı. Azatlı kölesi ve evlatlığı Zeyd bin Hârise de hemen iman etti. Yetişkin erkeklerden ilk iman eden ise Efendimizin çocukluk arkadaşı Ebû Bekir oldu. Ebû Bekir hiç tereddüt etmedi; çünkü bu dostunun hayatında bir kez bile yalan duymamıştı. Sonra boş durmadı: Osman bin Affân, Zübeyr bin Avvâm, Abdurrahman bin Avf, Sa'd bin Ebî Vakkâs ve Talha bin Ubeydullah onun vesilesiyle Müslüman oldu. İlk üç yıl davet gizli yürütüldü. Müslümanlar namazlarını vadilerde, gözlerden uzak kılıyordu. Kalabalıklaşınca Safâ tepesinin yanındaki, genç sahabi Erkam bin Ebi'l-Erkam'ın evi bir merkez oldu. Burası tarihe Dârü'l-Erkam olarak geçti. Burada Efendimiz, yeni Müslümanlara inen âyetleri okuyor, namazı öğretiyor, onların gönüllerini terbiye ediyordu. Dârü'l-Erkam bir bakıma İslâm'ın ilk okuluydu: Öğretmeni Resûlullah, kitabı Kur'an, öğrencileri de ileride dünyaya adalet götürecek olan gençlerdi. Bu ilk Müslümanların çoğunun genç olması dikkat çekicidir. Bugüne mesaj: Büyük işler küçük ama samimi halkalarla başlar. Bir evin bir odasında, bir sınıfın bir köşesinde yapılan ihlaslı bir sohbet, nesiller boyu sürecek bir hayrın tohumu olabilir."],
["Safâ Tepesindeki Çağrı","Üç yıllık gizli davetten sonra şu âyet indi: En yakın akrabanı uyar. Efendimiz Safâ tepesine çıktı ve Arapların tehlike anında yaptığı gibi seslendi: Yâ sabâhâh! Kureyş kabileleri koşa koşa toplandı. Efendimiz sordu: Size şu dağın arkasından bir düşman süvari birliğinin geldiğini söylesem bana inanır mısınız? Hep bir ağızdan cevap verdiler: Evet, senin yalan söylediğini hiç görmedik. Bunun üzerine Efendimiz, Ben çetin bir azaptan önce sizi uyarmak için gönderildim, dedi ve onları tek Allah'a iman etmeye çağırdı. Kalabalığın içinden amcası Ebû Leheb öfkeyle bağırdı: Bunun için mi bizi topladın? Ellerin kurusun! Bunun üzerine Tebbet sûresi indi. Kureyş'in ileri gelenleri yeni dinin, putlara dayanan düzenlerini ve ticaretlerini yıkacağından korktular. Önce Ebû Tâlib'e gittiler: Yeğenin ilahlarımıza dil uzatıyor; ya onu sustur ya da aradan çekil. Ebû Tâlib yeğenini çağırıp bu ağır yükü taşıyamayacağını ima edince, Efendimiz unutulmaz cevabını verdi: Amca, vallahi güneşi sağ elime, ayı sol elime koysalar, bu davadan vazgeçmem. Ya Allah bu dini hâkim kılar ya da ben bu uğurda canımı veririm. Bu sözlerden sonra Ebû Tâlib, Git yeğenim, dilediğini söyle; vallahi seni hiçbir zaman onlara teslim etmem, dedi. Müşrikler bu sefer başka bir yol denediler: Efendimize mal, liderlik, hatta krallık teklif ettiler. Efendimiz ise karşılık olarak Fussilet sûresinden âyetler okudu. Teklifi getiren Utbe, âyetleri dinleyince rengi değişmiş olarak döndü. Bugüne mesaj: Doğru bir davanın sahibi, ne tehditle ne de dünyalıkla yolundan döndürülebilir. Efendimizin kararlılığı, inandığımız değerleri çocuklarımıza anlatırken taşımamız gereken sabrın ve sebatın en güzel örneğidir."],
["Sabrın Kahramanları","Davet açıklandıktan sonra Mekke'de Müslümanlara yönelik baskılar dayanılmaz hâle geldi. Kabilesi güçlü olanlar biraz korunuyordu, ama köleler ve kimsesizler ağır işkencelere maruz kaldı. Habeşli bir köle olan Bilâl, efendisi Ümeyye bin Halef tarafından öğle sıcağında kızgın kumlara yatırılır, göğsüne büyük kayalar konurdu. Ümeyye ondan Muhammed'i inkâr etmesini isterdi. Bilâl ise tek kelime söylerdi: Ehadün ehad, yani Allah birdir, birdir. Bir gün Ebû Bekir oradan geçti; Bilâl'i satın alıp azat etti. Yâsir, eşi Sümeyye ve oğulları Ammâr da Mekke'nin ıssız bir yerinde işkenceye uğrardı. Efendimiz yanlarından geçerken onlara şöyle seslenirdi: Sabredin ey Yâsir ailesi, sizin varacağınız yer cennettir. Sümeyye, Ebû Cehil'in elinde şehit edildi. O, İslâm tarihinin ilk şehididir. Kocası Yâsir de ardından şehit oldu. Demirci Habbâb bin Eret, kızgın demirlerle dağlandı. Bir gün Kâbe'nin gölgesinde oturan Efendimize gelip, Bizim için yardım dilemeyecek misin, dedi. Efendimiz doğruldu ve buyurdu: Sizden öncekiler testerelerle ikiye biçildi, demir taraklarla tarandı da dinlerinden dönmediler. Allah bu işi mutlaka tamamlayacak. Öyle ki bir yolcu San'a'dan Hadramevt'e kadar yalnız Allah'tan korkarak gidecek. Fakat siz acele ediyorsunuz. Efendimiz de bu eziyetlerden payını aldı. Namaz kılarken üzerine işkembe atıldı, yollarına diken döküldü, ona deli, sihirbaz, şair dediler. O ise beddua etmedi; onların hidayeti için dua etti. Bugüne mesaj: Bugün rahatça okuduğumuz Kur'an'ın, kıldığımız namazın arkasında Bilâl'in, Sümeyye'nin, Habbâb'ın sabrı vardır. Onları anmak, onların bize emanet ettiği imanı çocuklarımıza güzelce aktarmakla olur."],
["Habeşistan Hicreti","Baskılar ağırlaşınca Efendimiz ashabına şöyle dedi: Habeşistan'a gitseniz iyi olur. Orada bir hükümdar var ki yanında kimseye zulmedilmez. Peygamberliğin beşinci yılında, on bir erkek ve dört kadından oluşan ilk kafile denizi aşıp Habeşistan'a hicret etti. Aralarında Hazreti Osman ve Efendimizin kızı Rukiyye de vardı. Daha sonra bu sayı seksenin üzerine çıktı. Kureyş, Müslümanların orada huzur bulmasına tahammül edemedi. Zeki diplomatı Amr bin Âs'ı hediyelerle Necâşî'ye gönderdi. Amr, Necâşî'ye şöyle dedi: Bunlar atalarının dinini terk etmiş, ne bizim dinimize ne de sizin dininize girmiş kaçaklardır; onları bize teslim edin. Âdil bir hükümdar olan Necâşî, karşı tarafı dinlemeden hüküm vermedi. Müslümanları çağırdı. Onların adına Efendimizin amcasının oğlu Ca'fer bin Ebî Tâlib konuştu: Ey hükümdar, biz cahiliye içinde bir kavimdik. Putlara tapar, leş yer, hayasızlık yapar, akrabalık bağlarını koparırdık; güçlümüz zayıfımızı ezerdi. Allah bize içimizden, soyunu, doğruluğunu ve iffetini bildiğimiz bir peygamber gönderdi. Bizi Allah'ı birlemeye, doğru sözlü olmaya, emanete riayete, akrabayı gözetmeye, komşuya iyilik etmeye çağırdı. Necâşî, Getirdiğinden bir şey okur musun, diye sordu. Ca'fer, Meryem sûresinin başından okudu. Necâşî ağladı, sakalı ıslandı; din adamları da gözyaşlarını tutamadı. Necâşî şöyle dedi: Bu sözlerle Mûsâ'nın getirdiği aynı kandilden çıkmıştır. Gidin, siz benim ülkemde güvendesiniz. Kureyş elçileri eli boş döndü. Bugüne mesaj: Ca'fer'in konuşması, İslâm'ın özünü anlatmanın en güzel örneklerinden biridir: Tevhid, doğruluk, emanet, akraba, komşu. Dinimizi anlatırken önce bu güzel ahlakı anlatmak, kalplerin kapısını açar."],
["Hazreti Hamza ve Hazreti Ömer","Peygamberliğin altıncı yılında, Mekke'deki dengeleri değiştiren iki olay yaşandı. Bir gün Ebû Cehil Safâ tepesinde Efendimize ağır hakaretler etti. Efendimiz hiçbir cevap vermedi. Avdan dönen amcası Hamza, olanları bir cariyeden duydu. Doğruca Kâbe'ye gitti, yayını Ebû Cehil'in başına indirdi ve dedi ki: Ben de onun dinindeyim; gücün yetiyorsa bana karşı koy! Hamza o gün öfkeyle söylediği sözü, sonra kalbiyle tasdik etti ve Allah'ın Arslanı unvanını alacak kadar güçlü bir mümin oldu. Birkaç gün sonra çok daha şaşırtıcı bir olay yaşandı. Müslümanlara en sert davrananlardan Ömer bin Hattâb, kılıcını kuşanıp Efendimizi öldürmek için yola çıktı. Yolda biri ona, Önce kendi evine bak, kız kardeşin Fâtıma ve eniştesi Müslüman oldu, dedi. Ömer öfkeyle kız kardeşinin evine yöneldi. İçeride sahabi Habbâb, onlara Tâhâ sûresini öğretiyordu. Ömer kapıyı çaldı, içeri girdi, eniştesine saldırdı; kız kardeşinin yüzü kanadı. Fâtıma'nın kararlı duruşu karşısında Ömer yumuşadı ve sayfayı istedi. Okudu: Tâhâ. Biz bu Kur'an'ı sana sıkıntı çekesin diye indirmedik. Okudukça kalbi değişti. Beni Muhammed'e götürün, dedi. Dârü'l-Erkam'a gitti ve orada Müslüman oldu. Sahabiler sevinçle öyle bir tekbir getirdiler ki Mekke vadileri inledi. Efendimiz, Allah'ım İslâm'ı iki Ömer'den biriyle güçlendir, diye dua etmişti; dua kabul olmuştu. Hazreti Ömer'in Müslüman olmasından sonra Müslümanlar ilk kez Kâbe'de açıkça namaz kıldılar. Efendimiz ona Fârûk, yani hakla batılı ayıran unvanını verdi. Bugüne mesaj: Kalplerin anahtarı Allah'ın elindedir. Bugün en uzak görünen bir insan, yarın en yakın kardeşimiz olabilir. Kimsenin hidayetinden ümit kesmemeli, dua etmeye devam etmeliyiz."],
["Üç Yıllık Boykot","Hazreti Hamza ve Hazreti Ömer'in Müslüman olması, Habeşistan'daki başarı ve davetin yayılması Kureyş'i çileden çıkardı. Peygamberliğin yedinci yılında Kureyş ileri gelenleri bir karar aldı: Hâşimoğulları ve Muttaliboğulları, Muhammed'i bize teslim edinceye kadar onlarla alışveriş yapılmayacak, kız alınıp verilmeyecek, konuşulmayacak. Bu karar bir sayfaya yazılıp Kâbe'nin duvarına asıldı. Ebû Tâlib, Müslüman olmadığı hâlde yeğenini korumaya devam etti; kabilesinin Müslüman olan ve olmayan bütün mensuplarıyla birlikte Mekke'nin dışındaki bir vadiye, Şi'b-i Ebî Tâlib'e çekildi. Üç yıl sürecek ağır günler başladı. Yiyecek o kadar azaldı ki ağaç yaprakları, kurumuş deri parçaları yenildi. Açlıktan ağlayan çocukların sesleri vadinin dışından duyulurdu. Hazreti Hatice bütün servetini bu yolda harcadı. Yine de Mekke'de vicdanlı insanlar vardı. Hakîm bin Hizâm gibi bazı akrabalar geceleri gizlice develere yiyecek yükleyip vadiye gönderirdi. Zamanla Hişâm bin Amr, Züheyr bin Ebî Ümeyye ve birkaç kişi bu zulme son vermek için bir araya geldi. Tam o günlerde Efendimiz, amcası Ebû Tâlib'e Allah'ın bildirdiğini haber verdi: Kâbe'deki boykot sayfasını güveler yemiş, yalnızca Allah'ın isminin yazılı olduğu kısım kalmıştı. Ebû Tâlib bunu Kureyş'e söyledi; sayfaya baktılar, haber aynen doğru çıktı. Boykot sona erdi. Bugüne mesaj: Zulme karşı sessiz kalmayıp gizlice yiyecek taşıyan, sonra da cesaretle sesini yükselten insanlar, karanlık günlerin isimsiz kahramanlarıdır. Haksızlığa uğrayan kim olursa olsun, onun yanında durmak insanlık borcudur."],
["Hüzün Yılı ve Tâif","Boykotun bitmesinden kısa bir süre sonra, peygamberliğin onuncu yılında Efendimiz art arda iki büyük acı yaşadı. Önce onu kırk yıl koruyan amcası Ebû Tâlib vefat etti. Birkaç hafta sonra da en zor günlerinde yanında olan, malını ve canını bu davaya adayan sevgili eşi Hazreti Hatice vefat etti. Bu yüzden bu yıla Senetü'l-Hüzn, yani Hüzün Yılı denir. Ebû Tâlib'in vefatından sonra müşriklerin eziyeti arttı. Efendimiz, belki destek bulurum ümidiyle, yanında Zeyd bin Hârise ile yürüyerek Tâif'e gitti. Tâif'in ileri gelenleri onu kaba sözlerle geri çevirdiler. Bununla da yetinmeyip çocukları ve ayak takımını peşine taktılar. Taş yağmuru altında kaldılar; Efendimizin mübarek ayakları kanadı, Zeyd onu korumaya çalışırken başından yaralandı. Şehrin dışındaki bir bağa sığındılar. Efendimiz orada ellerini kaldırıp şu yürek yakan duayı yaptı: Allah'ım, kuvvetimin azlığını, çaresizliğimi ve insanlar nezdindeki değersizliğimi sana arz ediyorum. Ey merhametlilerin en merhametlisi! Eğer bana karşı öfkeli değilsen, çektiklerime hiç aldırmam. Bağın sahipleri, Addâs adında Hristiyan bir köleyle bir tabak üzüm gönderdiler. Efendimiz Bismillâh diyerek yedi. Addâs, Ninovalı olduğunu söyleyince Efendimiz, Kardeşim Yûnus'un memleketi, dedi. Addâs onun ellerini ve ayaklarını öptü. Dönüş yolunda dağlar meleği gelip, istersen şu iki dağı onların üzerine kapatayım, dedi. Efendimizin cevabı rahmetin özüdür: Hayır. Ben, Allah'ın onların soyundan yalnız O'na ibadet eden nesiller çıkarmasını umarım. Bugüne mesaj: Taşlandığı yerde beddua yerine dua eden bir Peygamber'in ümmetiyiz. Kırıldığımız yerde bile gelecek nesillerin hayrını düşünmek, peygamber ahlakıdır."],
["İsrâ ve Miraç","Hüzün Yılı'nın ardından, Allah Teâlâ Resûlüne eşsiz bir ikramda bulundu. Bir gece Cebrâil aleyhisselâm geldi; Efendimiz Burak denilen bir binekle Mescid-i Haram'dan Kudüs'teki Mescid-i Aksâ'ya götürüldü. Bu gece yolculuğuna İsrâ denir; İsrâ sûresinin ilk âyeti bunu anlatır. Mescid-i Aksâ'da peygamberlere imam olarak namaz kıldırdı. Oradan da göklere yükseltildi; buna Miraç denir. Gök katlarında Hazreti Âdem, Yahyâ, Îsâ, Yûsuf, İdrîs, Hârûn, Mûsâ ve İbrâhim ile karşılaştı. Sidretü'l-Müntehâ'ya kadar yükseldi; Necm sûresi, gözünün kaymadığını ve sınırı aşmadığını, Rabbinin en büyük âyetlerinden bir kısmını gördüğünü haber verir. Bu gecede ümmete üç büyük hediye verildi: Beş vakit namaz, Bakara sûresinin son iki âyeti olan Âmenerrasûlü ve Allah'a hiçbir şeyi ortak koşmadan ölen ümmetin bağışlanacağı müjdesi. Namaz önce elli vakit olarak farz kılınmış, Hazreti Mûsâ'nın tavsiyesiyle Efendimiz defalarca hafifletilmesini istemiş, sonunda beş vakte indirilmiştir; ama sevabı ellidir. Sabah olunca Efendimiz yaşadıklarını anlattı. Müşrikler alay ettiler ve koşarak Ebû Bekir'e gittiler: Arkadaşın bir gecede Kudüs'e gidip geldiğini söylüyor! Ebû Bekir'in cevabı imanın tarifidir: Eğer o söylediyse doğrudur. Ben ona bundan daha uzak olan gökten haber geldiğine inanıyorum. O günden sonra Ebû Bekir'e Sıddîk, yani tasdik eden dendi. Bugüne mesaj: Namaz, Miraç'ın hediyesidir ve müminin miracıdır. Her gün beş kez Rabbimizin huzuruna çıkma imkânını kıymetli bilmek, bu gecenin en güzel hatırasıdır."],
["Akabe Biatları ve İlk Muallim","Efendimiz hac mevsimlerinde Mekke'ye gelen kabilelere tek tek gidip İslâm'ı anlatıyordu. Peygamberliğin on birinci yılında Medine'den, o zamanki adıyla Yesrib'den gelen altı kişi onu Akabe denilen yerde dinledi ve Müslüman oldu. Ertesi yıl on iki kişi geldi ve Efendimize biat etti. Bu Birinci Akabe Biatı'dır. Bu insanlar şunlara söz verdiler: Allah'a ortak koşmamak, hırsızlık yapmamak, zina etmemek, çocuklarını öldürmemek, iftira etmemek ve iyilikte Resûlullah'a karşı gelmemek. Medineliler, onlara dinlerini öğretecek birini istediler. Efendimiz genç sahabi Mus'ab bin Umeyr'i gönderdi. Mus'ab, Mekke'nin en şık giyinen, ailesinin en çok şımarttığı genciydi; iman ettikten sonra her şeyini bu dava için bırakmıştı. Şimdi İslâm'ın ilk muallimi, yani ilk öğretmeni olarak Medine'ye gidiyordu. Mus'ab, Medine'de ev ev dolaştı, Kur'an okudu, güler yüzle anlattı. Kendisine kızarak mızrağıyla gelen Üseyd bin Hudayr'a şöyle dedi: Otur, dinle. Beğenirsen kabul edersin, beğenmezsen seni rahatsız eden şeyi bırakırız. Üseyd dinledi ve Müslüman oldu; arkasından kabilesinin reisi Sa'd bin Muâz da iman etti ve bütün kabilesi Müslüman oldu. Bir yıl içinde Medine'de İslâm'ın girmediği ev neredeyse kalmadı. Ertesi yıl yetmiş beş Medineli Akabe'de gizlice toplandı ve İkinci Akabe Biatı yapıldı. Efendimizi kendi canları gibi koruyacaklarına söz verdiler. Hicretin yolu açılmıştı. Bugüne mesaj: Bir şehrin kalbini, sabırlı ve güler yüzlü bir öğretmen fethetti. Mus'ab'ın Otur, dinle, cümlesi, iyi bir öğretmenin bütün sırrını taşır: Zorlamadan, güzellikle, dinleyerek anlatmak."],
["Hicret Yolculuğu","Müslümanlar Medine'ye küçük gruplar hâlinde hicret ederken Kureyş, Dârü'n-Nedve'de toplanıp korkunç bir karar aldı: Her kabileden bir genç seçilecek, hepsi birlikte Efendimize saldıracak, böylece kanı kabilelere dağılacaktı. Allah, Resûlüne bu tuzağı bildirdi ve hicret izni verdi. O gece Efendimiz, Hazreti Ali'yi kendi yatağına yatırdı ve ona Mekkelilerin emanetlerini sahiplerine teslim etmesini söyledi. Evi kuşatan gençlerin arasından Yâsîn sûresinin başını okuyarak çıktı. Hazreti Ebû Bekir ile buluştular ve beklenenin aksine kuzeye, Medine yönüne değil, güneye, Sevr Dağı'na yöneldiler. Üç gün Sevr mağarasında kaldılar. Ebû Bekir'in oğlu Abdullah geceleri gelip Mekke'deki haberleri getirdi; kızı Esmâ yiyecek taşıdı; çobanı Âmir de koyunlarını oradan geçirerek izleri sildi. Müşrikler mağaranın ağzına kadar geldiler. Ebû Bekir, Ya Resûlallah, biri ayaklarının altına baksa bizi görecek, dedi. Efendimiz sükûnetle cevap verdi: İkincileri Allah olan iki kişi hakkında ne düşünürsün? Üzülme, Allah bizimle beraberdir. Tevbe sûresi bu anı anlatır. Sonra deniz kıyısından, bilinmeyen yollardan Medine'ye doğru yola çıktılar. Büyük ödül için peşlerine düşen Sürâka bin Mâlik'in atının ayakları üç kez kuma gömüldü. Sürâka aman diledi. Efendimiz ona, Kisrâ'nın bilezikleri kollarına takıldığında hâlin nice olur, diye müjde verdi; bu söz yıllar sonra Hazreti Ömer zamanında gerçekleşti. Yolda Ümmü Ma'bed'in çadırına uğradılar; kuru keçi Efendimizin bereketiyle süt verdi. Bugüne mesaj: Hicret, tevekkülle tedbirin birlikte yaşandığı bir yolculuktur. Efendimiz her tedbiri aldı, sonra Üzülme, Allah bizimle, dedi. Biz de işlerimizi planlayıp, sonucu Allah'a bırakmalıyız."],
["Kuba ve Medine'ye Varış","Medineliler, Efendimizin yola çıktığını duyduğundan beri her sabah şehrin dışındaki tepelere çıkıp yolu gözlüyor, öğle sıcağı bastırınca evlerine dönüyorlardı. Bir gün bir Yahudi, yüksek bir yerden onları görünce bağırdı: Ey Araplar, beklediğiniz kişi geldi! Medine bayram yerine döndü. Efendimiz önce Medine'nin yakınındaki Kuba köyünde birkaç gün kaldı ve burada İslâm tarihinin ilk mescidini inşa etti. Bu mescidin taşlarını sahabilerle birlikte kendi mübarek elleriyle taşıdı. Tevbe sûresinde, ilk günden takva üzerine kurulan mescid diye övülen yer burasıdır. Bir cuma günü Kuba'dan Medine'ye doğru yola çıktı; yolda Benî Sâlim yurdunda ilk cuma namazını kıldırdı. Medine'ye girişinde çocuklar, kadınlar, erkekler sevinçle yollara döküldü. Rivayetlere göre Medineliler şöyle söylüyordu: Vedâ tepelerinden üzerimize dolunay doğdu; Allah'a dua eden dua ettikçe bize şükür gerekir. Bugün Tala'al Bedru diye bildiğimiz bu nağme, o sevincin hatırasıdır. Herkes Efendimizi kendi evinde misafir etmek istiyor, devesinin yularına yapışıyordu. Efendimiz ise şöyle buyurdu: Bırakın onu, o emrolunmuştur. Deve, bugünkü Mescid-i Nebevî'nin yerinde çöktü. En yakın ev Ebû Eyyûb el-Ensârî'nin eviydi. Efendimiz mescid ve odaları bitene kadar yedi ay kadar onun evinde kaldı. Ebû Eyyûb ve hanımı, Resûlullah alt katta kaldığı için üst katta yürümeye bile çekinirlerdi. Bu hicret, İslâm'ın yeni bir döneminin başlangıcıydı; Hazreti Ömer zamanında hicrî takvimin başlangıcı olarak kabul edildi. Bugüne mesaj: Medine'nin adı artık Medînetü'n-Nebî, yani Peygamber şehriydi. Bir şehri güzelleştiren binaları değil, oradaki insanların sevgisi ve kucaklayıcılığıdır. Evimizi, sınıfımızı da sevgiyle bir küçük Medine yapabiliriz."],
["Mescid-i Nebevî, Suffe ve Kardeşlik","Efendimiz Medine'de ilk iş olarak mescidi inşa etti. Duvarları kerpiç, direkleri hurma kütüğü, çatısı hurma dallarıydı. Yine sahabilerle birlikte taş taşıdı, toprak kazdı. Bu sade mescid sadece namaz kılınan bir yer değildi; aynı zamanda okul, meclis, misafirhane ve devletin merkeziydi. Mescidin bir köşesinde, üstü örtülü bir sofa vardı: Suffe. Burada evi barkı olmayan, kendini ilme adamış sahabiler kalırdı. Gündüz Kur'an ve din öğrenir, geceleri ibadet ederlerdi. Ebû Hüreyre bunlardan biriydi; binlerce hadisi bize ulaştırmasının sırrı, Suffe'de Efendimizin yanından ayrılmamasıydı. Suffe, İslâm tarihinin ilk yatılı okulu sayılır. Efendimiz Suffe ehline özel ilgi gösterir, gelen hediyeleri onlarla paylaşırdı. Medine'de ikinci büyük adım, kardeşlikti. Mekke'den her şeyini bırakıp gelen muhacirler ile onları kucaklayan Medineli ensâr arasında Muâhât, yani kardeşlik kuruldu. Her muhacir bir ensarla kardeş ilan edildi. Ensardan Sa'd bin Rebî, kardeşi Abdurrahman bin Avf'a malının yarısını teklif etti. Abdurrahman teşekkür etti ve şöyle dedi: Allah malını sana mübarek kılsın; bana çarşının yolunu göster. Kısa sürede ticaretle kendi ayakları üzerinde durdu. Efendimiz ayrıca Medine'deki Müslümanlar, Yahudi kabileleri ve diğer topluluklar arasında karşılıklı hak ve sorumlulukları belirleyen bir yazılı belge hazırlattı; buna Medine Vesikası denir. Bugüne mesaj: Medine toplumunun üç temeli vardı: Mescid, yani Allah ile bağ; Suffe, yani ilim; kardeşlik, yani insanlarla bağ. Bir okul ya da bir aile de ancak bu üçüyle sağlam olur: İbadet, ilim ve paylaşma."],
["Kıblenin Değişmesi ve Bedir","Hicretten sonra Müslümanlar on altı-on yedi ay kadar Kudüs'e, Mescid-i Aksâ'ya doğru namaz kıldılar. Efendimiz ise kıblenin, babası İbrâhim'in inşa ettiği Kâbe olmasını arzu ediyor, yüzünü gökyüzüne çeviriyordu. Hicretin ikinci yılında, bir namaz esnasında Bakara sûresinin âyetleri indi: Yüzünü Mescid-i Haram tarafına çevir. Efendimiz ve cemaat namazın içinde Kâbe'ye döndüler. O mescide bugün Mescid-i Kıbleteyn, yani iki kıbleli mescid denir. Aynı yıl Ramazan orucu, fıtır sadakası ve zekât farz kılındı. Yine o yılın Ramazan ayında İslâm tarihinin ilk büyük savaşı yaşandı. Kureyş'in büyük bir ticaret kervanı Şam'dan dönüyordu. Mekke'de el konulan mallarının karşılığı olarak Müslümanlar kervana yöneldi. Kervan başka yoldan kurtuldu, ama Ebû Cehil bin kişilik bir orduyla Medine'ye doğru yürüdü. Müslümanların sayısı üç yüz on üç kadardı; atları ve silahları çok azdı. Efendimiz ashabıyla istişare etti. Ensardan Sa'd bin Muâz ayağa kalktı: Ya Resûlallah, bize denizi göstersen dalarız; seninle birlikte olduğumuz sürece geri dönmeyiz. Savaştan önceki gece Efendimiz sabaha kadar dua etti: Allah'ım, bana verdiğin sözü yerine getir. Bu küçük topluluk helak olursa yeryüzünde sana ibadet edecek kimse kalmayacak. Ramazan'ın on yedisinde, Bedir kuyularının başında savaş oldu. Allah meleklerle yardım etti ve Müslümanlar büyük bir zafer kazandı. Ebû Cehil dahil Kureyş'in pek çok ileri geleni öldü. Bedir'e katılan sahabilere Ehl-i Bedir denir; isimleri bugün hâlâ dua ile anılır. Bugüne mesaj: Bedir, sayının değil iman, sadakat ve duanın kazandığı bir zaferdir. Efendimiz bütün tedbirleri aldıktan sonra sabaha kadar dua etti. Tedbir ve dua, müminin iki kanadıdır."],
["Bedir Esirleri ve Okuma Yazma","Bedir zaferinden sonra Müslümanların elinde yetmiş kadar esir vardı. Efendimiz esirlere iyi davranılmasını emretti. Bazı sahabiler hurma yer, ekmeklerini esirlere verirdi. Esirlerin bir kısmı fidye ödeyerek serbest kaldı. Fakat fidye ödeyecek malı olmayanlar için Efendimiz tarihte eşine az rastlanır bir karar verdi: Okuma yazma bilen her esir, Medineli on çocuğa okuma yazma öğretirse serbest kalacaktı. Düşünün; daha yeni kurulan, düşmanla çevrili bir toplumda, savaş esirlerinden alınacak en kıymetli fidye ilim olarak belirleniyor. Vahyi yazacak kâtipleriyle tanıdığımız Zeyd bin Sâbit gibi genç sahabilerin bir kısmı okuma yazmayı bu dönemde öğrendi. Zeyd, daha sonra Efendimizin emriyle kısa sürede İbranice ve Süryanice de öğrenecek, Hazreti Ebû Bekir zamanında Kur'an'ı mushaf hâlinde toplayan heyetin başkanı olacaktı. Efendimiz, İlim öğrenmek her Müslümana farzdır, buyurmuştu. Mescid-i Nebevî'de ilim halkaları kurulur, Suffe'de dersler yapılırdı. Bir gün mescide girdiğinde iki halka gördü: Birinde dua ve zikir yapılıyor, diğerinde ilim öğreniliyordu. Her ikisinin de hayır üzere olduğunu söyledi ve ilim halkasına oturdu; bu rivayet zayıf kabul edilse de, ilme verdiği değer pek çok sahih hadiste açıkça görülür. Bugüne mesaj: Bir öğretmenin bir çocuğa harf öğretmesi, Bedir'in ardından verilen bu kararla aynı değeri taşır. Öğrettiğimiz her harf, çocuğun hayatında açılan bir kapıdır. Öğretmenlik, Peygamber'in değer verdiği bir emanettir."],
["Uhud: Sözün Değeri","Bedir'in intikamını almak isteyen Kureyş, hicretin üçüncü yılında üç bin kişilik bir orduyla Medine'ye yürüdü. Efendimiz ashabıyla istişare etti. Kendisi şehirde kalıp savunmayı düşünüyordu; ama Bedir'e katılamamış heyecanlı gençler dışarı çıkıp savaşmayı istedi. Efendimiz çoğunluğun görüşüne uydu, zırhını giydi ve yaklaşık bin kişiyle çıktı; münafıkların reisi Abdullah bin Übey ve adamları yolda geri döndü. Kalan yedi yüz kişiyle Uhud Dağı'nın eteğinde saf tutuldu. Efendimiz, ordunun arkasını korumak için Ayneyn tepesine Abdullah bin Cübeyr komutasında elli okçu yerleştirdi ve onlara çok açık bir emir verdi: Kuşların bizi kaptığını görseniz bile, ben size haber göndermedikçe yerinizden ayrılmayın. Savaşın başında Müslümanlar üstün geldi; düşman kaçmaya başladı. Bunu gören okçuların çoğu, Savaş bitti, deyip ganimet toplamak için tepeden indi. Komutanları onlara emri hatırlattı, ama dinletemedi. Henüz Müslüman olmamış olan Hâlid bin Velîd bu boşluğu gördü ve süvarileriyle arkadan saldırdı. Savaşın seyri değişti. Yetmiş sahabi şehit oldu. Efendimizin mübarek dişi kırıldı, yüzü yaralandı. Amcası Hazreti Hamza da şehit düştü; Efendimiz onun başında çok ağladı. Bu acı tablo içinde bile Efendimizin dilinden şu dua döküldü: Allah'ım, kavmimi bağışla; çünkü onlar bilmiyorlar. Uhud, Âl-i İmrân sûresinde uzun uzun anlatılır ve âyetler müminlere yenilginin sebeplerini öğretir. Bugüne mesaj: Uhud'un dersi açıktır: Verilen söze ve emre sadakat, zaferin şartıdır. Küçük bir dünyalık için yerini terk etmek, büyük kayıplara yol açabilir. Kendi tepemizi, yani sorumluluğumuzu bırakmamalıyız."],
["Hendek: İstişare ve Birlikte Çalışmak","Hicretin beşinci yılında Kureyş, Arap kabileleri ve Medine'den sürülen bazı Yahudi gruplarıyla birleşerek on bin kişilik büyük bir ordu topladı. Medine'de en fazla üç bin savaşçı vardı. Efendimiz yine ashabıyla istişare etti. İranlı bir sahabi olan Selmân-ı Fârisî söz aldı: Ya Resûlallah, biz Fars diyarında kuşatıldığımızda etrafımıza hendek kazardık. Bu fikir Araplar arasında bilinmiyordu, ama Efendimiz hemen kabul etti. Medine'nin açık olan kuzey tarafına uzun bir hendek kazılmasına başlandı. Soğuk ve kıtlık günleriydi. Sahabiler açlıktan karınlarına taş bağlamıştı; Efendimizin karnında ise iki taş vardı. O da sahabilerle birlikte kazma salladı, toprak taşıdı; göğsü toz içinde kaldı. Kazarken birlikte şiir söylüyorlardı: Allah'ım, gerçek hayat âhiret hayatıdır; ensarı ve muhacirleri bağışla. Bir ara sahabilerin kıramadığı büyük bir kayaya Efendimiz kazmayı vurdu; her vuruşta kıvılcımlar çıktı ve Efendimiz Şam, İran ve Yemen'in fethini müjdeledi. Hendek tam zamanında bitti. Gelen ordu, hiç görmedikleri bu engel karşısında şaşırıp kaldı. Yaklaşık bir ay süren kuşatma boyunca soğuk ve açlık her iki tarafı da zorladı. Sonunda Allah şiddetli bir rüzgâr gönderdi; düşmanın çadırları söküldü, ateşleri söndü, kazanları devrildi. Birlikleri dağıldı ve geri çekildiler. Ahzâb sûresi bu günleri anlatır. Efendimiz şöyle buyurdu: Artık biz onlara gideceğiz; onlar bize gelemeyecekler. Bugüne mesaj: Lider Efendimizdi; ama fikir Selmân'dan geldi ve Efendimiz o fikri sevinçle kabul etti. Sonra da herkesle birlikte toprak taşıdı. İyi bir öğretmen de iyi bir lider de dinler, fikre değer verir ve işin içinde bizzat bulunur."],
["Hudeybiye: Görünmeyen Zafer","Hicretin altıncı yılında Efendimiz bir rüya gördü: Ashabıyla birlikte Kâbe'yi tavaf ediyorlardı. Bin dört yüz kadar sahabiyle, savaş niyeti olmadığını göstermek için yalnız yolcu kılıçlarıyla ve kurbanlıklarıyla umre için yola çıktılar. Kureyş onların Mekke'ye girmesine izin vermedi. Müslümanlar Hudeybiye denilen yerde konakladılar. Elçi olarak gönderilen Hazreti Osman'ın öldürüldüğü haberi gelince, Efendimiz bir ağacın altında ashabından ölünceye kadar yanında olacaklarına dair biat aldı. Buna Rıdvan Biatı denir; Fetih sûresi bu biati yapanlardan Allah'ın razı olduğunu bildirir. Sonra Osman'ın sağ olduğu anlaşıldı ve Kureyş anlaşma istedi. Antlaşmanın maddeleri ilk bakışta Müslümanların aleyhine görünüyordu: Bu yıl umre yapılmadan dönülecek, on yıl savaş olmayacak, Mekke'den Medine'ye kaçan bir Müslüman geri verilecek, ama Medine'den Mekke'ye kaçan geri verilmeyecekti. Antlaşma yazılırken Kureyş elçisi Süheyl, Allah'ın Resûlü Muhammed ifadesine itiraz etti. Efendimiz, Ben Allah'ın Resûlüyüm, siz yalanlasanız da; Abdullah oğlu Muhammed yazın, dedi. Sahabiler çok üzülmüştü. Hazreti Ömer bile sorular sordu. Efendimiz ise sükûnetle, Ben Allah'ın kulu ve elçisiyim; O'nun emrine karşı gelmem, O da beni zayi etmez, buyurdu. Dönüş yolunda Fetih sûresi indi: Şüphesiz biz sana apaçık bir fetih verdik. Gerçekten de barış ortamında İslâm hızla yayıldı; iki yıl içinde Müslümanların sayısı katlanarak arttı. Efendimiz bu dönemde Bizans, İran, Habeşistan ve Mısır hükümdarlarına İslâm'a davet mektupları gönderdi. Bugüne mesaj: Bazen geri adım gibi görünen sabırlı bir karar, en büyük kazancın kapısıdır. Öfkeyle değil, basiretle karar vermek, Hudeybiye'nin öğrettiği hikmettir."],
["Hayber, Umre ve Mûte","Hudeybiye'den kısa bir süre sonra, hicretin yedinci yılında, Medine'ye karşı sürekli düşmanca ittifaklar kuran Hayber'deki kaleler fethedildi. Efendimiz sancağı, Bu sancağı Allah'ı ve Resûlünü seven, Allah'ın ve Resûlünün de sevdiği birine vereceğim, diyerek Hazreti Ali'ye verdi. Aynı yıl Habeşistan'daki muhacirler, Ca'fer bin Ebî Tâlib önderliğinde Medine'ye döndü. Efendimiz Ca'fer'i kucakladı ve şöyle dedi: Bilmiyorum, Hayber'in fethine mi sevineyim, Ca'fer'in gelişine mi? Bir yıl önce Hudeybiye'de yapılamayan umre, antlaşma gereği hicretin yedinci yılında yapıldı; buna Umretü'l-Kazâ denir. Müslümanlar yıllar sonra Kâbe'yi tavaf ettiler; Bilâl'in sesi Mekke vadisinde yankılandı. Hicretin sekizinci yılında, Efendimizin Busrâ valisine gönderdiği elçi Hâris bin Umeyr, Bizans'a bağlı bir emir tarafından öldürüldü. Elçi öldürmek o dönemde de büyük bir suçtu. Efendimiz üç bin kişilik bir ordu hazırladı ve komutanları sırayla bildirdi: Zeyd bin Hârise, o şehit olursa Ca'fer bin Ebî Tâlib, o da şehit olursa Abdullah bin Revâha. Ordu, bugünkü Ürdün topraklarındaki Mûte'de kat kat kalabalık bir orduyla karşılaştı. Üç komutan sırayla şehit oldu. Ca'fer'in iki kolu kesildiğinde sancağı göğsüyle taşıdığı rivayet edilir; Efendimiz onun için, Allah ona cennette iki kanat verdi, buyurdu ve ona Ca'fer-i Tayyâr denildi. Sonra sancağı Hâlid bin Velîd aldı ve ustaca bir manevra ile orduyu kurtardı. Efendimiz ona Seyfullah, yani Allah'ın kılıcı unvanını verdi. Bugüne mesaj: Mûte'de sancak düşmedi; biri bırakınca diğeri aldı. Hayırlı işler de böyledir. Bir öğretmen emekli olur, bir başkası devralır; bayrağı yere düşürmemek her neslin görevidir."],
["Mekke'nin Fethi: Bugün Size Kınama Yok","Hicretin sekizinci yılında, Kureyş'in müttefiki olan bir kabile, Müslümanların müttefiki Huzâa kabilesine gece baskını yaptı ve Kureyş de onlara silah yardımında bulundu. Hudeybiye Antlaşması böylece Kureyş tarafından bozulmuş oldu. Efendimiz on bin kişilik bir orduyla, hedefini gizli tutarak yola çıktı. Mekke'ye yaklaştıklarında geceleyin her askerin ayrı ateş yakmasını emretti; vadiyi dolduran ateşleri gören Kureyş direnmenin imkânsız olduğunu anladı. Kureyş'in lideri Ebû Süfyân gelip Müslüman oldu. Efendimiz şöyle ilan ettirdi: Ebû Süfyân'ın evine giren güvendedir; evinde kapısını kapatan güvendedir; Mescid-i Haram'a giren güvendedir. Efendimiz Mekke'ye, devesinin üzerinde, tevazuyla başı öne eğik, Fetih sûresini okuyarak girdi. Yirmi bir yıl önce gizlice çıktığı şehre, kan dökülmeden fâtih olarak dönmüştü. Kâbe'ye gitti, tavaf etti ve etrafındaki üç yüz altmış putu elindeki çubukla birer birer devirdi; bir yandan da şu âyeti okuyordu: Hak geldi, batıl yok oldu. Batıl zaten yok olmaya mahkûmdur. Kâbe'nin içindeki resimler silindi. Sonra yıllarca kendisine eziyet eden, ashabını öldüren, onu yurdundan çıkaran Mekkelilere döndü: Size ne yapacağımı sanıyorsunuz? Hepsi, Sen kerem sahibi bir kardeş ve kerem sahibi bir kardeşin oğlusun, dedi. Efendimiz, Hazreti Yûsuf'un kardeşlerine söylediği sözü tekrarladı: Bugün size kınama yok. Gidin, hepiniz serbestsiniz. Ardından Bilâl, Kâbe'nin damına çıktı ve ezan okudu. Bir zamanlar kızgın kumlarda Ehad, ehad diye inleyen o ses, şimdi Kâbe'nin üstünden bütün Mekke'ye Allah'ın birliğini ilan ediyordu. Bugüne mesaj: Güçlüyken affetmek, kahramanlığın en yükseğidir. Bize kırgınlık verenlere karşı kalbimizi kin ile değil, Mekke'nin Fethi'ndeki af ile doldurabiliriz."],
["Huneyn, Tebük ve Fedakârlık","Mekke'nin fethinden hemen sonra Hevâzin ve Sakîf kabileleri büyük bir orduyla Müslümanlara karşı toplandı. On iki bin kişilik İslâm ordusu, Huneyn vadisinde sayısının çokluğuna güvenmişti. Sabahın alacakaranlığında pusuya düşüp dağıldı. Efendimiz ise yerinden kıpırdamadı; bir avuç sahabiyle birlikte sabit durdu ve şöyle seslendi: Ben peygamberim, bu yalan değil; ben Abdülmuttalib'in torunuyum. Amcası Abbâs'ın gür sesiyle yapılan çağrı üzerine sahabiler geri döndü ve zafer kazanıldı. Tevbe sûresi, çokluğun onlara bir fayda vermediğini hatırlatır. Hicretin dokuzuncu yılında Bizans'ın büyük bir ordu hazırladığı haberi geldi. Mevsim çok sıcak, hurmaların toplanma zamanı, yol çok uzundu. Buna Ceyşü'l-Usre, yani zorluk ordusu denir. Efendimiz sefer için yardım istedi. Hazreti Ömer malının yarısını getirdi. Hazreti Ebû Bekir ise bütün malını getirdi. Efendimiz sordu: Ailene ne bıraktın? Ebû Bekir'in cevabı: Onlara Allah'ı ve Resûlünü bıraktım. Hazreti Osman yüzlerce deve ve binlerce dinar vererek ordunun büyük bir kısmını donattı. Efendimiz, Bugünden sonra Osman'a yaptıklarından dolayı bir zarar yoktur, buyurdu. Malı olmayan bazı sahabiler ise sefere katılamadıkları için ağlayarak geri döndüler; Tevbe sûresi onların bu samimiyetini över. Otuz bin kişilik ordu Tebük'e kadar ilerledi. Bizans ordusu karşılarına çıkmadı. Efendimiz bölgedeki kabilelerle antlaşmalar yaparak döndü. Bugüne mesaj: Fedakârlık sadece malla olmaz. Kimi malını verir, kimi gözyaşını. Allah, imkânı olmadığı için yapamayıp üzülenin niyetini de görür. Önemli olan, hayra koşan bir kalp taşımaktır."],
["Heyetler Yılı","Mekke'nin fethinden ve Tebük seferinden sonra Arap Yarımadası'nın dört bir yanındaki kabileler, İslâm'ı öğrenmek ve Efendimizle görüşmek için Medine'ye heyetler göndermeye başladı. Hicretin dokuzuncu yılı bu yüzden Senetü'l-Vüfûd, yani Heyetler Yılı olarak anılır. Efendimiz gelen her heyeti güler yüzle karşılar, en güzel elbisesini giyer, onlara ikramda bulunur, mescidde misafir ederdi. Necran'dan gelen Hristiyan heyeti Mescid-i Nebevî'de ağırlandı; ibadet vakitleri gelince kendi ibadetlerini yapmalarına izin verildi. Efendimiz heyetlere İslâm'ı anlatırken onların hâline göre konuşurdu. Bazen soruların cevabını kısa ve öz verir, bazen bir hikâye anlatırdı. Kabilelerden gelen gençlerin yanında bir süre kalıp namazı ve Kur'an'ı öğrenmelerini sağlar, dönerken de aralarından en çok Kur'an bilenini onlara imam tayin ederdi. Sakîf heyetinden genç bir sahabi olan Osman bin Ebi'l-Âs, Kur'an'ı en çok öğrenen olduğu için kabilesine imam yapıldı. Efendimiz ona şu tavsiyede bulundu: Cemaate namaz kıldırırken hafif tut; çünkü aralarında yaşlı, hasta ve işi olan vardır. Yemen'e öğretmen ve vali olarak gönderdiği Muâz bin Cebel ile Ebû Mûsâ el-Eş'arî'ye verdiği öğüt ise öğretmenler için altın bir kuraldır: Kolaylaştırın, zorlaştırmayın; müjdeleyin, nefret ettirmeyin; birbirinizle anlaşın, ayrılığa düşmeyin. Aynı yıl hac farz kılındı ve Efendimiz, Hazreti Ebû Bekir'i hac emiri olarak gönderdi. Bugüne mesaj: Efendimiz herkesi hâline göre karşıladı, kimseyi kapıdan geri çevirmedi. Kolaylaştırın, zorlaştırmayın; müjdeleyin, nefret ettirmeyin. Bu cümle, her öğretmenin sınıf kapısına asılacak bir düsturdur."],
["Veda Haccı ve Veda Hutbesi","Hicretin onuncu yılında Efendimiz hac için yola çıkacağını ilan etti. Yarımadanın her yerinden insanlar akın akın geldi; yüz bini aşkın Müslüman onunla birlikte hac yaptı. Bu, Efendimizin ilk ve son haccıydı; bu yüzden Veda Haccı denir. Efendimiz haccın bütün menâsikini bizzat yaparak ashabına öğretti ve şöyle buyurdu: Hac ibadetlerinizi benden alın; belki bu yıldan sonra sizinle bir daha buluşamam. Arefe günü Arafat'ta, devesi Kasvâ'nın üzerinde, insanlığa tarihî hutbesini irad etti. Hutbenin bazı esasları şunlardı: Ey insanlar! Bu ayınız, bu şehriniz, bu gününüz nasıl mukaddes ise canlarınız, mallarınız ve namuslarınız da öyle mukaddestir. Cahiliye devrinin bütün kan davaları ve faizi kaldırılmıştır. Kadınların haklarına riayet etmenizi ve onlara iyi davranmanızı tavsiye ederim; siz onları Allah'ın emaneti olarak aldınız. Size bir emanet bırakıyorum ki ona sarıldıkça yolunuzu asla kaybetmezsiniz: Allah'ın Kitabı. Rabbiniz birdir, babanız birdir; hepiniz Âdem'densiniz, Âdem de topraktandır. Arabın Arap olmayana, Arap olmayanın Araba üstünlüğü yoktur; üstünlük ancak takva iledir. Bu esaslar, insan haklarının en güzel beyannamelerinden biridir. Hutbenin sonunda Efendimiz sordu: Size tebliğ ettim mi? Kalabalık hep bir ağızdan, Evet, tebliğ ettin, dedi. Efendimiz şahadet parmağını göğe kaldırıp indirerek üç kez, Şahit ol Allah'ım, dedi. Sonra şunu ekledi: Burada bulunanlar bulunmayanlara ulaştırsın. Aynı günlerde Mâide sûresinin şu âyeti indi: Bugün sizin için dininizi kemale erdirdim, üzerinizdeki nimetimi tamamladım ve size din olarak İslâm'ı beğendim. Bugüne mesaj: Burada bulunanlar bulunmayanlara ulaştırsın. Bu cümle bize verilmiş bir görevdir. Öğrendiğimiz güzellikleri çocuklarımıza ve öğrencilerimize ulaştırmak, Veda Hutbesi'nin emanetidir."],
["Vefat: Refîk-i A'lâ","Veda Haccı'ndan döndükten birkaç ay sonra, hicretin on birinci yılının Safer ayının sonlarında Efendimiz, Bakî kabristanını ziyaretinden döndükten sonra rahatsızlandı. Başında şiddetli bir ağrı ve yüksek ateş vardı. Hanımlarından izin alarak hastalığını Hazreti Âişe'nin odasında geçirdi. Gücü yettikçe mescide çıktı. Son hutbelerinden birinde şöyle buyurdu: Allah bir kulunu dünya ile kendi katındaki arasında serbest bıraktı; o kul da Allah katında olanı seçti. Bu sözün ne demek olduğunu anlayan Hazreti Ebû Bekir ağlamaya başladı. Hastalığı ağırlaşınca Efendimiz, Ebû Bekir'e söyleyin, insanlara namaz kıldırsın, buyurdu. Pazartesi sabahı odasının perdesini araladı, Ebû Bekir'in arkasında saf tutmuş ashabını gördü ve tebessüm etti. Sahabiler, Resûlullah iyileşti diye sevindiler. O gün, Rebîülevvel ayında, kuşluk vaktine doğru, başı Hazreti Âişe'nin kucağındayken son sözlerini söyledi: Namaza, namaza dikkat edin; elinizin altındakilere iyi davranın. Ardından, Allah'ım, Refîk-i A'lâ'ya, yani en yüce dosta, dedi ve ruhunu Rabbine teslim etti. Altmış üç yaşındaydı. Medine'yi derin bir sessizlik kapladı. Hazreti Ömer haberi kabullenemedi; kılıcını çekip, Kim Resûlullah öldü derse... diye bağırıyordu. Hazreti Ebû Bekir geldi, Efendimizin mübarek alnından öptü, Hayatında da vefatında da ne güzelsin, dedi. Sonra mescide çıktı ve şu sözleri söyledi: Kim Muhammed'e tapıyorsa bilsin ki Muhammed ölmüştür. Kim Allah'a ibadet ediyorsa bilsin ki Allah diridir, ölmez. Ve Âl-i İmrân sûresinin âyetini okudu: Muhammed ancak bir peygamberdir; ondan önce de peygamberler gelip geçmiştir. Efendimiz vefat ettiği odaya, bugün Ravza-i Mutahhara denilen yere defnedildi. Bugüne mesaj: Efendimizin son vasiyeti namaz ve zayıflara iyilikti. Ondan bize kalan en büyük miras, Kur'an, sünnet ve güzel ahlaktır. Onu sevmek, onun sünnetini yaşamak ve ona bolca salavat getirmekle olur."],
["O'nun Ahlakı: Âlemlere Rahmet","Hazreti Âişe'ye Efendimizin ahlakı sorulduğunda kısa bir cevap verdi: Onun ahlakı Kur'an'dı. Kur'an'da emredilen her güzelliği önce o yaşardı. Allah Teâlâ ona şöyle hitap eder: Sen elbette yüce bir ahlak üzerindesin. Efendimiz evinde ailesinin işine yardım eder, elbisesini yamar, ayakkabısını tamir eder, koyununu sağardı. Hazreti Enes, on yıl ona hizmet ettiğini, bu süre içinde bir kez bile öf demediğini, Bunu niçin yaptın, şunu niçin yapmadın diye bir defa olsun azarlamadığını anlatır. Çocukları çok severdi. Yolda karşılaştığı çocuklara önce o selam verirdi. Torunları Hasan ve Hüseyin, secdedeyken sırtına çıktığında, onlar inene kadar secdeden kalkmazdı. Namazda bir çocuğun ağladığını duyunca, annesi üzülmesin diye namazı kısa tutardı. Bir bedevî, Siz çocuklarınızı öpüyor musunuz, biz öpmeyiz, deyince Efendimiz, Allah senin kalbinden merhameti çekip almışsa ben ne yapabilirim, buyurdu. Merhameti hayvanları da kapsardı. Susuz bir köpeğe su veren bir insanın bu yüzden bağışlandığını anlatır, yavrusu alınmış bir kuşun çırpınışını görünce, Kim bu kuşu yavrusuyla üzdü, onu geri verin, buyururdu. Güler yüzlüydü; Kardeşine tebessüm etmen sadakadır, derdi. Hiç kimseye beddua etmedi, kendi nefsi için intikam almadı. Kendisine, Müşriklere beddua et, denildiğinde, Ben lanetçi olarak değil, rahmet olarak gönderildim, dedi. Allah onu Kur'an'da şöyle tanıtır: Biz seni âlemlere ancak rahmet olarak gönderdik. Bugüne mesaj: Beş dakikalık bu yolculuğun sonunda Efendimizi en iyi anlatan kelime rahmettir. Onu seven, rahmetini yaşar: Çocuğa şefkat, büyüğe saygı, hayvana merhamet, herkese güler yüz. Allâhümme salli alâ seyyidinâ Muhammed."]

let arcRes=[],arcLoading=false,arcQ="",openArc=null;const ARC_FILES={},ARC_P={};
const trFold=s=>String(s).replace(/[çÇ]/g,"c").replace(/[ğĞ]/g,"g").replace(/[ıİ]/g,"i").replace(/[öÖ]/g,"o").replace(/[şŞ]/g,"s").replace(/[üÜ]/g,"u").replace(/[âÂ]/g,"a").replace(/[îÎ]/g,"i").replace(/[ûÛ]/g,"u");
async function arcJson(url){try{const r=await fetch(url);if(r.ok)return await r.json()}catch(e){}return jsonp(url)}
async function arcAra(q){q=(q||"").trim();if(!q)return;arcQ=q;arcRes=[];arcLoading=true;
  const ws=[...new Set([q,trFold(q)])].map(x=>x.replace(/[():"\\]/g," ").trim()).filter(Boolean);
  const query="("+ws.map(x=>`title:(${x}) OR creator:(${x}) OR subject:(${x})`).join(" OR ")+") AND mediatype:(audio)";
  const url="https://archive.org/advancedsearch.php?q="+encodeURIComponent(query)+"&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=downloads&sort%5B%5D=downloads+desc&rows=40&page=1&output=json";
  try{const j=await arcJson(url);arcRes=((j&&j.response&&j.response.docs)||[]).map(d=>({id:d.identifier,title:String(Array.isArray(d.title)?d.title[0]:d.title||d.identifier),creator:String(Array.isArray(d.creator)?d.creator.join(", "):d.creator||""),dl:d.downloads||0}))}catch(e){arcRes=[]}
  arcLoading=false;if(arcQ===q&&tab==="dinle"&&dinleSeg==="sohbet"&&!openPod){const a=document.activeElement;if(!(a&&a.id==="sohIn"))renderView()}}
function loadArc(id){if(ARC_FILES[id])return Promise.resolve(ARC_FILES[id]);if(ARC_P[id])return ARC_P[id];
  ARC_P[id]=(async()=>{try{const j=await arcJson("https://archive.org/metadata/"+encodeURIComponent(id));const fs=(j.files||[]).filter(f=>/\.(mp3|m4a|ogg)$/i.test(f.name||""));
    let use=fs.filter(f=>/\.mp3$/i.test(f.name)&&f.source==="original");if(!use.length)use=fs.filter(f=>/\.mp3$/i.test(f.name));if(!use.length)use=fs;
    const nat=new Intl.Collator("tr",{numeric:true});use.sort((a,b)=>nat.compare(a.name,b.name));
    const md=j.metadata||{};ARC_FILES[id]={title:String(Array.isArray(md.title)?md.title[0]:md.title||id),creator:String(Array.isArray(md.creator)?md.creator.join(", "):md.creator||""),files:use.map(f=>({f:f.name,t:String(f.title||f.name.split("/").pop().replace(/\.(mp3|m4a|ogg)$/i,"").replace(/[_]+/g," ")).trim(),len:parseFloat(f.length)||0}))}}
    catch(e){ARC_FILES[id]={title:id,creator:"",files:[],err:1}}
    if(tab==="dinle"&&dinleSeg==="sohbet")renderView();return ARC_FILES[id]})();return ARC_P[id]}
function arcTrack(id,i){const A=ARC_FILES[id],f=A.files[i],u="https://archive.org/download/"+id+"/"+f.f.split("/").map(encodeURIComponent).join("/");
  return{title:f.t,sub:A.title,src:[u],art:makeArt("صحبة",A.title.slice(0,24),40),key:"a_"+id+"_"+i,ctx:{type:"arc",id,i,t:f.t,p:A.title,u},group:A.title}}

/* ---------- Kıble: kılıflı telefonda bile güvenli (pusula + Güneş + kıble saati) ---------- */
function gunesKonum(d,lat,lon){const r=Math.PI/180,n=d.getTime()/864e5+2440587.5-2451545.0;
 const L=(280.46+0.9856474*n)%360,g=((357.528+0.9856003*n)%360)*r,lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*r,eps=(23.439-0.0000004*n)*r;
 const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),dec=Math.asin(Math.sin(eps)*Math.sin(lam));
 const gmst=((18.697374558+24.06570982441908*n)%24+24)%24,H=(gmst*15+lon)*r-ra,ph=lat*r;
 const el=Math.asin(Math.sin(ph)*Math.sin(dec)+Math.cos(ph)*Math.cos(dec)*Math.cos(H));
 const az=(Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(ph)-Math.tan(dec)*Math.cos(ph))/r+180+360)%360;return{az,el:el/r}}
function kbKonum(){const k=store.get("mk_konum",null);if(k&&k.lat!=null)return{lat:k.lat,lon:k.lon,ad:"📍 Bulunduğun yer"+(k.acc?" (±"+Math.round(k.acc)+" m)":""),gps:1};
  return{lat:(TIMES&&TIMES.lat)||41.0082,lon:(TIMES&&TIMES.lon)||28.9784,ad:(SET.city||"İstanbul")+" (şehir merkezi)",gps:0}}
function kbAci(p){const r=Math.PI/180,la=p.lat*r,lo=p.lon*r,kla=21.4225*r,klo=39.8262*r,d=klo-lo;return (Math.atan2(Math.sin(d),Math.cos(la)*Math.tan(kla)-Math.sin(la)*Math.cos(d))/r+360)%360}
const kbFark=(a,b)=>((a-b+540)%360)-180;
function kbSaatleri(p,q){const out=[],d0=new Date();d0.setHours(0,0,0,0);let pa=null,pb=null;
  for(let m=0;m<=1440;m+=2){const t=new Date(d0.getTime()+m*60000),s=gunesKonum(t,p.lat,p.lon);if(s.el<4){pa=pb=null;continue}
    const a=kbFark(s.az,q),b=kbFark(s.az,(q+180)%360);if(pa!=null&&Math.sign(a)!==Math.sign(pa)&&Math.abs(a)<20)out.push({t,tip:"on"});if(pb!=null&&Math.sign(b)!==Math.sign(pb)&&Math.abs(b)<20)out.push({t,tip:"arka"});pa=a;pb=b}
  return out}
let KB={sx:0,sy:0,h:null,last:0,lastRaw:null,jumps:[],acc:null,ok:false,on:false,beta:0};
function kbDur(){KB.on=false;window.removeEventListener("deviceorientationabsolute",kbHandler);window.removeEventListener("deviceorientation",kbHandler)}
function kbHandler(e){let h=null;
  if(e.webkitCompassHeading!=null&&!isNaN(e.webkitCompassHeading)){h=e.webkitCompassHeading;KB.acc=e.webkitCompassAccuracy}
  else if((e.absolute===true||e.type==="deviceorientationabsolute")&&e.alpha!=null){h=(360-e.alpha)%360;KB.acc=null}
  if(h==null){if(!KB.t0)KB.t0=Date.now();if(e.alpha!=null&&!KB.uyar&&KB.h==null&&Date.now()-KB.t0>2500){KB.uyar=1;const s=$("#kbDurum");if(s)s.textContent="Bu tarayıcı gerçek kuzeyi vermiyor. Aşağıdaki Güneş yöntemini kullan."}return}
  let ang=0;try{ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0}catch(x){}h=(h+ang+360)%360;KB.beta=e.beta||0;
  const now=Date.now();if(KB.lastRaw!=null&&Math.abs(kbFark(h,KB.lastRaw))>35&&now-KB.last<150)KB.jumps.push(now);KB.jumps=KB.jumps.filter(t=>now-t<3000);KB.lastRaw=h;KB.last=now;
  const r=h*Math.PI/180;if(KB.h==null){KB.sx=Math.cos(r);KB.sy=Math.sin(r)}else{KB.sx=KB.sx*.82+Math.cos(r)*.18;KB.sy=KB.sy*.82+Math.sin(r)*.18}
  KB.h=(Math.atan2(KB.sy,KB.sx)*180/Math.PI+360)%360;kbCiz()}
function kbCiz(){const p=kbKonum(),q=kbAci(p),dial=$("#kbDial"),ok=$("#kbDurum"),ar=$("#kbOk"),ac=$("#kbAcc");if(!dial||KB.h==null)return;
  dial.style.transform=`rotate(${-KB.h}deg)`;const rel=kbFark(q,KB.h);if(ar)ar.style.transform=`rotate(${rel}deg)`;
  const hiz=Math.abs(rel)<=4;if(hiz&&!KB.ok){try{navigator.vibrate&&navigator.vibrate(70)}catch(x){}}KB.ok=hiz;
  ok.textContent=hiz?"✓ Kıbleye dönüksün":Math.abs(rel)<=20?(rel>0?"Az sağa dön → "+Math.round(rel)+"°":"← Az sola dön "+Math.round(-rel)+"°"):(rel>0?"Sağa dön → "+Math.round(rel)+"°":"← Sola dön "+Math.round(-rel)+"°");
  ok.style.color=hiz?"var(--good)":"var(--fg)";$("#kbKutu").classList.toggle("tam",hiz);
  const uy=[];if(KB.acc!=null&&KB.acc<0)uy.push("Pusula kalibre değil: telefonu havada birkaç kez ∞ (8) çiz.");else if(KB.acc!=null&&KB.acc>25)uy.push("Pusula hassasiyeti düşük (±"+Math.round(KB.acc)+"°). Mıknatıslı kılıf, araç tutucu ya da yakındaki metal etkiliyor olabilir.");
  if(KB.jumps.length>5)uy.push("Yön sıçrıyor: büyük ihtimalle mıknatıs/metal etkisi var. Kılıfı çıkar ya da Güneş yöntemine bak.");
  if(Math.abs(KB.beta)>55)uy.push("Telefonu masaya koyar gibi yere paralel tut.");
  if(ac){ac.hidden=!uy.length;ac.innerHTML=uy.map(esc).join("<br>")}}
function kbGunesHTML(p,q){const s=gunesKonum(new Date(),p.lat,p.lon);
  if(s.el<2)return `<div class="small muted">☀️ Güneş şu an ufkun altında. Gündüz bu yöntem pusulasız ve kılıftan etkilenmeden çalışır; şimdi pusulayı ya da aşağıdaki kıble saatlerini kullan.</div>`;
  const f=kbFark(q,s.az),saat=((Math.round(f/30)%12)+12)%12||12;
  return `<div class="kbgunes"><div class="kbmini" aria-hidden="true"><i style="transform:rotate(${s.az}deg) translate(0,-46px) rotate(${-s.az}deg)">☀️</i><i style="transform:rotate(${q}deg) translate(0,-46px) rotate(${-q}deg)">🕋</i><b>K</b></div>
   <div style="display:grid;gap:4px"><b style="font-size:16px">Önce yüzünü Güneş'e dön.</b><span>Sonra <b style="color:var(--accent)">${Math.abs(Math.round(f))}° ${f>=0?"sağa":"sola"}</b> dön; kıble orası.</span><span class="small muted">Saat kadranıyla: Güneş saat 12'deyse kıble saat <b>${saat}</b> yönünde. Bu yöntem pusula kullanmaz; kılıftan ve mıknatıstan etkilenmez.</span></div></div>`}
function kibleAc(){const p=kbKonum(),q=kbAci(p),ks=kbSaatleri(p,q),hm2=d=>iki(d.getHours())+":"+iki(d.getMinutes());KB.h=null;KB.jumps=[];KB.uyar=0;KB.t0=0;
  openModal(`<h3>🧭 Kıble</h3><div class="small muted">${esc(p.ad)} · kıble açısı <b style="color:var(--fg)">${Math.round(q)}°</b> (${yonAd(q)})</div>
  ${p.gps?"":`<button class="pill" id="kbGps" style="justify-self:start">📍 Konumumu kullan (daha doğru)</button>`}
  <div id="kbKutu" class="kbkutu"><div id="kbDial" class="kbdial">${["K","D","G","B"].map((n,i)=>`<span style="transform:rotate(${i*90}deg) translate(0,-108px) rotate(${-i*90}deg);color:${i?"var(--muted)":"#e05a4f"}">${n}</span>`).join("")}<div class="kbneedle" style="transform:translate(-50%,-100%) rotate(${q}deg)"></div><em style="transform:rotate(${q}deg) translate(0,-116px) rotate(${-q}deg)">🕋</em></div><div id="kbOk" class="kbok">▲</div></div>
  <div id="kbDurum" style="text-align:center;font-weight:800;font-size:18px">Pusulayı başlat</div>
  <div id="kbAcc" class="kbuyari" hidden></div>
  <div class="ctrl" style="justify-content:center"><button class="pill acc" id="kStart">🧭 Pusulayı başlat</button><button class="pill ghost" id="mNo">Kapat</button></div>
  <h3 style="margin-top:6px">☀️ Güneş ile kıble (pusulasız)</h3>${kbGunesHTML(p,q)}
  <h3 style="margin-top:6px">🕰️ Bugünün kıble saatleri</h3>${ks.length?`<div class="list">${ks.map(x=>`<div class="nrow"><span class="ts">${hm2(x.t)}</span><span class="tx">${x.tip==="on"?"Güneş tam kıble yönünde: o an yüzünü Güneş'e dönmen yeter.":"Güneş tam arkanda: gölgen kıbleyi gösterir; gölgenin uzandığı yöne dön."}</span></div>`).join("")}</div>`:`<div class="small muted">Bugün Güneş kıble doğrultusundan geçmiyor; Güneş yöntemini ya da pusulayı kullan.</div>`}
  <details class="small"><summary style="cursor:pointer;color:var(--accent);font-weight:700">Kılıf, kalibrasyon ve fıkhî bilgi</summary><div style="display:grid;gap:8px;margin-top:8px">
   <div><b>Kılıf:</b> Mıknatıslı kılıflar, cüzdan kılıflar, araç tutucular ve yakındaki metal eşyalar telefon pusulasını saptırır. Yön sıçrıyorsa ya da uyarı çıkıyorsa kılıfı çıkar veya Güneş yöntemini kullan; o yöntem kılıftan etkilenmez.</div>
   <div><b>iPhone kalibrasyonu:</b> Ayarlar → Gizlilik ve Güvenlik → Konum Servisleri → Sistem Servisleri → <b>Pusula Kalibrasyonu</b> açık olsun. Telefonu havada birkaç kez 8 çizerek kalibre et.</div>
   <div><b>Fıkhî bilgi:</b> Kâbe'yi göremeyen kimse için Kâbe'nin bulunduğu yöne (cihete) dönmek yeterlidir. Kıble yönünden sağa ya da sola 45 dereceye kadar sapma namazın sıhhatine engel değildir. Kıbleyi tespit imkânı olmayan, soracak kimse de bulamayan kişi araştırıp kanaat getirdiği yöne kılar (taharrî); Hanefî mezhebine göre sonradan yanlış olduğu anlaşılsa da namazını iade etmez. Camilerin mihrabı en güvenilir kıble işaretidir. Şüphe varsa müftülüğe danış.</div>
   <a class="pill ghost" target="_blank" rel="noopener" href="https://qiblafinder.withgoogle.com/intl/tr/" style="justify-self:start">🗺️ Haritada kıble çizgisi (Google)</a></div></details>`,()=>{
  $("#mNo").onclick=()=>{kbDur();closeModal()};
  const g=$("#kbGps");if(g)g.onclick=()=>{if(!navigator.geolocation){toast("Konum desteklenmiyor");return}toast("📍 Konum alınıyor…");navigator.geolocation.getCurrentPosition(ps=>{store.set("mk_konum",{lat:ps.coords.latitude,lon:ps.coords.longitude,acc:ps.coords.accuracy,t:Date.now()});kbDur();kibleAc()},()=>toast("Konum izni verilmedi; şehir merkezine göre hesaplanıyor"),{enableHighAccuracy:true,timeout:15000})};
  $("#kStart").onclick=async()=>{try{if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted"){toast("Pusula izni verilmedi · Güneş yöntemini kullanabilirsin");return}}
    kbDur();KB.on=true;if("ondeviceorientationabsolute" in window)window.addEventListener("deviceorientationabsolute",kbHandler);window.addEventListener("deviceorientation",kbHandler);$("#kbDurum").textContent="Telefonu yere paralel tut, yavaşça çevir…";$("#kStart").textContent="🔄 Yeniden başlat"}catch(e){toast("Bu cihazda pusula açılamadı · Güneş yöntemini kullan")}}})}

 {n:"Meclis Keffareti",c:"Ders ve sohbet sonunda",ar:"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ",r:"Sübhânekellâhümme ve bi hamdike, eşhedü en lâ ilâhe illâ ente, estağfiruke ve etûbü ileyk.",m:"Allah'ım, seni hamdinle tesbih ederim. Senden başka ilah olmadığına şahitlik ederim. Senden bağışlanma diler, sana tövbe ederim. Bir mecliste bulunup sonunda bunu söyleyenin o meclisteki hataları bağışlanır.",src:"Tirmizî, Daavât 39; Ebû Dâvûd, Edeb 27"},
 {n:"Gençlerin Duası",c:"Ashâb-ı Kehf'in duası",ar:"رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا",r:"Rabbenâ âtinâ min ledünke rahmeten ve heyyi' lenâ min emrinâ raşedâ.",m:"Rabbimiz, bize katından bir rahmet ver ve işimizde bize doğruyu kolaylaştır. (Ses kaydında âyetin tamamı okunur.)",src:"Kehf 18/10",ay:[[18,10]]},
 {n:"Öfke Anında",c:"Sınıfta sabır",ar:"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ",r:"Eûzü billâhi mine'ş-şeytâni'r-racîm.",m:"Kovulmuş şeytandan Allah'a sığınırım. Peygamberimiz, öfkelenen kimse bunu söylerse öfkesinin geçeceğini haber vermiştir.",src:"Buhârî, Edeb 76; Müslim, Birr 109",z:{t:3}}
];
DUALAR.cocuk=[
 {n:"Göz Aydınlığı Bir Nesil",c:"Çocuklar ve öğrenciler için",ar:"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا",r:"Rabbenâ heb lenâ min ezvâcinâ ve zürriyyâtinâ kurrete a'yunin vec'alnâ li'l-müttakîne imâmâ.",m:"Rabbimiz, bize eşlerimizden ve nesillerimizden göz aydınlığı olacak kimseler bağışla ve bizi takva sahiplerine önder kıl. (Ses kaydında âyetin tamamı okunur.)",src:"Furkân 25/74",ay:[[25,74]]},
 {n:"Namazı Dosdoğru Kılan Nesil",c:"Çocuklarımız için",ar:"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ",r:"Rabbi'c'alnî mukîme's-salâti ve min zürriyyetî, Rabbenâ ve tekabbel duâ.",m:"Rabbim, beni ve neslimden gelecekleri namazı dosdoğru kılanlardan eyle. Rabbimiz, duamı kabul et.",src:"İbrâhîm 14/40",ay:[[14,40]],tam:1},
 {n:"Tertemiz Bir Nesil",c:"Hz. Zekeriyyâ'nın duası",ar:"رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ الدُّعَاءِ",r:"Rabbi heb lî min ledünke zürriyyeten tayyibeten, inneke semîu'd-duâ.",m:"Rabbim, bana katından tertemiz bir nesil bağışla. Şüphesiz sen duayı işitensin. (Ses kaydında âyetin tamamı okunur.)",src:"Âl-i İmrân 3/38",ay:[[3,38]]},
 {n:"Neslimi Salih Kıl",c:"Şükür ve nesil duası",ar:"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي ۖ إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ",r:"Rabbi evzi'nî en eşküra ni'meteke'lletî en'amte aleyye ve alâ vâlideyye ve en a'mele sâlihan terdâhü ve aslih lî fî zürriyyetî, innî tübtü ileyke ve innî mine'l-müslimîn.",m:"Rabbim, bana ve anne babama verdiğin nimete şükretmemi ve razı olacağın salih amel işlememi bana ilham et. Neslimi de benim için iyi kıl. Ben sana döndüm ve ben Müslümanlardanım. (Ses kaydında âyetin tamamı okunur.)",src:"Ahkâf 46/15",ay:[[46,15]]},
 {n:"Çocukları Koruma Duası",c:"Peygamberimizin torunlarına okuduğu",ar:"أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ",r:"U'îzükümâ bi kelimâtillâhi't-tâmmeti min külli şeytânin ve hâmmeh, ve min külli aynin lâmmeh.",m:"Sizi her türlü şeytandan, zararlı hayvandan ve her türlü kem gözden Allah'ın eksiksiz kelimelerine sığındırırım. (Peygamberimiz bununla Hasan ve Hüseyin'i Allah'a emanet ederdi.)",src:"Buhârî, Enbiyâ 10"},
 {n:"Öğrencim İçin",c:"İbn Abbâs'a yapılan dua",ar:"اللَّهُمَّ عَلِّمْهُ الْكِتَابَ",r:"Allâhümme allimhü'l-kitâb.",m:"Allah'ım, ona Kitabı öğret. Peygamberimiz küçük İbn Abbâs'ı bağrına basarak böyle dua etmiştir; öğrencilerimiz için de bu niyetle okunabilir.",src:"Buhârî, İlim 17"},
 {n:"Yemekten Önce",c:"Çocuklara öğret",ar:"بِسْمِ اللَّهِ",r:"Bismillâh. (Unutursa: Bismillâhi evvelehû ve âhirah.)",m:"Allah'ın adıyla. Başta söylemeyi unutan, hatırlayınca “Başında da sonunda da Allah'ın adıyla” der.",src:"Ebû Dâvûd, Et'ime 16; Tirmizî, Et'ime 47"},
 {n:"Yemekten Sonra",c:"Çocuklara öğret",ar:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ",r:"Elhamdülillâhillezî at'amenî hâzâ ve razekanîhi min gayri havlin minnî ve lâ kuvveh.",m:"Benim hiçbir gücüm ve kuvvetim olmadan bana bu yemeği yediren ve bu rızkı veren Allah'a hamdolsun.",src:"Tirmizî, Daavât 56; Ebû Dâvûd, Libâs 1"},
 {n:"Uyumadan Önce",c:"Çocuklara öğret",ar:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",r:"Bismike Allâhümme emûtü ve ahyâ.",m:"Allah'ım, senin adınla ölür (uyur) ve senin adınla dirilirim (uyanırım).",src:"Buhârî, Daavât 7"},
 {n:"Uyanınca",c:"Çocuklara öğret",ar:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ",r:"Elhamdülillâhillezî ahyânâ ba'de mâ emâtenâ ve ileyhi'n-nüşûr.",m:"Bizi öldürdükten (uyuttuktan) sonra dirilten Allah'a hamdolsun; dönüş O'nadır.",src:"Buhârî, Daavât 7"},
 {n:"Evden Çıkarken",c:"Çocuklara öğret",ar:"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",r:"Bismillâhi tevekkeltü alallâh, ve lâ havle ve lâ kuvvete illâ billâh.",m:"Allah'ın adıyla çıkıyorum, Allah'a tevekkül ettim. Güç ve kuvvet ancak Allah'tandır.",src:"Ebû Dâvûd, Edeb 103; Tirmizî, Daavât 34"},
 {n:"Teşekkür Ederken",c:"Çocuklara öğret",ar:"جَزَاكَ اللَّهُ خَيْرًا",r:"Cezâkallâhu hayran.",m:"Allah seni hayırla mükâfatlandırsın. Kendisine iyilik yapılan kimse bunu söylerse en güzel şekilde teşekkür etmiş olur.",src:"Tirmizî, Birr 87"},
 {n:"Aksırınca",c:"Çocuklara öğret",ar:"الْحَمْدُ لِلَّهِ ۝ يَرْحَمُكَ اللَّهُ ۝ يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ",r:"Aksıran: Elhamdülillâh. Duyan: Yerhamükellah. Aksıran: Yehdîkümullâhu ve yuslihu bâleküm.",m:"Allah'a hamdolsun. — Allah sana merhamet etsin. — Allah sizi hidayete erdirsin ve hâlinizi düzeltsin.",src:"Buhârî, Edeb 126"}
];
const ILIM_AYET=[["Oku! Yaratan Rabbinin adıyla oku… O, kalemle öğretendir. İnsana bilmediğini öğretendir.","Alak 96/1-5"],["De ki: Hiç bilenlerle bilmeyenler bir olur mu?","Zümer 39/9"],["Allah, içinizden iman edenlerin ve kendilerine ilim verilenlerin derecelerini yükseltir.","Mücâdele 58/11"],["Rabbinin yoluna hikmetle ve güzel öğütle çağır.","Nahl 16/125"],["Allah'ın rahmeti sayesinde onlara yumuşak davrandın. Eğer kaba ve katı kalpli olsaydın, etrafından dağılıp giderlerdi.","Âl-i İmrân 3/159"],["Bilmiyorsanız bilenlere sorun.","Nahl 16/43"],["Kullarından ancak âlimler Allah'tan gereğiyle korkar.","Fâtır 35/28"]];
const ILIM_HADIS=[["Kim ilim öğrenmek için bir yola girerse, Allah ona cennete giden yolu kolaylaştırır.","Müslim, Zikir 38"],["İlim öğrenmek her Müslümana farzdır.","İbn Mâce, Mukaddime 17"],["Sizin en hayırlınız Kur'an'ı öğrenen ve öğretendir.","Buhârî, Fezâilü'l-Kur'ân 21"],["Allah beni zorlaştırıcı ve hata arayıcı olarak göndermedi; fakat öğretici ve kolaylaştırıcı olarak gönderdi.","Müslim, Talâk 29"],["Kolaylaştırın, zorlaştırmayın; müjdeleyin, nefret ettirmeyin.","Buhârî, İlim 11; Müslim, Cihâd 6"],["İnsan ölünce ameli kesilir; ancak üç şey müstesna: sadaka-i câriye, faydalanılan ilim ve kendisine dua eden hayırlı evlat.","Müslim, Vasiyyet 14"],["Allah, melekleri, gökler ve yer ehli, hatta yuvasındaki karınca ve denizdeki balık bile insanlara hayrı öğretene dua eder.","Tirmizî, İlim 19"],["Kim bir hayra yol gösterirse, onu yapanın sevabı kadar sevap alır.","Müslim, İmâre 133"],["Allah'ın senin vesilenle bir kişiyi hidayete erdirmesi, senin için kırmızı develerden daha hayırlıdır.","Buhârî, Cihâd 102; Müslim, Fezâilü's-Sahâbe 34"],["Allah yumuşaktır, her işte yumuşaklığı sever.","Buhârî, İstitâbe 4"],["Yumuşaklık bir şeye girdi mi onu güzelleştirir; bir şeyden çıkarıldı mı onu çirkinleştirir.","Müslim, Birr 78"],["Küçüklerimize merhamet etmeyen, büyüklerimize saygı göstermeyen bizden değildir.","Tirmizî, Birr 15"],["Hiçbir baba çocuğuna güzel ahlaktan daha üstün bir hediye vermemiştir.","Tirmizî, Birr 33"],["Kardeşine tebessüm etmen sadakadır.","Tirmizî, Birr 36"],["Bizden bir söz işitip onu duyduğu gibi başkasına ulaştıran kişinin Allah yüzünü ak etsin.","Tirmizî, İlim 7; Ebû Dâvûd, İlim 10"]];
const OGRETIM=[["❓","Soru sorarak dikkat çekmek","“Müflis kimdir, biliyor musunuz?” diye sorar, önce dinleyenin düşünmesini sağlar, sonra cevabı verirdi.","Müslim, Birr 59"],["🌊","Benzetmeyle anlatmak","“Birinizin kapısının önünden bir nehir aksa ve her gün beş kez yıkansa üzerinde kir kalır mı?” diyerek beş vakit namazın günahları temizlediğini anlattı.","Buhârî, Mevâkît 6; Müslim, Mesâcid 283"],["✏️","Çizerek göstermek","Yere bir dörtgen çizip ortasından bir çizgi çekerek insanı, ecelini ve bitmeyen emellerini gözle görülür hâle getirdi.","Buhârî, Rikâk 4"],["🔁","Önemli sözü tekrar etmek","Bir sözü iyice anlaşılsın diye üç kez tekrarlardı.","Buhârî, İlim 30"],["🎯","Seviyeye göre konuşmak","Hz. Ali: “İnsanlara anlayabilecekleri şekilde konuşun. Allah ve Resûlü'nün yalanlanmasını ister misiniz?”","Buhârî, İlim 49"],["🧎","Yaparak öğretmek","“Namazı benim kıldığımı gördüğünüz gibi kılın” buyurdu; minbere çıkıp namaz kıldırarak gösterdi.","Buhârî, Ezan 18; Cuma 26"],["🌟","Övgü ve teşvik","Übey bin Kâ'b doğru cevap verince göğsüne vurup “İlim sana kutlu olsun ey Ebü'l-Münzir!” dedi.","Müslim, Müsâfirîn 258"],["🤝","Sevgiyle yaklaşmak","Muâz'ın elini tutup “Ey Muâz, vallahi seni seviyorum” dedi, ardından ona bir dua öğretti.","Ebû Dâvûd, Vitir 26"],["🕊️","Hatada yumuşak davranmak","Mescide küçük abdestini yapan bedevîye bağıranları durdurdu, yerin yıkanmasını istedi, sonra adama nazikçe mescidin adabını anlattı.","Buhârî, Vudû 58; Müslim, Tahâret 100"],["📖","Kıssa ile öğretmek","Mağarada mahsur kalıp salih amellerini vesile ederek dua eden üç kişinin kıssasıyla ihlası öğretti.","Buhârî, Enbiyâ 53"],["⏳","Usandırmamak","İbn Mes'ûd: “Peygamberimiz bizi usandırmamak için öğüt vermeyi günlere yayardı.”","Buhârî, İlim 11-12"]];
const OGR_ONERI=["Derse Besmele ve “Rabbi zidnî ilmâ” ile başla; çocuklar da seninle birlikte söylesin.","Haftanın hadisini tahtanın köşesine yaz; hafta sonunda çocuklar o hadisi yaşadıkları bir an anlatsın.","Çocuğa ismiyle, güler yüzle hitap et; tebessüm de sadakadır.","Hatayı herkesin önünde değil, baş başa ve yumuşaklıkla düzelt.","Doğru davranışı hemen fark et ve öv: “İlim sana kutlu olsun” sünnetini yaşat.","Teşekkür kültürü için “Cezâkallâhu hayran” demeyi öğret.","Dersi Meclis Keffareti duasıyla bitir; çocuklara da anlamını anlat.","Zor bir konuyu bir benzetme, bir çizim ya da kısa bir kıssayla anlat."];

function vIlim(){const seg=`<div class="seg">${[["ilim","🤲 İlim duaları"],["cocuk","👧 Çocuklar için"],["hadis","📜 Âyet · Hadis"],["yontem","🧑‍🏫 Peygamber'in öğretimi"],["farz","📚 32 Farz"]].map(([k,l])=>`<button data-ilseg="${k}" class="${ilimSeg===k?"on":""}">${l}</button>`).join("")}</div>`;
  const ust=`<div class="bigcard ilimkart"><span class="small" style="font-weight:800;letter-spacing:.07em;color:#fff;opacity:.9">ÖĞRETMEN KÖŞESİ</span><div class="ttl" style="color:#fff">🎓 İlmimi artır, öğrencilerime faydalı kıl</div><div class="small" style="color:#fff;opacity:.92">“Allah, insanlara hayrı öğretene dua eder.” (Tirmizî) · Dualar hâfız kaydıyla ve erkek doğal sesle okunur.</div></div>`;
  let b="";
  if(ilimSeg==="ilim"||ilimSeg==="cocuk"){const L=DUALAR[ilimSeg];b=`<button class="pill acc" data-ilall="${ilimSeg}" style="margin:10px 0 12px">▶ Hepsini sırayla dinle</button>${L.map((d,i)=>duaCard(d,ilimSeg+"|"+i)).join("")}`}

const GUN_AD={"Regaip Kandili":"regaip","Miraç Kandili":"mirac","Berat Kandili":"berat","Ramazan'ın ilk günü":"ramazan","Kadir Gecesi":"kadir","Ramazan Bayramı":"rbayram","Kurban Bayramı Arefesi":"arefe","Kurban Bayramı":"kbayram","Hicrî Yılbaşı":"hicri","Aşure Günü":"asure","Mevlid Kandili":"mevlid","Üç Ayların Başlangıcı":"ucaylar","Ramazan Bayramı Arefesi":"arefeR","Zilhicce'nin İlk On Günü":"zilhicce"};

    ${G.sal||G.bds?`<div class="ctrl" style="margin-top:12px">${G.sal?`<button class="pill" data-gsal="1">📿 100 salavat (zikirmatik)</button>`:""}${G.bds?`<button class="pill" data-bdscal="${G.bds}">⏱️ 5 Dakikada Siyer · ${G.bds}. bölüm</button>`:""}</div>`:""}
    ${G.d.length?`<h2>Dualar</h2>${G.d.map(r=>duaCard(DREF(r),r)).join("")}`:""}
    <div class="note">Mübarek gün ve gecelerin tarihleri Ümmü'l-Kurâ takvimine göre hesaplanır; Diyanet takvimiyle bir gün fark olabilir.</div>`}
  const sira=Object.keys(DGUN).filter(k=>k!=="cuma").sort((a,b)=>(tarih[a]?tarih[a].d:9e15)-(tarih[b]?tarih[b].d:9e15));
  return `<div class="bigcard gunkart"><span class="small" style="font-weight:800;letter-spacing:.07em;color:#fff;opacity:.9">KANDİLLER VE DİNİ GÜNLER</span><div class="ttl" style="color:#fff">🌙 Hangi gün ne yapılır?</div><div class="small" style="color:#fff;opacity:.92">Her mübarek gün için yapılacaklar, okunacak sûreler ve dualar; hepsi uygulamanın içinde dinlenir.</div></div>

function kbYukle(src,css){return new Promise((res,rej)=>{if(css){if(document.querySelector(`link[href="${src}"]`))return res();const l=document.createElement("link");l.rel="stylesheet";l.href=src;l.onload=res;l.onerror=rej;document.head.appendChild(l);return}

  const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));return[la2/r,lo2/r]}
function kbBipCal(){try{if(!kbBip)return;const o=kbBip.createOscillator(),g=kbBip.createGain(),t=kbBip.currentTime;o.frequency.value=880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g).connect(kbBip.destination);o.start(t);o.stop(t+.4)}catch(e){}}

  const gp=$("#kbGps2");if(gp)gp.onclick=()=>kbKonumAl(false);

/* ---------- Ezan: herkesin anlayacağı kalan süre ---------- */
function ezanParca(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return{h,m,x}}
function ezanYazi(ms){const {h,m,x}=ezanParca(ms);return h?`${h} saat ${m} dakika`:m?`${m} dakika ${x} saniye`:`${x} saniye`}
function ezanKisa(ms){const {h,m,x}=ezanParca(ms);return h?`${h} sa ${m} dk`:m?`${m} dk ${iki(x)} sn`:`${x} sn`}
function ezanBuyuk(ms){const {h,m,x}=ezanParca(ms);const p=(n,u,k)=>`<span class="ezp${k?" k":""}"><b>${n}</b><i>${u}</i></span>`;return h?p(h,"saat")+p(iki(m),"dakika")+p(iki(x),"saniye",1):p(m,"dakika")+p(iki(x),"saniye")}
const ezanEki=n=>({"İmsak":"İmsak vaktine","Güneş":"Güneşin doğmasına","Öğle":"Öğle ezanına","İkindi":"İkindi ezanına","Akşam":"Akşam ezanına","Yatsı":"Yatsı ezanına"}[n]||n+" vaktine");
function ezanKutu(){const e=ezanBilgi();return `<div class="ezan${e.ms<15*60000?" yakin":""}" id="ezanKutu"><div class="ez-l">🕌 ${esc(ezanEki(e.ad))} kalan süre</div><div class="ez-t" id="ezanSayac">${ezanBuyuk(e.ms)}</div><div class="ez-bar"><i id="ezanBar" style="width:${e.pct.toFixed(1)}%"></i></div><div class="ez-s" id="ezanCumle">${esc(e.ad)} vakti saat <b>${e.saat}</b>'te giriyor · ${esc(ezanYazi(e.ms))} kaldı${e.ms<15*60000?" · abdest ve hazırlık vakti":""}</div></div>`}
function ezanTick(){try{const e=ezanBilgi(),s=$("#ezanSayac"),b=$("#ezanBar"),k=$("#ezanKutu"),c=$("#ezChip"),cu=$("#ezanCumle");
  if(s)s.innerHTML=ezanBuyuk(e.ms);if(b)b.style.width=e.pct.toFixed(1)+"%";if(k)k.classList.toggle("yakin",e.ms<15*60000);
  if(cu)cu.innerHTML=`${esc(e.ad)} vakti saat <b>${e.saat}</b>'te giriyor · ${esc(ezanYazi(e.ms))} kaldı${e.ms<15*60000?" · abdest ve hazırlık vakti":""}`;
  if(c){c.hidden=tab==="bugun";c.textContent="🕌 "+e.ad+" "+e.saat+" · "+ezanKisa(e.ms)+" kaldı";c.classList.toggle("yakin",e.ms<15*60000)}
  if(ezanSonAd&&ezanSonAd!==e.ad&&tab==="bugun"){const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&$("#modal").hidden)renderView()}ezanSonAd=e.ad}catch(x){}}

/* ---------- Sohbet araması: yalnız aranan isme uyan, alakalı sonuçlar ---------- */
const kelimeler=q=>trFold(q).toLocaleLowerCase("tr").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>=3);
function alakali(metin,q){const t=" "+trFold(metin).toLocaleLowerCase("tr").replace(/[^a-z0-9]+/g," ")+" ",ws=kelimeler(q);if(!ws.length)return true;
  const var2=w=>[w,w.replace(/d/g,"t"),w.replace(/t/g,"d")];return ws.every(w=>var2(w).some(v=>t.includes(" "+v+" ")||t.includes(" "+v+"in ")||t.includes(" "+v+"nin ")||t.includes(" "+v+"un ")))}
async function doSearch(q){
  q=(q||"").trim();if(!q)return;sohQ=q;sohLoading=true;sohErr="";sohRes=[];sohYT=null;openPod=null;openArc=null;renderView();arcAra(q);
  const enc=encodeURIComponent(q);
  const rs=await Promise.allSettled(["tr","de","nl","us"].map(c=>itunes(`https://itunes.apple.com/search?media=podcast&entity=podcast&limit=50&country=${c}&term=${enc}`)));
  const seen=new Set();rs.forEach(r=>{if(r.status==="fulfilled"&&r.value&&r.value.results)r.value.results.forEach(x=>{if(x.collectionId&&!seen.has(x.collectionId)&&alakali((x.collectionName||"")+" "+(x.artistName||""),q)){seen.add(x.collectionId);sohRes.push(normPod(x))}})});
  if(rs.every(r=>r.status==="rejected"))sohErr="Aramaya ulaşılamadı. İnternet bağlantını kontrol et.";
  if(SET.yt){try{const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=30&relevanceLanguage=tr&q=${enc}&key=${encodeURIComponent(SET.yt)}`);const j=await r.json();sohYT=j.items?{items:j.items.map(i=>({id:i.id.videoId,t:i.snippet.title,ch:i.snippet.channelTitle,d:i.snippet.publishedAt}))}:{err:(j.error&&j.error.message)||"YouTube sonucu alınamadı"}}catch(e){sohYT={err:"YouTube'a ulaşılamadı"}}}
  sohLoading=false;if(tab==="dinle"&&dinleSeg==="sohbet")renderView();
}
