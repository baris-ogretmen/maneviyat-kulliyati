<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maneviyat">
<meta name="theme-color" content="#0e1517">
<title>Maneviyat Külliyatı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: tek sütun mobil uygulama — üstte başlık, ortada sekme içeriği, altta mini çalar + sekme çubuğu */
:root{
  --bg:#0e1517; --surface:#152125; --surface2:#1c2b30; --line:#26383e;
  --fg:#ebe7dc; --muted:#93a3a3; --accent:#d8b06a; --accent-ink:#1a1408; --good:#7cc6a0;
  --f-ar:"Amiri","Geeza Pro","Times New Roman",serif;
  --f-disp:"Literata",Georgia,serif;
  --f-body:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f5f4; --surface:#ffffff; --surface2:#e8eeec; --line:#d3dcda;
  --fg:#13201f; --muted:#5b6b69; --accent:#94661c; --accent-ink:#ffffff; --good:#2f8a5c; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f5f4; --surface:#ffffff; --surface2:#e8eeec; --line:#d3dcda;
  --fg:#13201f; --muted:#5b6b69; --accent:#94661c; --accent-ink:#ffffff; --good:#2f8a5c; color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
[hidden]{display:none!important}
.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 150px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:6px 14px}
header.top h1{font:600 26px/1.15 var(--f-disp);margin:0;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
.hijri{font-size:12px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.seg{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface2);color:var(--fg)}
h2{font:600 19px/1.25 var(--f-disp);margin:22px 0 10px}
h3{font-size:15px;margin:0 0 4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.ar{font-family:var(--f-ar);direction:rtl;line-height:2;font-size:24px}

/* Zikir */
.zcard{background:var(--surface);border-radius:22px;padding:18px 16px 16px;display:grid;gap:10px;text-align:center;user-select:none;-webkit-user-select:none}
.zcard .ar{font-size:30px;line-height:1.7}
.zcard .read{font-weight:600}
.zcard .mean{font-size:13px;color:var(--muted);max-width:44ch;margin:0 auto}
.tap{position:relative;width:min(70vw,250px);aspect-ratio:1;margin:6px auto 0;border-radius:50%;display:grid;place-items:center;touch-action:manipulation;cursor:pointer;background:radial-gradient(circle at 50% 40%,var(--surface2),var(--surface) 70%)}
.tap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tap .num{font:600 64px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.tap .of{font-size:13px;color:var(--muted);margin-top:4px}
.tap:active{transform:scale(.985)}
.tap.done .num{color:var(--good)}
.zrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{padding:9px 14px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill.acc{background:var(--accent);color:var(--accent-ink)}
.pill.ghost{background:transparent;border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:12px -16px 0;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;text-align:left}
.chip b{display:block;font-weight:600}
.chip span{font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--accent)}
.lockbox{background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:14px;margin-top:14px;font-size:14px}
.lockbox ol{margin:6px 0 0;padding-left:20px}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px;margin-top:8px}
.stats div{display:grid;gap:4px;justify-items:center;font-size:11px;color:var(--muted);height:100%;align-content:end}
.stats i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.85;min-height:3px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:120px;background:var(--surface);border-radius:14px;padding:12px}
.kpi b{font:600 22px var(--f-disp);display:block;font-variant-numeric:tabular-nums}

/* Listeler */
.list{display:grid;gap:2px;background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);text-align:left;width:100%;text-decoration:none}
.row + .row{border-top:1px solid var(--line)}
.row .no{width:30px;flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:center}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:12.5px;color:var(--muted)}
.row .ar{font-size:20px;line-height:1.3}
.row.playing b{color:var(--accent)}
.row .go{color:var(--muted);font-size:13px;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px;align-content:start;text-decoration:none}
.card b{font-weight:600}
.card span{font-size:12.5px;color:var(--muted)}
.card .tag{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.card .tag.yt{color:var(--muted)}
.bigcard{background:var(--surface);border-radius:18px;padding:16px;display:grid;gap:8px;text-align:left;width:100%}
.bigcard .ttl{font:600 18px/1.25 var(--f-disp)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search],input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:10px}
.note b{color:var(--fg)}
.grid160{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.grid160 a{background:var(--surface);border-radius:10px;padding:9px 0;text-align:center;text-decoration:none;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}

/* Dua kartları */
.dua{background:var(--surface);border-radius:18px;padding:16px;display:grid;gap:8px;margin-bottom:10px}
.dua .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dua .cnt{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.dua .ar{font-size:23px;text-align:right}
.dua .read{font-style:italic;font-size:14px}
.dua .mean{font-size:14px;color:var(--muted)}
.dua .src{font-size:12px;color:var(--muted)}

/* Mini çalar ve sekmeler */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.mini{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px 6px}
.mini .art{width:42px;height:42px;border-radius:10px;flex:none;background:var(--surface2);background-size:cover}
.mini .t{flex:1;min-width:0;text-align:left}
.mini .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib svg{width:24px;height:24px;fill:currentColor}
.ib.big{width:68px;height:68px;background:var(--accent);color:var(--accent-ink)}
.ib.big svg{width:32px;height:32px}
.mprog{height:2px;background:var(--line);max-width:640px;margin:0 auto}
.mprog i{display:block;height:100%;width:0;background:var(--accent)}
nav.tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:grid;justify-items:center;gap:2px;padding:7px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 20px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.sheet .bar{display:flex;justify-content:space-between;align-items:center}
.sheet .bigart{width:min(78vw,340px);aspect-ratio:1;border-radius:24px;margin:18px auto 10px;background:var(--surface2);background-size:cover;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sheet .ttl{font:600 21px/1.3 var(--f-disp);text-align:center;margin-top:8px;text-wrap:balance}
.sheet .who{text-align:center;color:var(--muted);font-size:14px}
.seek{width:100%;margin-top:18px;accent-color:var(--accent)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pctrl{display:flex;justify-content:center;align-items:center;gap:22px;margin:14px 0}
.opts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.qlist{margin-top:18px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:grid;place-items:end center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;padding:18px;width:100%;max-width:480px;display:grid;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="hijri" id="hijri"></div>
      <h1 id="pageTitle">Zikir</h1>
    </div>
    <div class="sub" id="todayTot"></div>
  </header>
  <main id="view"></main>
</div>

<audio id="au" preload="metadata" playsinline></audio>
<audio id="zau" preload="auto" playsinline loop></audio>

<div class="dock">
  <div class="mprog"><i id="mprog"></i></div>
  <div class="mini" id="mini" hidden>
    <button class="art" id="miniArt" aria-label="Çalarlayı aç"></button>
    <button class="t" id="miniOpen"><b id="miniT"></b><span id="miniS"></span></button>
    <button class="ib" id="miniPlay" aria-label="Oynat/Duraklat"></button>
    <button class="ib" id="miniNext" aria-label="Sonraki"></button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="zikir" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="17.5" cy="8.5" r="2"/><circle cx="17.5" cy="15.5" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="6.5" cy="15.5" r="2"/><circle cx="6.5" cy="8.5" r="2"/></svg>Zikir</button>
    <button data-tab="dinle"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></svg>Dinle</button>
    <button data-tab="dua"><svg viewBox="0 0 24 24"><path d="M12 3c2 3 2 6 0 9-2-3-2-6 0-9z"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/></svg>Dua</button>
    <button data-tab="kulliyat"><svg viewBox="0 0 24 24"><path d="M4 5h5v15H4zM10 5h5v15h-5z"/><path d="M16 6l4-1 2 14-4 1z"/></svg>Külliyat</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>

<script>
"use strict";
/* ===================== Yardımcılar ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const yt=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
const p3=n=>String(n).padStart(3,"0");
const fmt=s=>{if(!isFinite(s)||s<0)return"--:--";s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let toastT;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const IC={
 play:'<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
 next:'<svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM16 6h2.5v12H16z"/></svg>',
 prev:'<svg viewBox="0 0 24 24"><path d="M18 6l-9 6 9 6zM5.5 6H8v12H5.5z"/></svg>',
 down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
 b15:'<svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>',
 f15:'<svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg>'
};

/* ===================== Veri: Kur'an ===================== */
const SURE_TR="Fâtiha|Bakara|Âl-i İmrân|Nisâ|Mâide|En'âm|A'râf|Enfâl|Tevbe|Yûnus|Hûd|Yûsuf|Ra'd|İbrâhîm|Hicr|Nahl|İsrâ|Kehf|Meryem|Tâhâ|Enbiyâ|Hac|Mü'minûn|Nûr|Furkân|Şuarâ|Neml|Kasas|Ankebût|Rûm|Lokmân|Secde|Ahzâb|Sebe'|Fâtır|Yâsîn|Sâffât|Sâd|Zümer|Mü'min|Fussilet|Şûrâ|Zuhruf|Duhân|Câsiye|Ahkâf|Muhammed|Fetih|Hucurât|Kâf|Zâriyât|Tûr|Necm|Kamer|Rahmân|Vâkıa|Hadîd|Mücâdele|Haşr|Mümtehine|Saf|Cuma|Münâfikûn|Teğâbün|Talâk|Tahrîm|Mülk|Kalem|Hâkka|Meâric|Nûh|Cin|Müzzemmil|Müddessir|Kıyâmet|İnsan|Mürselât|Nebe'|Nâziât|Abese|Tekvîr|İnfitâr|Mutaffifîn|İnşikâk|Bürûc|Târık|A'lâ|Ğâşiye|Fecr|Beled|Şems|Leyl|Duhâ|İnşirâh|Tîn|Alak|Kadir|Beyyine|Zilzâl|Âdiyât|Kâria|Tekâsür|Asr|Hümeze|Fîl|Kureyş|Mâûn|Kevser|Kâfirûn|Nasr|Tebbet|İhlâs|Felak|Nâs".split("|");
const SURE_AR="الفاتحة البقرة آل_عمران النساء المائدة الأنعام الأعراف الأنفال التوبة يونس هود يوسف الرعد إبراهيم الحجر النحل الإسراء الكهف مريم طه الأنبياء الحج المؤمنون النور الفرقان الشعراء النمل القصص العنكبوت الروم لقمان السجدة الأحزاب سبأ فاطر يس الصافات ص الزمر غافر فصلت الشورى الزخرف الدخان الجاثية الأحقاف محمد الفتح الحجرات ق الذاريات الطور النجم القمر الرحمن الواقعة الحديد المجادلة الحشر الممتحنة الصف الجمعة المنافقون التغابن الطلاق التحريم الملك القلم الحاقة المعارج نوح الجن المزمل المدثر القيامة الإنسان المرسلات النبأ النازعات عبس التكوير الانفطار المطففين الانشقاق البروج الطارق الأعلى الغاشية الفجر البلد الشمس الليل الضحى الشرح التين العلق القدر البينة الزلزلة العاديات القارعة التكاثر العصر الهمزة الفيل قريش الماعون الكوثر الكافرون النصر المسد الإخلاص الفلق الناس".split(" ").map(s=>s.replace("_"," "));
const AYET=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const OFF=[0];for(let i=0;i<114;i++)OFF.push(OFF[i]+AYET[i]);
const gAyah=(s,a)=>OFF[s-1]+a;
const isn=(ed,n)=>[`https://cdn.islamic.network/quran/audio-surah/128/${ed}/${n}.mp3`,`https://cdn.islamic.network/quran/audio-surah/64/${ed}/${n}.mp3`];
const mq=(srv,path,n)=>`https://${srv}.mp3quran.net/${path}/${p3(n)}.mp3`;
const KARI=[
 {id:"afs",n:"Mişari Râşid el-Afâsî",s:n=>[mq("server8","afs",n),...isn("ar.alafasy",n),`https://cdn.mp3quran.net/audio/mishary-alafasy/r1/${p3(n)}.mp3`]},
 {id:"basit",n:"Abdulbâsıt Abdussamed (Murattal)",s:n=>[mq("server7","basit",n),...isn("ar.abdulbasitmurattal",n)]},
 {id:"basitm",n:"Abdulbâsıt Abdussamed (Mücevved)",s:n=>[mq("server13","basit_mjwd",n),...isn("ar.abdulbasitmujawwad",n)]},
 {id:"husary",n:"Mahmûd Halîl el-Husarî",s:n=>[mq("server13","husr",n),...isn("ar.husary",n),`https://cdn.mp3quran.net/audio/mahmoud-husary/r1/${p3(n)}.mp3`]},

  {n:"Âyetü'l-Kürsî",c:"Sabah-akşam 1",ar:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",r:"Allâhü lâ ilâhe illâ hüve'l-hayyü'l-kayyûm, lâ te'huzühû sinetün ve lâ nevm, lehû mâ fi's-semâvâti ve mâ fi'l-ard, men zellezî yeşfeu indehû illâ bi-iznih, ya'lemü mâ beyne eydîhim ve mâ halfehüm, ve lâ yühîtûne bi-şey'in min ilmihî illâ bimâ şâ', vesia kürsiyyühü's-semâvâti ve'l-ard, ve lâ yeûdühû hıfzuhümâ ve hüve'l-aliyyü'l-azîm.",m:"Allah, O'ndan başka ilah olmayan, diri ve her şeyi ayakta tutandır. O'nu ne uyuklama ne uyku tutar. Göklerde ve yerde ne varsa O'nundur. O'nun izni olmadan katında kim şefaat edebilir? Kulların önündekini ve arkasındakini bilir; O'nun dilediği kadarı dışında ilminden hiçbir şeyi kavrayamazlar. Kürsüsü gökleri ve yeri kuşatmıştır; onları korumak O'na ağır gelmez. O yücedir, büyüktür.",src:"Bakara 2/255",ay:[[2,255]],z:{t:1}},
  {n:"İhlâs, Felak, Nâs",c:"Sabah-akşam 3'er",ar:"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ۞ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ۞ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",r:"Kul hüvallâhü ehad, Allâhü's-samed, lem yelid ve lem yûled, ve lem yekün lehû küfüven ehad. — Kul eûzü bi-rabbi'l-felak... — Kul eûzü bi-rabbi'n-nâs...",m:"Allah birdir, her şey O'na muhtaçtır, doğurmamış ve doğurulmamıştır, hiçbir şey O'na denk değildir. Sabahın Rabbine, yarattıklarının şerrinden; insanların Rabbine, sinsi vesvesecinin şerrinden sığınırım.",src:"Kur'an 112-114 · Ebû Dâvûd, Tirmizî",ay:[[112,1],[112,2],[112,3],[112,4],[113,1],[113,2],[113,3],[113,4],[113,5],[114,1],[114,2],[114,3],[114,4],[114,5],[114,6]],z:{t:3}},
  {n:"Âmenerrasûlü",c:"Yatsıdan sonra",ar:"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",r:"Âmene'r-resûlü bimâ ünzile ileyhi min rabbihî ve'l-mü'minûn... Rabbenâ lâ tüâhiznâ in nesînâ ev ahta'nâ... Ve'fü annâ, vağfir lenâ, verhamnâ, ente mevlânâ fensurnâ ale'l-kavmi'l-kâfirîn.",m:"Peygamber ve mü'minler Rabbinden indirilene iman etti. Allah kimseye gücünün üstünde yük yüklemez. Rabbimiz, unutur ya da hata edersek bizi sorumlu tutma; bizi affet, bağışla, bize merhamet et. Sen bizim Mevlâmızsın.",src:"Bakara 2/285-286",ay:[[2,285],[2,286]],z:{t:1}},
  {n:"Seyyidü'l-İstiğfâr",c:"Sabah-akşam 1",ar:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",r:"Allâhümme ente rabbî lâ ilâhe illâ ente, halaktenî ve ene abdük, ve ene alâ ahdike ve va'dike mestete'tü, eûzü bike min şerri mâ sana'tü, ebûu leke bi-ni'metike aleyye, ve ebûu bi-zenbî fağfir lî, fe-innehû lâ yağfiru'z-zünûbe illâ ente.",m:"Allah'ım, Sen benim Rabbimsin, Senden başka ilah yoktur. Beni Sen yarattın, ben Senin kulunum. Gücüm yettiğince ahdime ve vaadime bağlıyım. Yaptıklarımın şerrinden Sana sığınırım. Bana verdiğin nimetleri ve günahımı itiraf ederim; beni bağışla, günahları Senden başka bağışlayan yoktur.",src:"Buhârî, Deavât 2"},
  {n:"Hasbiyallâh",c:"Sabah-akşam 7",ar:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",r:"Hasbiyallâhü lâ ilâhe illâ hû, aleyhi tevekkeltü ve hüve rabbü'l-arşi'l-azîm.",m:"Allah bana yeter. O'ndan başka ilah yoktur. O'na tevekkül ettim; O, büyük Arş'ın Rabbidir.",src:"Tevbe 9/129 · Ebû Dâvûd",ay:[[9,129]],z:{t:7}},
  {n:"Bismillâhillezî",c:"Sabah-akşam 3",ar:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",r:"Bismillâhillezî lâ yedurru mea'smihî şey'ün fi'l-ardı ve lâ fi's-semâi ve hüve's-semîu'l-alîm.",m:"Adıyla anıldığında yerde ve gökte hiçbir şeyin zarar veremediği Allah'ın adıyla. O işitendir, bilendir.",src:"Ebû Dâvûd, Tirmizî",z:{t:3}},
  {n:"Radîtü Billâhi Rabben",c:"Sabah-akşam 3",ar:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا",r:"Radîtü billâhi rabben, ve bi'l-İslâmi dînen, ve bi-Muhammedin sallallâhu aleyhi ve selleme nebiyyen.",m:"Rab olarak Allah'tan, din olarak İslâm'dan, peygamber olarak Hz. Muhammed'den razıyım.",src:"Ebû Dâvûd, Tirmizî",z:{t:3}},
  {n:"Asbahnâ",c:"Sabah",ar:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ",r:"Asbahnâ ve asbaha'l-mülkü lillâh, ve'l-hamdü lillâh, lâ ilâhe illallâhu vahdehû lâ şerîke leh. (Akşam: Emseynâ ve emse'l-mülkü lillâh...)",m:"Sabaha erdik, mülk de Allah'ın olarak sabaha erdi. Hamd Allah'adır. Allah'tan başka ilah yoktur, O tektir, ortağı yoktur.",src:"Müslim, Zikir 75"},
  {n:"Afv ve Âfiyet",c:"Sabah-akşam",ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ",r:"Allâhümme innî es'elüke'l-afve ve'l-âfiyete fi'd-dünyâ ve'l-âhira.",m:"Allah'ım, dünyada ve âhirette Senden af ve âfiyet dilerim.",src:"Ebû Dâvûd, İbn Mâce",z:{t:3}},
  {n:"Yâ Hayyu Yâ Kayyûm",c:"Sabah-akşam",ar:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",r:"Yâ Hayyu yâ Kayyûm, bi-rahmetike esteğîs, aslih lî şe'nî küllehû, ve lâ tekilnî ilâ nefsî tarfete ayn.",m:"Ey diri ve her şeyi ayakta tutan! Rahmetinle yardım dilerim. Bütün işlerimi düzelt, beni göz açıp kapayıncaya kadar bile nefsime bırakma.",src:"Hâkim, Müstedrek",z:{t:7}},
  {n:"Sübhânallâhi ve Bihamdihî",c:"Günde 100",ar:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",r:"Sübhânallâhi ve bihamdihî.",m:"Allah'ı hamd ile tesbih ederim. Günde yüz kez söyleyenin hataları deniz köpüğü kadar olsa da bağışlanır.",src:"Buhârî, Deavât 65",zid:"bihamdihi"},
  {n:"Tevhîd",c:"Günde 10 / 100",ar:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",r:"Lâ ilâhe illallâhu vahdehû lâ şerîke leh, lehü'l-mülkü ve lehü'l-hamdü ve hüve alâ külli şey'in kadîr.",m:"Allah'tan başka ilah yoktur; O tektir, ortağı yoktur. Mülk O'nundur, hamd O'nadır, O her şeye kadirdir.",src:"Buhârî, Müslim",zid:"vahdehu"}

 seher:[
  {n:"Seher Vaktinin Kıymeti",c:"Gecenin son üçte biri",r:"",m:"Rabbimiz her gece, gecenin son üçte biri kaldığında dünya semâsına iner ve buyurur: “Bana dua eden yok mu, duasını kabul edeyim; benden isteyen yok mu, vereyim; benden bağışlanma dileyen yok mu, bağışlayayım.”",src:"Buhârî, Teheccüd 14 · Müslim, Müsâfirîn 168 (meal)"},
  {n:"Seherlerde İstiğfar Edenler",c:"Âyet",ar:"وَبِالْأَسْحَارِ هُمْ يَسْتَغْفِرُونَ",r:"Ve bi'l-eshâri hüm yestağfirûn.",m:"Onlar seher vakitlerinde bağışlanma dilerlerdi.",src:"Zâriyât 51/18",ay:[[51,17],[51,18]],zid:"istigfar"},
  {n:"Âl-i İmrân'ın Son Âyetleri",c:"Gece kalkınca",ar:"إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِّأُولِي الْأَلْبَابِ",r:"İnne fî halki's-semâvâti ve'l-ardı vahtilâfi'l-leyli ve'n-nehâri le-âyâtin li-uli'l-elbâb...",m:"Göklerin ve yerin yaratılışında, gece ile gündüzün birbiri ardınca gelişinde akıl sahipleri için deliller vardır. Efendimiz (s.a.v.) gece uyanınca bu âyetleri okurdu.",src:"Âl-i İmrân 3/190-194 · Buhârî",ay:[[3,190],[3,191],[3,192],[3,193],[3,194]]},
  {n:"Seher İstiğfârı",c:"70 / 100",ar:"أَسْتَغْفِرُ اللّٰهَ الْعَظِيمَ الَّذِي لَا إِلٰهَ إِلَّا هُوَ الْحَيَّ الْقَيُّومَ وَأَتُوبُ إِلَيْهِ",r:"Estağfirullâhe'l-azîm ellezî lâ ilâhe illâ hüve'l-hayye'l-kayyûme ve etûbü ileyh.",m:"Kendisinden başka ilah olmayan, diri ve her şeyi ayakta tutan yüce Allah'tan bağışlanma diler, O'na tevbe ederim.",src:"Ebû Dâvûd, Tirmizî",z:{t:70}},
  {n:"Yûnus Aleyhisselâmın Duası",c:"Sıkıntı anında",ar:"لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",r:"Lâ ilâhe illâ ente sübhâneke innî küntü mine'z-zâlimîn.",m:"Senden başka ilah yoktur. Seni tenzih ederim. Ben gerçekten kendine zulmedenlerden oldum.",src:"Enbiyâ 21/87",zid:"yunus"}

 kuran:[
  {n:"Rabbenâ Âtinâ",c:"Her dua sonunda",ar:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",r:"Rabbenâ âtinâ fi'd-dünyâ haseneten ve fi'l-âhireti haseneten ve kınâ azâbe'n-nâr.",m:"Rabbimiz, bize dünyada da iyilik ver, âhirette de iyilik ver ve bizi ateş azabından koru.",src:"Bakara 2/201",ay:[[2,201]]},
  {n:"Rabbenağfirlî",c:"Namaz sonu",ar:"رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ",r:"Rabbenağfir lî ve li-vâlideyye ve li'l-mü'minîne yevme yekûmü'l-hisâb.",m:"Rabbimiz, hesap gününde beni, anne babamı ve mü'minleri bağışla.",src:"İbrâhîm 14/41",ay:[[14,41]]},
  {n:"Rabbişrah Lî Sadrî",c:"Derse, işe başlarken",ar:"رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي ۝ وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي ۝ يَفْقَهُوا قَوْلِي",r:"Rabbi'şrah lî sadrî, ve yessir lî emrî, vahlul ukdeten min lisânî, yefkahû kavlî.",m:"Rabbim, göğsümü aç, işimi kolaylaştır, dilimdeki düğümü çöz ki sözümü anlasınlar.",src:"Tâhâ 20/25-28",ay:[[20,25],[20,26],[20,27],[20,28]]},
  {n:"Haşr Sûresinin Sonu",c:"Sabah-akşam",ar:"هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ ۖ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ ۖ هُوَ الرَّحْمَٰنُ الرَّحِيمُ ۝ هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ ۚ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ ۝ هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ ۚ يُسَبِّحُ لَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ وَهُوَ الْعَزِيزُ الْحَكِيمُ",r:"Hüvallâhüllezî lâ ilâhe illâ hû, âlimü'l-gaybi ve'ş-şehâdeh, hüve'r-rahmânü'r-rahîm...",m:"O, kendisinden başka ilah olmayan Allah'tır; görüleni ve görülmeyeni bilir, Rahmân ve Rahîm'dir. Melik, Kuddûs, Selâm, Mü'min, Müheymin, Azîz, Cebbâr, Mütekebbir'dir. Hâlık, Bârî, Musavvir'dir; en güzel isimler O'nundur.",src:"Haşr 59/22-24",ay:[[59,22],[59,23],[59,24]]},

const ART_CACHE={};
function makeArt(label,sub,hue){
  const key=label+"|"+sub+"|"+hue;if(ART_CACHE[key])return ART_CACHE[key];
  const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,512,512);gr.addColorStop(0,`hsl(${hue},38%,16%)`);gr.addColorStop(1,`hsl(${hue+25},40%,8%)`);g.fillStyle=gr;g.fillRect(0,0,512,512);
  g.lineWidth=3;g.strokeStyle="rgba(216,176,106,.5)";
  g.save();g.translate(256,232);g.strokeRect(-120,-120,240,240);g.rotate(Math.PI/4);g.strokeRect(-120,-120,240,240);g.restore();
  g.fillStyle="#ebe7dc";g.textAlign="center";g.textBaseline="middle";
  g.font=label.length>4?"600 64px Literata,Georgia,serif":"600 110px Literata,Georgia,serif";g.fillText(label,256,232);
  g.font="500 30px Figtree,system-ui,sans-serif";g.fillStyle="#d8b06a";g.fillText(sub,256,430);
  const u=c.toDataURL("image/png");ART_CACHE[key]=u;return u;
}

let lockOn=false,silentUrl=null;
function silentURL(){
  if(silentUrl)return silentUrl;const sr=8000,n=sr*2,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,(Math.random()*6-3)|0,true);
  silentUrl=URL.createObjectURL(new Blob([b],{type:"audio/wav"}));return silentUrl;
}

  const keep=()=>{zau.play().catch(()=>{});try{ms.playbackState="playing"}catch(e){}};
  set("nexttrack",()=>{inc(1);keep()});set("previoustrack",()=>{inc(-1);keep()});

let actx=null;
function tick(done){
  if(store.get("mk_sound",true)===false||lockOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=done?660:1100;g.gain.setValueAtTime(.06,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+(done?.5:.05));o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+(done?.5:.06))}catch(e){}
  if(navigator.vibrate)navigator.vibrate(done?[60,40,60]:8);

function inc(d){
  const z=zCur(),t=zTarget(z);let c=(zs.counts[z.id]||0)+d;if(c<0)c=0;zs.counts[z.id]=c;
  if(d>0){const k=todayKey();hist[k]=(hist[k]||0)+d}else if(d<0){const k=todayKey();hist[k]=Math.max(0,(hist[k]||0)+d)}
  const done=d>0&&c===t;tick(done);
  if(done&&zs.chain){const i=TESBIHAT.indexOf(z.id);if(i>-1&&i<TESBIHAT.length-1){setTimeout(()=>{zs.cur=TESBIHAT[i+1];zs.counts[zs.cur]=0;saveZ();lockMeta();if(tab==="zikir")renderView()},350)}else if(i===TESBIHAT.length-1){toast("Tesbihat tamamlandı. Allah kabul etsin.")}}
  else if(done)toast("Hedefe ulaştın: "+t);
  saveZ();lockMeta();if(tab==="zikir")paintCounter();renderTotal();
}
function paintCounter(){
  const z=zCur(),c=zs.counts[z.id]||0,t=zTarget(z),el=$("#tapNum");if(!el)return;
  el.textContent=c;$("#tapOf").textContent="/ "+t+(c>t?"  (+"+(c-t)+")":"");
  const r=46,L=2*Math.PI*r,p=Math.min(1,(c%t||(c&&c>=t?t:0))/t);
  $("#ringFg").style.strokeDasharray=L;$("#ringFg").style.strokeDashoffset=L*(1-(c>=t&&c%t===0?1:p));
  $("#tap").classList.toggle("done",c>=t);
}
function renderTotal(){const v=hist[todayKey()]||0;const kt=$("#kpiToday");if(kt)kt.textContent=v.toLocaleString("tr-TR");$("#todayTot").textContent=v?("Bugün "+v.toLocaleString("tr-TR")+" zikir"):""}

   <h2>Diziler</h2><div class="list">${DIZILER.map(f=>`<a class="row" target="_blank" rel="noopener" href="${yt(f.q)}"><span class="t"><b>${esc(f.n)}</b><span>${esc(f.y)} · ${esc(f.d)}</span></span><span class="go">İzle ›</span></a>`).join("")}</div>
   <div class="note">TRT yapımlarının tamamı resmî olarak <a href="https://www.tabii.com" target="_blank" rel="noopener"><b>tabii</b></a> uygulamasında ve TRT'nin YouTube kanallarında ücretsiz yayında.</div>`;
}
function bKulliyat(){
  document.querySelectorAll("[data-kseg]").forEach(b=>b.onclick=()=>{kulSeg=b.dataset.kseg;renderView()});
  const al=$("#asrLive");if(al)al.onclick=()=>playQueue(RADYO.map(radioTrack),0);
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>playQueue(RADYO.map(radioTrack),+b.dataset.r));
}

/* ===================== Başlat ===================== */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;store.set("mk_tab",tab);renderView();window.scrollTo(0,0)});
renderView();
</script>
