<style>
/* Layout: tek sütun mobil uygulama — üstte başlık, ortada sekme içeriği, altta mini çalar + sekme çubuğu */
:root{
  --bg:#0e1517; --surface:#152125; --surface2:#1c2b30; --line:#26383e;
  --fg:#ebe7dc; --muted:#93a3a3; --accent:#d8b06a; --accent-ink:#1a1408; --good:#7cc6a0;
  --f-ar:"Amiri","Geeza Pro","Times New Roman",serif;
  --f-disp:"Literata",Georgia,serif;
  --f-body:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f5f4; --surface:#ffffff; --surface2:#e8eeec; --line:#d3dcda;
  --fg:#13201f; --muted:#5b6b69; --accent:#94661c; --accent-ink:#ffffff; --good:#2f8a5c; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f5f4; --surface:#ffffff; --surface2:#e8eeec; --line:#d3dcda;
  --fg:#13201f; --muted:#5b6b69; --accent:#94661c; --accent-ink:#ffffff; --good:#2f8a5c; color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
[hidden]{display:none!important}
.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 150px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:6px 14px}
header.top h1{font:600 26px/1.15 var(--f-disp);margin:0;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px}
.hijri{font-size:12px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.seg{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg{gap:4px}
.seg button{padding:9px 6px;font-size:13.5px}
h2{font:600 19px/1.25 var(--f-disp);margin:22px 0 10px}
h3{font-size:15px;margin:0 0 4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.ar{font-family:var(--f-ar);direction:rtl;line-height:2;font-size:24px}

/* Zikir */
.zcard{background:var(--surface);border-radius:22px;padding:18px 16px 16px;display:grid;gap:10px;text-align:center;user-select:none;-webkit-user-select:none}
.zcard .ar{font-size:calc(30px*var(--arz,1));line-height:1.7}
.zcard .read{font-weight:600}
.zcard .mean{font-size:13px;color:var(--muted);max-width:44ch;margin:0 auto}
.tap{position:relative;width:min(70vw,250px);aspect-ratio:1;margin:6px auto 0;border-radius:50%;display:grid;place-items:center;touch-action:manipulation;cursor:pointer;background:radial-gradient(circle at 50% 40%,var(--surface2),var(--surface) 70%)}
.tap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tap .num{font:600 64px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.tap .of{font-size:13px;color:var(--muted);margin-top:4px}
.tap:active{transform:scale(.985)}
.tap.done .num{color:var(--good)}
.zrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{padding:9px 14px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill{text-decoration:none}
.pill.acc{background:var(--accent);color:var(--accent-ink)}
.pill.ghost{background:transparent;border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:12px -16px 0;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;text-align:left}
.chip b{display:block;font-weight:600}
.chip span{font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--accent)}
.lockbox{background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:14px;margin-top:14px;font-size:14px}
.lockbox ol{margin:6px 0 0;padding-left:20px}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px;margin-top:8px}
.stats div{display:grid;gap:4px;justify-items:center;font-size:11px;color:var(--muted);height:100%;align-content:end}
.stats i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.85;min-height:3px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:120px;background:var(--surface);border-radius:14px;padding:12px}
.kpi b{font:600 22px var(--f-disp);display:block;font-variant-numeric:tabular-nums}

/* Listeler */
.list{display:grid;gap:2px;background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);text-align:left;width:100%;text-decoration:none}
.row + .row{border-top:1px solid var(--line)}
.row .no{width:30px;flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:center}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:12.5px;color:var(--muted)}
.row .ar{font-size:20px;line-height:1.3}
.row.playing b{color:var(--accent)}
.row .go{color:var(--muted);font-size:13px;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px;align-content:start;text-decoration:none}
.card b{font-weight:600}
.card span{font-size:12.5px;color:var(--muted)}
.card .tag{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.card .tag.yt{color:var(--muted)}
.bigcard{background:var(--surface);border-radius:18px;padding:16px;display:grid;gap:8px;text-align:left;width:100%}
.bigcard .ttl{font:600 18px/1.25 var(--f-disp)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search],input[type=text],input[type=number],input[type=time],input[type=password]{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:10px}
.note b{color:var(--fg)}
.grid160{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.grid160 a{background:var(--surface);border-radius:10px;padding:9px 0;text-align:center;text-decoration:none;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}

/* Dua kartları */
.dua{background:var(--surface);border-radius:18px;padding:16px;display:grid;gap:8px;margin-bottom:10px}
.dua .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dua .cnt{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.dua .ar{font-size:calc(23px*var(--arz,1));text-align:right}
.dua .read{font-style:italic;font-size:14px}
.dua .mean{font-size:14px;color:var(--muted)}
.dua .src{font-size:12px;color:var(--muted)}

/* Mini çalar ve sekmeler */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.mini{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px 6px}
.mini .art{width:42px;height:42px;border-radius:10px;flex:none;background:var(--surface2);background-size:cover}
.mini .t{flex:1;min-width:0;text-align:left}
.mini .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib svg{width:24px;height:24px;fill:currentColor}
.ib.big{width:68px;height:68px;background:var(--accent);color:var(--accent-ink)}
.ib.big svg{width:32px;height:32px}
.mprog{height:4px;background:var(--line);max-width:640px;margin:0 auto;position:relative}
.mprog i{display:block;height:100%;width:0;background:var(--accent);border-radius:0 2px 2px 0}
.mprog b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);left:0;transition:transform .12s}
#mscrub{position:absolute;left:0;right:0;top:-14px;height:30px;touch-action:none;cursor:pointer;z-index:2}
#mscrub.drag ~ b{transform:scale(1.4)}
.mtip{position:absolute;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.nprev{display:grid;gap:4px;margin-top:6px}
.nprev div{font-size:13px;line-height:1.35;padding:5px 9px;border-radius:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--fg);text-align:left}
.nprev div em{font-style:normal;font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.nprev small{font-size:12px;color:var(--muted);text-align:left}
.row.here{outline:2px solid var(--accent);outline-offset:-2px}
nav.tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:grid;justify-items:center;gap:2px;padding:7px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 20px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.sheet .bar{display:flex;justify-content:space-between;align-items:center}
.sheet .bigart{width:min(78vw,340px);aspect-ratio:1;border-radius:24px;margin:18px auto 10px;background:var(--surface2);background-size:cover;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sheet .ttl{font:600 21px/1.3 var(--f-disp);text-align:center;margin-top:8px;text-wrap:balance}
.sheet .who{text-align:center;color:var(--muted);font-size:14px}
.seek{width:100%;margin-top:18px;accent-color:var(--accent)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pctrl{display:flex;justify-content:center;align-items:center;gap:22px;margin:14px 0}
.opts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.qlist{margin-top:18px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:grid;place-items:end center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;padding:18px;width:100%;max-width:480px;display:grid;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bar2{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--accent)}
.pod{display:flex;gap:12px;align-items:center;padding:11px 14px;background:var(--surface);width:100%;text-align:left}
.pod + .pod{border-top:1px solid var(--line)}
.pod img{width:52px;height:52px;border-radius:10px;flex:none;object-fit:cover;background:var(--surface2)}
.pod .t{flex:1;min-width:0}
.pod .t b{display:block;font-weight:600}
.pod .t span{font-size:12.5px;color:var(--muted)}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1;min-width:0}
.vakit{border-radius:22px;padding:18px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18);display:grid;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.vk-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.85}
.vk-ad{font:600 30px/1.1 var(--f-disp);margin-top:6px}
.vk-sub{font-size:14px;opacity:.9}
.vk-times{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px;text-align:center;font-size:11px}
.vk-times div{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 0;display:grid;gap:2px}
.vk-rem{justify-self:start;margin-top:8px;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px}
.vk-times b{font-size:13px;font-variant-numeric:tabular-nums}
.vk-times .nx{background:rgba(255,255,255,.14);outline:1.5px dashed rgba(255,255,255,.7)}
.vk-times .cur{background:#fff;text-shadow:none;box-shadow:0 4px 14px rgba(0,0,0,.25);transform:scale(1.06)}
.soz{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:18px;padding:16px;display:grid;gap:6px}
.soz-t{font:500 18px/1.45 var(--f-disp);text-wrap:pretty}
.amel .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;color:var(--accent-ink)}
.amel.ok .chk{background:var(--accent);border-color:var(--accent)}
.amel.ok b{color:var(--muted);text-decoration:line-through}
details>summary::-webkit-details-marker{display:none}
.bedir{display:flex;flex-wrap:wrap;gap:6px}
.bedir span{background:var(--surface2);border-radius:999px;padding:5px 10px;font-size:13px}
.mk{font-size:12px;color:var(--accent);flex:none;font-weight:700}
.mk.done{color:var(--good)}
textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:84px;resize:vertical}
.nrow{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;background:var(--surface)}
.nrow + .nrow{border-top:1px solid var(--line)}
.nrow .ts{flex:none;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:13px;padding-top:1px;min-width:44px}
.nrow .tx{flex:1;min-width:0;text-align:left;font-size:14px;overflow-wrap:anywhere}
.nrow .tx span{display:block;font-size:12px;color:var(--muted)}
.nrow .x{flex:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border-radius:14px;padding:14px}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.grid160 a.done{background:var(--surface2);color:var(--good)}
.grid160 a.cur{outline:2px solid var(--accent)}
.ayet.playing{outline:2px solid var(--accent);outline-offset:2px}
.chk-b{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;color:var(--accent-ink)}
.chk-b.on{background:var(--accent);border-color:var(--accent)}
.hat{display:grid;gap:8px;padding:12px;background:var(--surface2);border-radius:14px}
.hat input[type=time]{width:auto}
.gunler{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.gn{padding:6px 9px;border-radius:9px;background:var(--surface);font-size:13px;font-weight:600}
.gn.on{background:var(--accent);color:var(--accent-ink)}
.modal .box{max-height:88vh;overflow:auto}
.modal.ust{place-items:start center;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.modal.ust .box{max-height:62vh}
.modal textarea{min-height:120px;font-size:16px}
.nrow .ed{flex:none;color:var(--muted);font-size:16px;padding:2px 6px}
.nb{flex:none;display:inline-flex;align-items:center;gap:3px;padding:6px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--surface2);color:var(--muted);cursor:pointer;margin-left:2px}
.nb i{width:8px;height:8px;border-radius:50%;display:inline-block}
.nb.has{color:var(--fg);background:color-mix(in srgb,var(--accent) 22%,var(--surface2))}
.pens{display:flex;gap:10px;flex-wrap:wrap}
.pens button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.pens button.on{border-color:var(--fg)}
.ngroup{border-radius:18px;background:var(--surface);padding:12px;display:grid;gap:8px;margin-bottom:12px}
.ngroup .gh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ngroup .gh b{font:600 16px/1.3 var(--f-disp)}
.ncard{border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.ncard .tx{flex:1;min-width:0;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.ncard .tx small{display:block;color:var(--muted);font-size:12px;margin-top:4px;white-space:normal}
.ncard .tx .nt{display:block;font-weight:600}
.ncard .tx .nh{display:block;font:700 15.5px/1.3 var(--f-disp);margin-bottom:2px}
#npTxt{font-weight:600}
.ncard .ts{flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px;min-width:40px}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;z-index:85;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.undo span{white-space:nowrap}
.undo button{white-space:nowrap;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:7px 12px;font-weight:700}
.vt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.vt th,.vt td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
.vt th{position:sticky;top:0;background:var(--surface)}
.vt tr.bugun td{background:var(--surface2);font-weight:700;color:var(--accent)}
.vakit{position:relative;overflow:hidden}
.vakit>*{position:relative}
.vakit.gece::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 15%,#fff,transparent),radial-gradient(1px 1px at 72% 45%,#fff,transparent),radial-gradient(2px 2px at 88% 22%,#fff,transparent),radial-gradient(1px 1px at 45% 40%,#fff,transparent),radial-gradient(1px 1px at 92% 75%,#fff,transparent),radial-gradient(1.5px 1.5px at 20% 88%,#fff,transparent)}
.vk-times div{position:relative;border:1px solid rgba(255,255,255,.18)}
.vk-times .cur{font-weight:700}
.vk-times .cur b{font-size:15px}
.simdi{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.08em;background:#ffd36a;color:#3a2600;border-radius:6px;padding:1px 5px;text-shadow:none}
#takip{position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,#fbf5e6,#f3e9cf);color:#2b2418;display:grid;grid-template-rows:auto 1fr auto;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}

.tk-x{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.07);font-size:18px;color:#2b2418}

.tk-no{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;background:#b08a4a;color:#fff;font-size:.45em;vertical-align:middle;font-family:system-ui}

.tk-tr{font-size:clamp(19px,5.4vw,28px);font-weight:700;line-height:1.35;max-width:640px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ===== Sürüm 29: profesyonel görünüm, renkli bölümler, ezan sayacı ===== */
body{font-size:15.5px;letter-spacing:.005em}
h2{letter-spacing:-.01em}
.row .t b{font-size:15.5px;letter-spacing:-.005em}
.card,.bigcard,.list,.soz,.dua,.note,.kpi{box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 8px 22px rgba(0,0,0,.14)}
.card b{font-size:15.5px}
.list.renkli>.row,.list.renkli>.nrow,.list.renkli>.pod{background:linear-gradient(90deg,color-mix(in srgb,var(--rb) 12%,var(--surface)) 0%,var(--surface) 78%);box-shadow:inset 3px 0 0 var(--rb)}
.list.renkli>.row .no{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--rb) 22%,transparent);color:var(--rc);font-weight:800;font-size:13.5px}
.list.renkli>.nrow .ts{color:var(--rc)}
.list.renkli>.row.playing{background:color-mix(in srgb,var(--rb) 26%,var(--surface))}
.list.renkli>.row.playing .no{background:var(--rb);color:#fff}
.ezan{margin-top:12px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:12px 14px 13px;display:grid;gap:5px}
.ez-l{font-size:13.5px;font-weight:800;letter-spacing:.03em}
.ez-t{font:800 46px/1.02 var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ez-bar{height:7px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.ez-bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .9s linear}
.ez-s{font-size:12.5px;opacity:.9;font-weight:600}
.ezan.yakin{animation:ezNabiz 1.8s ease-in-out infinite}
@keyframes ezNabiz{50%{box-shadow:0 0 0 5px rgba(255,255,255,.32)}}
.ezchip{margin-top:6px;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--fg);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.ezchip.yakin{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.ezan.yakin{animation:none}.ez-bar i{transition:none}}
.devam{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}

 sabah:[
  {n:"Âyetü'l-Kürsî",c:"Sabah-akşam 1",ar:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",r:"Allâhü lâ ilâhe illâ hüve'l-hayyü'l-kayyûm, lâ te'huzühû sinetün ve lâ nevm, lehû mâ fi's-semâvâti ve mâ fi'l-ard, men zellezî yeşfeu indehû illâ bi-iznih, ya'lemü mâ beyne eydîhim ve mâ halfehüm, ve lâ yühîtûne bi-şey'in min ilmihî illâ bimâ şâ', vesia kürsiyyühü's-semâvâti ve'l-ard, ve lâ yeûdühû hıfzuhümâ ve hüve'l-aliyyü'l-azîm.",m:"Allah, O'ndan başka ilah olmayan, diri ve her şeyi ayakta tutandır. O'nu ne uyuklama ne uyku tutar. Göklerde ve yerde ne varsa O'nundur. O'nun izni olmadan katında kim şefaat edebilir? Kulların önündekini ve arkasındakini bilir; O'nun dilediği kadarı dışında ilminden hiçbir şeyi kavrayamazlar. Kürsüsü gökleri ve yeri kuşatmıştır; onları korumak O'na ağır gelmez. O yücedir, büyüktür.",src:"Bakara 2/255",ay:[[2,255]],z:{t:1},tam:1},
  {n:"İhlâs, Felak, Nâs",c:"Sabah-akşam 3'er",ar:"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ۞ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ۞ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",r:"Kul hüvallâhü ehad. Allâhü's-samed. Lem yelid ve lem yûled. Ve lem yekün lehû küfüven ehad. — Kul eûzü bi-rabbi'l-felak. Min şerri mâ halak. Ve min şerri ğâsikın izâ vekab. Ve min şerri'n-neffâsâti fi'l-ukad. Ve min şerri hâsidin izâ hased. — Kul eûzü bi-rabbi'n-nâs. Meliki'n-nâs. İlâhi'n-nâs. Min şerri'l-vesvâsi'l-hannâs. Ellezî yüvesvisü fî sudûri'n-nâs. Mine'l-cinneti ve'n-nâs.",m:"İhlâs: De ki: O, Allah'tır, bir tektir. Allah Samed'dir (her şey O'na muhtaçtır, O hiçbir şeye muhtaç değildir). O doğurmamış ve doğmamıştır. Hiçbir şey O'na denk değildir. — Felak: De ki: Yarattığı şeylerin kötülüğünden, karanlığı çöktüğü zaman gecenin kötülüğünden, düğümlere üfleyenlerin kötülüğünden ve haset ettiği zaman hasetçinin kötülüğünden, sabah aydınlığının Rabbine sığınırım. — Nâs: De ki: Cinlerden ve insanlardan; insanların kalplerine vesvese veren o sinsi vesvesecinin kötülüğünden, insanların Rabbine, insanların Melik'ine, insanların İlâh'ına sığınırım.",src:"Kur'an 112-114 · Ebû Dâvûd, Tirmizî",ay:[[112,1],[112,2],[112,3],[112,4],[113,1],[113,2],[113,3],[113,4],[113,5],[114,1],[114,2],[114,3],[114,4],[114,5],[114,6]],z:{t:3},tam:1},
  {n:"Âmenerrasûlü",c:"Yatsıdan sonra",ar:"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",r:"Âmene'r-resûlü bimâ ünzile ileyhi min rabbihî ve'l-mü'minûn, küllün âmene billâhi ve melâiketihî ve kütübihî ve rusulih, lâ nüferriku beyne ehadin min rusulih, ve kâlû semi'nâ ve eta'nâ ğufrâneke rabbenâ ve ileyke'l-masîr. Lâ yükellifullâhu nefsen illâ vüs'ahâ, lehâ mâ kesebet ve aleyhâ mektesebet, rabbenâ lâ tüâhiznâ in nesînâ ev ahta'nâ, rabbenâ ve lâ tahmil aleynâ ısran kemâ hameltehû ale'llezîne min kablinâ, rabbenâ ve lâ tühammilnâ mâ lâ tâkate lenâ bih, va'fü annâ, vağfir lenâ, verhamnâ, ente mevlânâ fensurnâ ale'l-kavmi'l-kâfirîn.",m:"Peygamber, Rabbinden kendisine indirilene iman etti, mü'minler de. Her biri Allah'a, meleklerine, kitaplarına ve peygamberlerine iman ettiler ve “O'nun peygamberlerinden hiçbiri arasında ayırım yapmayız” dediler. Şöyle de dediler: “İşittik ve itaat ettik. Rabbimiz! Bağışlamanı dileriz. Dönüş ancak sanadır.” Allah, hiç kimseyi gücünün yetmediği bir şeyle yükümlü kılmaz. Herkesin kazandığı iyilik kendi lehine, kazandığı kötülük de kendi aleyhinedir. Rabbimiz! Unutursak veya yanılırsak bizi sorumlu tutma. Rabbimiz! Bize, bizden öncekilere yüklediğin gibi ağır yük yükleme. Rabbimiz! Bize gücümüzün yetmediği şeyler yükleme. Bizi affet, bizi bağışla, bize acı. Sen bizim Mevlâmızsın. Kâfirler topluluğuna karşı bize yardım et.",src:"Bakara 2/285-286",ay:[[2,285],[2,286]],z:{t:1},tam:1},
  {n:"Seyyidü'l-İstiğfâr",c:"Sabah-akşam 1",ar:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",r:"Allâhümme ente rabbî lâ ilâhe illâ ente, halaktenî ve ene abdük, ve ene alâ ahdike ve va'dike mestete'tü, eûzü bike min şerri mâ sana'tü, ebûu leke bi-ni'metike aleyye, ve ebûu leke bi-zenbî fağfir lî, fe-innehû lâ yağfiru'z-zünûbe illâ ente.",m:"Allah'ım, Sen benim Rabbimsin, Senden başka ilah yoktur. Beni Sen yarattın, ben Senin kulunum. Gücüm yettiğince ahdime ve vaadime bağlıyım. Yaptıklarımın şerrinden Sana sığınırım. Bana verdiğin nimetleri ve günahımı itiraf ederim; beni bağışla, günahları Senden başka bağışlayan yoktur.",src:"Buhârî, Deavât 2"},
  {n:"Hasbiyallâh",c:"Sabah-akşam 7",ar:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",r:"Hasbiyallâhü lâ ilâhe illâ hû, aleyhi tevekkeltü ve hüve rabbü'l-arşi'l-azîm.",m:"Allah bana yeter. O'ndan başka ilah yoktur. O'na tevekkül ettim; O, büyük Arş'ın Rabbidir. (Zikirde âyetin bu bölümü söylenir. Ses kaydında Tevbe 129. âyetin tamamı okunur: “Eğer yüz çevirirlerse de ki: …”)",src:"Tevbe 9/129 · Ebû Dâvûd",ay:[[9,129]],z:{t:7}},
  {n:"Bismillâhillezî",c:"Sabah-akşam 3",ar:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",r:"Bismillâhillezî lâ yedurru mea'smihî şey'ün fi'l-ardı ve lâ fi's-semâi ve hüve's-semîu'l-alîm.",m:"Adıyla anıldığında yerde ve gökte hiçbir şeyin zarar veremediği Allah'ın adıyla. O işitendir, bilendir.",src:"Ebû Dâvûd, Tirmizî",z:{t:3}},
  {n:"Radîtü Billâhi Rabben",c:"Sabah-akşam 3",ar:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا",r:"Radîtü billâhi rabben, ve bi'l-İslâmi dînen, ve bi-Muhammedin sallallâhu aleyhi ve selleme nebiyyen.",m:"Rab olarak Allah'tan, din olarak İslâm'dan, peygamber olarak Hz. Muhammed'den razıyım.",src:"Ebû Dâvûd, Tirmizî",z:{t:3}},
  {n:"Asbahnâ",c:"Sabah",ar:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",r:"Asbahnâ ve asbaha'l-mülkü lillâh, ve'l-hamdü lillâh, lâ ilâhe illallâhu vahdehû lâ şerîke leh, lehü'l-mülkü ve lehü'l-hamdü ve hüve alâ külli şey'in kadîr. Rabbi es'elüke hayra mâ fî hâze'l-yevmi ve hayra mâ ba'deh, ve eûzü bike min şerri mâ fî hâze'l-yevmi ve şerri mâ ba'deh. Rabbi eûzü bike mine'l-keseli ve sûi'l-kiber. Rabbi eûzü bike min azâbin fi'n-nâri ve azâbin fi'l-kabr.",m:"Sabaha erdik, mülk de Allah'ın olarak sabaha erdi. Hamd Allah'adır. Allah'tan başka ilah yoktur; O tektir, ortağı yoktur. Mülk O'nundur, hamd O'nadır, O her şeye gücü yetendir. Rabbim! Bu günün hayrını ve ondan sonrakinin hayrını Senden isterim; bu günün şerrinden ve ondan sonrakinin şerrinden Sana sığınırım. Rabbim! Tembellikten ve ihtiyarlığın kötülüğünden Sana sığınırım. Rabbim! Ateşteki azaptan ve kabirdeki azaptan Sana sığınırım.",src:"Müslim, Zikir · İbn Mes'ûd rivayeti"},
  {n:"Afv ve Âfiyet",c:"Sabah-akşam 1",ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي",r:"Allâhümme innî es'elüke'l-afve ve'l-âfiyete fi'd-dünyâ ve'l-âhira. Allâhümme innî es'elüke'l-afve ve'l-âfiyete fî dînî ve dünyâye ve ehlî ve mâlî. Allâhümmestür avrâtî ve âmin rav'âtî. Allâhümmahfaznî min beyni yedeyye ve min halfî ve an yemînî ve an şimâlî ve min fevkî, ve eûzü bi-azametike en uğtâle min tahtî.",m:"Allah'ım! Senden dünyada ve âhirette af ve âfiyet dilerim. Allah'ım! Senden dinim, dünyam, ailem ve malım hakkında af ve âfiyet dilerim. Allah'ım! Ayıplarımı ört, korktuklarımdan beni emin kıl. Allah'ım! Beni önümden, arkamdan, sağımdan, solumdan ve üstümden koru. Altımdan ansızın bir kötülüğe uğramaktan Senin azametine sığınırım.",src:"Ebû Dâvûd, Edeb 101 · İbn Mâce, Dua 14",z:{t:3}},
  {n:"Yâ Hayyu Yâ Kayyûm",c:"Sabah-akşam",ar:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",r:"Yâ Hayyu yâ Kayyûm, bi-rahmetike esteğîs, aslih lî şe'nî küllehû, ve lâ tekilnî ilâ nefsî tarfete ayn.",m:"Ey diri ve her şeyi ayakta tutan! Rahmetinle yardım dilerim. Bütün işlerimi düzelt, beni göz açıp kapayıncaya kadar bile nefsime bırakma.",src:"Hâkim, Müstedrek",z:{t:7}},
  {n:"Sübhânallâhi ve Bihamdihî",c:"Günde 100",ar:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",r:"Sübhânallâhi ve bihamdihî.",m:"Allah'ı hamd ile tesbih ederim. Günde yüz kez söyleyenin hataları deniz köpüğü kadar olsa da bağışlanır.",src:"Buhârî, Deavât 65",zid:"bihamdihi"},
  {n:"Tevhîd",c:"Günde 10 / 100",ar:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",r:"Lâ ilâhe illallâhu vahdehû lâ şerîke leh, lehü'l-mülkü ve lehü'l-hamdü ve hüve alâ külli şey'in kadîr.",m:"Allah'tan başka ilah yoktur; O tektir, ortağı yoktur. Mülk O'nundur, hamd O'nadır, O her şeye kadirdir.",src:"Buhârî, Müslim",zid:"vahdehu"},
  {n:"Emseynâ",c:"Akşam",ar:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",r:"Emseynâ ve emse'l-mülkü lillâh, ve'l-hamdü lillâh, lâ ilâhe illallâhu vahdehû lâ şerîke leh, lehü'l-mülkü ve lehü'l-hamdü ve hüve alâ külli şey'in kadîr. Rabbi es'elüke hayra mâ fî hâzihi'l-leyleti ve hayra mâ ba'dehâ, ve eûzü bike min şerri mâ fî hâzihi'l-leyleti ve şerri mâ ba'dehâ. Rabbi eûzü bike mine'l-keseli ve sûi'l-kiber. Rabbi eûzü bike min azâbin fi'n-nâri ve azâbin fi'l-kabr.",m:"Akşama erdik, mülk de Allah'ın olarak akşama erdi. Hamd Allah'adır. Allah'tan başka ilah yoktur; O tektir, ortağı yoktur. Mülk O'nundur, hamd O'nadır, O her şeye gücü yetendir. Rabbim! Bu gecenin hayrını ve ondan sonrakinin hayrını Senden isterim; bu gecenin şerrinden ve ondan sonrakinin şerrinden Sana sığınırım. Rabbim! Tembellikten ve ihtiyarlığın kötülüğünden Sana sığınırım. Rabbim! Ateşteki azaptan ve kabirdeki azaptan Sana sığınırım.",src:"Müslim, Zikir · İbn Mes'ûd rivayeti"}

 seher:[
  {n:"Seher Vaktinin Kıymeti",c:"Gecenin son üçte biri",r:"",m:"Rabbimiz her gece, gecenin son üçte biri kaldığında dünya semâsına iner ve buyurur: “Bana dua eden yok mu, duasını kabul edeyim; benden isteyen yok mu, vereyim; benden bağışlanma dileyen yok mu, bağışlayayım.”",src:"Buhârî, Teheccüd 14 · Müslim, Müsâfirîn 168 (meal)"},
  {n:"Seherlerde İstiğfar Edenler",c:"Âyet",ar:"وَبِالْأَسْحَارِ هُمْ يَسْتَغْفِرُونَ",r:"Ve bi'l-eshâri hüm yestağfirûn.",m:"Onlar seher vakitlerinde bağışlanma dilerlerdi.",src:"Zâriyât 51/18",ay:[[51,18]],zid:"istigfar"},
  {n:"Âl-i İmrân'ın Son Âyetleri",c:"Gece kalkınca",ar:"إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِّأُولِي الْأَلْبَابِ ۝ الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ ۝ رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ ۖ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ ۝ رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا ۚ رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ ۝ رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ ۗ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ",r:"İnne fî halkı's-semâvâti ve'l-ardı vahtilâfi'l-leyli ve'n-nehâri le-âyâtin li-uli'l-elbâb. Ellezîne yezkürûnallâhe kıyâmen ve ku'ûden ve alâ cünûbihim ve yetefekkerûne fî halkı's-semâvâti ve'l-ard, rabbenâ mâ halakte hâzâ bâtılâ, sübhâneke fekınâ azâbe'n-nâr. Rabbenâ inneke men tüdhili'n-nâra fekad ahzeyteh, ve mâ li'z-zâlimîne min ensâr. Rabbenâ innenâ semi'nâ münâdiyen yünâdî li'l-îmâni en âminû bi-rabbiküm fe-âmennâ, rabbenâ fağfir lenâ zünûbenâ ve keffir annâ seyyiâtinâ ve teveffenâ mea'l-ebrâr. Rabbenâ ve âtinâ mâ veadtenâ alâ rusulike ve lâ tuhzinâ yevme'l-kıyâmeh, inneke lâ tuhlifü'l-mîâd.",m:"Şüphesiz göklerin ve yerin yaratılışında, gece ile gündüzün birbiri ardınca gelişinde akıl sahipleri için elbette ibretler vardır. Onlar, ayakta dururken, otururken, yanları üzerine yatarken Allah'ı anarlar, göklerin ve yerin yaratılışı hakkında düşünürler ve şöyle derler: “Rabbimiz! Sen bunu boş yere yaratmadın. Seni tesbih ederiz. Bizi ateş azabından koru. Rabbimiz! Sen kimi ateşe sokarsan, artık onu muhakkak rezil etmişsindir. Zalimlerin hiçbir yardımcısı yoktur. Rabbimiz! Biz, ‘Rabbinize iman edin’ diye imana çağıran bir davetçiyi işittik, hemen iman ettik. Rabbimiz! Günahlarımızı bağışla, kötülüklerimizi ört ve canımızı iyilerle beraber al. Rabbimiz! Peygamberlerin aracılığıyla bize vaat ettiklerini ver. Kıyamet günü bizi rezil etme. Şüphesiz sen vaadinden caymazsın.” (Efendimiz ﷺ gece uyanınca bu âyetleri okurdu.)",src:"Âl-i İmrân 3/190-194 · Buhârî",ay:[[3,190],[3,191],[3,192],[3,193],[3,194]],tam:1},

const ART_CACHE={};
function makeArt(label,sub,hue){
  const key=label+"|"+sub+"|"+hue;if(ART_CACHE[key])return ART_CACHE[key];
  const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,512,512);gr.addColorStop(0,`hsl(${hue},38%,16%)`);gr.addColorStop(1,`hsl(${hue+25},40%,8%)`);g.fillStyle=gr;g.fillRect(0,0,512,512);
  g.lineWidth=3;g.strokeStyle="rgba(216,176,106,.5)";
  g.save();g.translate(256,232);g.strokeRect(-120,-120,240,240);g.rotate(Math.PI/4);g.strokeRect(-120,-120,240,240);g.restore();
  g.fillStyle="#ebe7dc";g.textAlign="center";g.textBaseline="middle";
  g.font=label.length>4?"600 64px Literata,Georgia,serif":"600 110px Literata,Georgia,serif";g.fillText(label,256,232);
  g.font="500 30px Figtree,system-ui,sans-serif";g.fillStyle="#d8b06a";g.fillText(sub,256,430);
  const u=c.toDataURL("image/png");ART_CACHE[key]=u;return u;
}

let lockOn=false,silentUrl=null;
function silentURL(){
  if(silentUrl)return silentUrl;const sr=8000,n=sr*2,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,(Math.random()*6-3)|0,true);
  silentUrl=URL.createObjectURL(new Blob([b],{type:"audio/wav"}));return silentUrl;
}

async function loadEps(pod){

const AMB={};
function wavURL(f,sr){const n=f.length,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,x)=>{for(let i=0;i<x.length;i++)v.setUint8(o+i,x.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  let mx=0;for(let i=0;i<n;i++)mx=Math.max(mx,Math.abs(f[i]));const g=mx?0.6/mx:1;for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,f[i]*g))*32000,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
function genAmbient(k){if(AMB[k])return AMB[k];const sr=22050,L=k==="ezgi"?48:30,cf=sr,n=sr*L,N=n+cf,f=new Float32Array(N);let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  if(k==="ezgi"){const sc=[293.66,311.13,369.99,392,440,466.16,523.25,587.33];let idx=4;const notes=[];for(let t=0.5;t<L-4;t+=2.4){idx=Math.max(0,Math.min(7,idx+[-2,-1,-1,0,1,1,2][Math.floor(rnd()*7)]));notes.push([t,sc[idx]])}
    for(let i=0;i<N;i++){const t=i/sr;let x=Math.sin(2*Math.PI*146.83*t)*.12*(0.7+0.3*Math.sin(2*Math.PI*t/12))+Math.sin(2*Math.PI*220*t)*.03;
      for(const [t0,fr] of notes){const d=t-t0;if(d<0||d>6)continue;const env=Math.min(1,d/0.8)*Math.exp(-d/2.2),vb=d>1?Math.sin(2*Math.PI*5*d)*.004:0,ph=2*Math.PI*fr*d*(1+vb);x+=env*(Math.sin(ph)*.32+Math.sin(2*ph)*.09+Math.sin(3*ph)*.03)}
      f[i]=x}
    const d1=Math.floor(.11*sr),d2=Math.floor(.17*sr);for(let i=d2;i<N;i++)f[i]+=f[i-d1]*.35+f[i-d2]*.25}
  else{let b=0,l1=0,l2=0,drop=0,dph=0,dfr=0;for(let i=0;i<N;i++){const t=i/sr,w=rnd()*2-1;b=(b+0.02*w)/1.02;l1+=0.5*(w-l1);l2+=0.02*(w-l2);
      if(k==="yagmur"){if(rnd()<0.0009){drop=0.25*rnd();dfr=2000+rnd()*3000;dph=0}drop*=0.996;dph+=2*Math.PI*dfr/sr;f[i]=(l1-l2)*.5+drop*Math.sin(dph)+b*1.2}
      else if(k==="dalga"){const env=0.2+0.8*Math.pow(Math.sin(Math.PI*t/7.5),2);f[i]=(b*3.5+(l1-l2)*.12)*env}
      else f[i]=b*3.5}}
  for(let i=0;i<cf;i++){const a=i/cf;f[i]=f[i]*a+f[n+i]*(1-a)}
  return AMB[k]=wavURL(f.subarray(0,n),sr)}

/* --- Sesli evrad (âyet kayıtlarıyla, ekran kapalıyken çalar) --- */
const SUR=n=>Array.from({length:AYET[n-1]},(_,i)=>[n,i+1]);
function evradQueue(kind){
  const parts=[["Âyetü'l-Kürsî",[[2,255]],1],["İhlâs",SUR(112),3],["Felak",SUR(113),3],["Nâs",SUR(114),3],["Haşr 22-24",[[59,22],[59,23],[59,24]],1],["Hasbiyallâh (Tevbe 129)",[[9,129]],1]];
  if(kind==="aksam")parts.splice(1,0,["Âmenerrasûlü",[[2,285],[2,286]],1]);
  const out=[];parts.forEach(([n,ay,k])=>{for(let j=1;j<=k;j++)out.push(...ayahTracks(ay,(kind==="aksam"?"Akşam":"Sabah")+" evradı · "+n+(k>1?" ("+j+"/"+k+")":"")).map(t=>(t.group=(kind==="aksam"?"Akşam":"Sabah")+" Evradı",t)))});
  return out;
}

/* --- Vakit hatırlatıcı + kilit ekranında vecize --- */
let guardOn=false,chimeUrl=null,chimeBusy=false;const FIRED=new Set();
function makeChime(){if(chimeUrl)return chimeUrl;const sr=22050,dur=2.6,n=Math.floor(sr*dur),b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const t=i/sr;let x=0;[[0,659.25],[0.55,880],[1.1,987.77]].forEach(([s0,f])=>{if(t>=s0){const tt=t-s0;x+=Math.sin(2*Math.PI*f*tt)*Math.exp(-tt*2.4)*.32+Math.sin(4*Math.PI*f*tt)*Math.exp(-tt*4)*.06}});v.setInt16(44+i*2,Math.max(-1,Math.min(1,x))*30000,true)}
  chimeUrl=URL.createObjectURL(new Blob([b],{type:"audio/wav"}));return chimeUrl}
function webChime(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();[[0,659.25],[.55,880],[1.1,987.77]].forEach(([d,f])=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+d;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+1.7)})}catch(e){}}
function chime(){
  if((guardOn||lockOn)&&!chimeBusy&&au.paused){chimeBusy=true;zau.loop=false;zau.src=makeChime();zau.play().catch(()=>{});zau.onended=()=>{zau.onended=null;chimeBusy=false;zau.src=silentURL();zau.loop=true;zau.play().catch(()=>{});if(guardOn)guardMeta(true);else lockMeta()};}
  else webChime();
}
function guardStart(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  if(lockOn)lockStop(true);au.pause();zau.src=silentURL();zau.loop=true;
  zau.play().then(()=>{guardOn=true;SET.remind=true;store.set("mk_set",SET);guardHandlers();guardMeta(true);toast("Hatırlatıcı açık · ekranı kilitleyebilirsin");if(tab==="bugun")renderView()}).catch(()=>toast("Başlatılamadı, tekrar dokun"));
  try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
}
function guardStop(){if(!guardOn)return;guardOn=false;SET.remind=false;store.set("mk_set",SET);if(!lockOn){zau.pause();zau.removeAttribute("src")}msPlayer();toast("Hatırlatıcı kapandı")}
function guardHandlers(){if(!("mediaSession" in navigator))return;const ms=navigator.mediaSession,set=(a,f)=>{try{ms.setActionHandler(a,f)}catch(e){}};
  const keep=()=>{zau.play().catch(()=>{});try{ms.playbackState="playing"}catch(e){}};
  set("play",keep);set("pause",()=>{guardStop();if(tab==="bugun")renderView()});set("nexttrack",()=>{vecizeI++;guardMeta(true);keep()});set("previoustrack",()=>{vecizeI=Math.max(0,vecizeI-1);guardMeta(true);keep()});set("seekto",null);}
let vecizeI=Math.floor(Math.random()*100),lastMeta=0;
function guardMeta(force){if(!guardOn||!("mediaSession" in navigator))return;if(!force&&Date.now()-lastMeta<55000)return;lastMeta=Date.now();
  const {v,next}=curVakit(),mins=Math.max(0,Math.round((next[1]-new Date())/60000)),k=mins>=60?Math.floor(mins/60)+" sa "+(mins%60)+" dk":mins+" dk";
  if(!force)vecizeI++;const pool=SOZLER.concat(VEC.map(v=>({t:v.t,s:v.s||"Risale-i Nur"})));const z=pool[vecizeI%pool.length];
  try{navigator.mediaSession.metadata=new MediaMetadata({title:next[0]+" vaktine "+k,artist:z.t+" — "+z.s,album:VAKIT_AD[v]+" vakti · Maneviyat",artwork:[{src:makeArt(next[0],k,200),sizes:"512x512",type:"image/png"}]});navigator.mediaSession.playbackState="playing"}catch(e){}}

function kibleAci(){const la=((TIMES&&TIMES.lat)||41.0082)*Math.PI/180,lo=((TIMES&&TIMES.lon)||28.9784)*Math.PI/180,kla=21.4225*Math.PI/180,klo=39.8262*Math.PI/180,d=klo-lo;
  return (Math.atan2(Math.sin(d),Math.cos(la)*Math.tan(kla)-Math.sin(la)*Math.cos(d))*180/Math.PI+360)%360}

/* --- Mübarek günler --- */
let HIJ=null;
function hijriOf(d){try{const f=HIJ||(HIJ=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"numeric"}));const p=f.formatToParts(d);return{m:+p.find(x=>x.type==="month").value,d:+p.find(x=>x.type==="day").value}}catch(e){return null}}
function mubarekGunler(){
  const out=[],start=new Date();start.setHours(12,0,0,0);let regaipDone={};
  for(let i=0;i<380&&out.length<12;i++){const d=new Date(start.getTime()+i*864e5),h=hijriOf(d),nx=hijriOf(new Date(d.getTime()+864e5));if(!h||!nx)return[];
    const add=(n,ev)=>out.push({n,d,ev});
    if(nx.m===7&&nx.d<=7&&new Date(d.getTime()+864e5).getDay()===5&&!regaipDone[d.getFullYear()]){regaipDone[d.getFullYear()]=1;add("Regaip Kandili",1)}
    if(nx.m===7&&nx.d===27)add("Miraç Kandili",1);
    if(nx.m===8&&nx.d===15)add("Berat Kandili",1);
    if(h.m===9&&h.d===1)add("Ramazan'ın ilk günü",0);
    if(nx.m===9&&nx.d===27)add("Kadir Gecesi",1);
    if(h.m===10&&h.d===1)add("Ramazan Bayramı",0);
    if(h.m===12&&h.d===9)add("Kurban Bayramı Arefesi",0);
    if(h.m===12&&h.d===10)add("Kurban Bayramı",0);
    if(h.m===1&&h.d===1)add("Hicrî Yılbaşı",0);
    if(h.m===1&&h.d===10)add("Aşure Günü",0);
    if(nx.m===3&&nx.d===12)add("Mevlid Kandili",1);
    if(h.m===7&&h.d===1)add("Üç Ayların Başlangıcı",0);
    if(h.m===9&&nx.m===10)add("Ramazan Bayramı Arefesi",0);
    if(h.m===12&&h.d===1)add("Zilhicce'nin İlk On Günü",0);
  }
  return out;
}

function zekatAc(){const z=store.get("mk_zekat",{});const f=[["altinFiyat","Altının gram fiyatı (TL)"],["nakit","Nakit ve banka (TL)"],["altin","Altın (gram)"],["doviz","Döviz, hisse vb. (TL karşılığı)"],["ticari","Ticaret malı (TL)"],["alacak","Tahsili umulan alacak (TL)"],["borc","Borçlar (TL)"]];
  openModal(`<h3>💰 Zekât hesapla</h3>${f.map(([k,l])=>`<label class="small muted" style="display:grid;gap:4px">${l}<input type="number" inputmode="decimal" data-zk="${k}" value="${z[k]||""}"></label>`).join("")}<div id="zkOut" class="soz"></div><div class="small muted">Diyanet İşleri Başkanlığı'na göre nisap 80,18 gram altın değerindedir; ihtiyaç fazlası olup üzerinden bir kamerî yıl geçen servetin kırkta biri (%2,5) verilir. Özel durumlar için müftülüğe danış.</div><button class="pill ghost" id="mNo">Kapat</button>`,()=>{
    const calc=()=>{const v={};document.querySelectorAll("[data-zk]").forEach(i=>v[i.dataset.zk]=parseFloat(String(i.value).replace(",","."))||0);store.set("mk_zekat",v);
      const top=v.nakit+v.altin*v.altinFiyat+v.doviz+v.ticari+v.alacak-v.borc,nis=80.18*v.altinFiyat,tl=x=>x.toLocaleString("tr-TR",{maximumFractionDigits:2})+" TL";
      $("#zkOut").innerHTML=!v.altinFiyat?"Önce altının gram fiyatını yaz.":`<div>Net servet: <b>${tl(top)}</b></div><div>Nisap: <b>${tl(nis)}</b></div><div class="soz-t">${top>=nis?"Vermen gereken zekât: "+tl(top/40):"Nisaba ulaşmıyor; zekât düşmez."}</div>`};
    document.querySelectorAll("[data-zk]").forEach(i=>i.oninput=calc);calc();$("#mNo").onclick=closeModal})}
function bBugunExtra(){
  bSaatKart();
  const go=(t,s)=>{tab=t;if(t==="kulliyat")kulSeg=s;if(t==="dinle"){dinleSeg=s;openSeries=null}renderView();toTop()};
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  on("#aylikBtn",aylikAc);on("#zekatBtn",zekatAc);on("#risaleBtn",()=>go("kulliyat","risale"));on("#hadisBtn",()=>go("kulliyat","hadis"));on("#vcGo",()=>go("kulliyat","risale"));on("#vcPay",()=>{const v=vecGunun(0);if(v)paylas(vecMetin(v))});on("#vcSes",()=>{const v=vecGunun(0);if(v)playQueue(chunkText(v.t,180).map(c=>ttsTrack(c,"tr-TR","Günün vecizesi",v.s||"Risale-i Nur",makeArt("❝","Risale-i Nur",150),"Risale-i Nur")),0)});
  on("#okuBtn",()=>{kuranMod="oku";store.set("mk_kmod2","oku");openSure=null;go("dinle","kuran")});
  on("#dlistBtn",()=>{bugSeg="dualar";duaSeg2="liste";renderView();setTimeout(()=>{const s=document.querySelector("[data-dseg2]");if(s)s.scrollIntoView({block:"start"})},50)});
  on("#davetAc",async()=>{if(await pushEnable())renderView()});on("#davetGizle",()=>{store.set("mk_push_gizle",true);renderView()});
  on("#dlEkle",()=>{const a=$("#dlAd").value.trim();if(!a){toast("İsim yaz");return}DLIST.push({id:"d"+Date.now(),ad:a,not:$("#dlNot").value.trim(),say:0,son:""});store.set("mk_dlist",DLIST);renderView()});
  document.querySelectorAll("[data-dlok]").forEach(b=>b.onclick=()=>{const d=DLIST.find(x=>x.id===b.dataset.dlok);if(!d)return;if(d.son===todayKey()){d.son="";d.say=Math.max(0,(d.say||0)-1)}else{d.son=todayKey();d.say=(d.say||0)+1}store.set("mk_dlist",DLIST);renderView()});
  document.querySelectorAll("[data-dldel]").forEach(b=>b.onclick=()=>{DLIST=DLIST.filter(x=>x.id!==b.dataset.dldel);store.set("mk_dlist",DLIST);renderView()});
}

function kissaTracks(i){const k=KISSA[i],art=makeArt("📖",k.ad.slice(0,22),k.h);
  const parts=chunkText(k.ad+". "+k.oz+" Bu kıssadan alacağımız ders: "+k.ders,380);
  const L=parts.map((c,p)=>Object.assign(ttsTrack(c,"tr-TR",k.ad,"Kur'an Kıssası · "+(p+1)+"/"+parts.length,art,"Kur'an Kıssaları"),{key:"k_"+i,ctx:{type:"kissa",i}}));
  return L.concat(ayahTracks(k.ay,k.ad+" · âyet").map(t=>Object.assign(t,{group:"Kur'an Kıssaları",key:"k_"+i,ctx:{type:"kissa",i}})))}
function kissaPlan(i){const k=KISSA[i];return `📖 ${k.ad}\nKaynak: ${k.yer}\nDeğerler: ${k.deg.join(", ")}\n\nKıssa:\n${k.oz}\n\nAlınacak ders:\n${k.ders}\n\nSınıf etkinliği:\n${k.etk}\n\nTartışma sorusu:\n${k.soru}\n\n${k.oo}`}

       <div class="ncard" style="background:color-mix(in srgb,${c} 10%,var(--surface2))"><span class="ts" style="color:${c}">🎨</span><span class="tx"><b>Sınıf etkinliği</b><br>${esc(k.etk)}</span></div>

   <div class="note">Kıssalar Kur'an'daki anlatıma sadık kısa özetlerdir; derste ilgili âyetlerin mealini birlikte okumak en sağlam yoldur.</div>`}

async function dosyaPaylas(txt,ad){try{const f=new File([txt],ad,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:ad});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=ad;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),800);return true}catch(e){return false}}
async function notYedekle(){if(!NOTES.length){toast("Yedeklenecek not yok");return}const txt=JSON.stringify({app:"maneviyat-notlar",v:SURUM,t:new Date().toISOString(),notes:NOTES},null,1);
  const ok=await dosyaPaylas(txt,"maneviyat-notlarim-"+todayKey()+".json");if(ok){SET.notYedek=Date.now();store.set("mk_set",SET);toast("Notlarının yedeği hazır");renderView()}}
function notYukle(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const arr=j&&j.notes?j.notes:(j&&j.d&&j.d.mk_notes?JSON.parse(j.d.mk_notes):null);if(!Array.isArray(arr))throw 0;
  snapNotes();let yeni=0;const by=new Map(NOTES.map(n=>[n.id,n]));arr.forEach(n=>{if(!n||!n.id||!n.text)return;const o=by.get(n.id);if(!o){NOTES.push(n);yeni++}else if((n.edited||0)>(o.edited||0))Object.assign(o,n)});
  saveLib();undoBar(yeni+" not geri yüklendi");renderView()}catch(e){toast("Bu dosya geçerli bir not yedeği değil")}};r.readAsText(file)}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

  const txt=JSON.stringify({app:"maneviyat",v:SURUM,t:new Date().toISOString(),d:o});dosyaPaylas(txt,"maneviyat-yedek-"+todayKey()+".json").then(ok=>{if(ok){SET.notYedek=Date.now();store.set("mk_set",SET);toast("Yedek dosyası hazırlandı")}})}catch(e){toast("Yedek alınamadı")}}
function yedekYukle(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.app!=="maneviyat"||!j.d)throw 0;

/* ---------- Anahtar ayıklama: her biçim (AIza…, AQ.… vb.) ---------- */
function anahtarAyikla(t){t=String(t||"");const out=[];
  (t.match(/AIza[0-9A-Za-z_\-]{35}/g)||[]).forEach(k=>{out.push(k);t=t.replace(k," ")});
  t.split(/[\s,;|"'`]+/).forEach(x=>{x=x.trim().replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9_\-]+$/g,"");if(x.length>=20&&/^[A-Za-z0-9._\-]+$/.test(x))out.push(x)});
  return [...new Set(out)]}

let GEM_OFF=0,GEM_TOAST=0;const GEM_MEM={};
function hsh(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+s.length}
function pcmWav(b64,rate){const bin=atob(b64),n=bin.length,buf=new ArrayBuffer(44+n),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n,true);
  const u=new Uint8Array(buf,44);for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i);return new Blob([buf],{type:"audio/wav"})}
async function gemSes(text,voice){voice=voice||gemVoice();const key="https://ses.maneviyat/"+voice+"/"+hsh(text)+".wav";
  if(GEM_MEM[key])return GEM_MEM[key];
  let c=null;try{c=await caches.open("mk-ses-v1");const m=await c.match(key);if(m){const u=URL.createObjectURL(await m.blob());GEM_MEM[key]=u;return u}}catch(e){}
  if(Date.now()<GEM_OFF)throw new Error("doğal ses geçici olarak kapalı");
  const body=JSON.stringify({contents:[{parts:[{text:(/[\u0600-\u06FF]/.test(text)?"Read the following Arabic prayer aloud as a mature man, with a deep, calm, reverent male voice and correct classical Arabic pronunciation, slowly and clearly. Read only the text itself:\n\n":"Read the following Turkish text aloud as a mature man, with a deep, calm, warm and reverent male voice, at a natural pace and with correct Turkish pronunciation. Read only the text itself:\n\n")+text}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}});
  let err;for(const m of ["gemini-2.5-flash-preview-tts","gemini-2.5-pro-preview-tts"]){try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),32000);
    const r=await fetch(kasaUrl()+"/g/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json"},body,signal:ctl.signal});clearTimeout(to);
    const j=await r.json().catch(()=>({}));const cd=j&&j.candidates&&j.candidates[0];const p=cd&&cd.content&&(cd.content.parts||[]).find(x=>x.inlineData&&x.inlineData.data);
    if(!p){err=new Error((j.error&&j.error.message)||j.hata||("yanıt "+r.status));continue}
    const rate=+(((p.inlineData.mimeType||"").match(/rate=(\d+)/)||[])[1]||24000);const blob=pcmWav(p.inlineData.data,rate);
    try{if(c)await c.put(key,new Response(blob,{headers:{"Content-Type":"audio/wav"}}))}catch(e){}
    const u=URL.createObjectURL(blob);GEM_MEM[key]=u;return u}catch(e){err=e}}
  GEM_OFF=Date.now()+5*60000;throw err||new Error("ses alınamadı")}

function besmeleSil(sure,t){t=String(t||"");if(sure===1||sure===9)return t;const w=t.trim().split(/\s+/);
  if(w.length>4&&/^بِ?سْ?مِ?/.test(w[0])&&w[0].replace(/[\u064B-\u0652\u0670\u06E1\u06DF\u0653-\u0655]/g,"").startsWith("بسم")&&w[3].replace(/[\u064B-\u0652\u0670\u06E1\u06DF\u0653-\u0655\u0640]/g,"").replace(/[ٱأإآ]/g,"ا").startsWith("الرح"))return w.slice(4).join(" ");return t}
const AYM={},AYM_P={};let aymCiz=0;
function aymGetir(sure){if(AYM_P[sure])return AYM_P[sure];
  AYM_P[sure]=(async()=>{const koy=(ar,tr,ok)=>ar.forEach((x,i)=>{AYM[sure+":"+(i+1)]={ar:i===0?besmeleSil(sure,x):x,tr:tr[i]||"",ok:ok[i]||""}});
    try{const r=await fetch(`https://api.alquran.cloud/v1/surah/${sure}/editions/quran-uthmani,tr.diyanet,tr.transliteration`);const j=await r.json();
      if(!j||!j.data||!j.data[0])throw 0;const g=k=>(j.data[k]&&j.data[k].ayahs||[]).map(a=>String(a.text).replace(/<[^>]+>/g,""));koy(g(0),g(1),g(2));return}catch(e){}
    try{const r=await fetch(`https://api.alquran.cloud/v1/surah/${sure}/editions/quran-uthmani,tr.diyanet`);const j=await r.json();const g=k=>(j.data[k].ayahs||[]).map(a=>a.text);koy(g(0),g(1),[]);return}catch(e){}
    try{const r=await fetch(`https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/chapters/tr/${sure}.json`);const j=await r.json();koy(j.verses.map(v=>v.text),j.verses.map(v=>v.translation||""),[])}catch(e){AYM_P[sure]=null}})();
  return AYM_P[sure]}
const arNo=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
function duaMetin(d){if(!d||!d.tam||!d.ay)return d;const L=d.ay.map(([s,a])=>AYM[s+":"+a]);
  if(L.every(Boolean)){const tek=d.ay.length===1;return Object.assign({},d,{ar:L.map((x,i)=>x.ar+(tek?"":" ﴿"+arNo(d.ay[i][1])+"﴾")).join(" "),r:L.every(x=>x.ok)?L.map(x=>x.ok).join(" "):d.r,m:L.map(x=>x.tr).join(" "),src:d.src+" · Diyanet meali"})}
  const eks=[...new Set(d.ay.filter(([s,a])=>!AYM[s+":"+a]).map(x=>x[0]))];
  Promise.all(eks.map(aymGetir)).then(()=>{if(!d.ay.every(([s,a])=>AYM[s+":"+a]))return;clearTimeout(aymCiz);aymCiz=setTimeout(()=>{if(tab==="bugun"||tab==="zikir"||tab==="kulliyat")renderView()},120)});
  return d}

/* ===================== Kendi adresini koru ===================== */
(function(){if(!("serviceWorker" in navigator)||location.protocol!=="https:")return;
  const base=location.pathname.replace(/[^/]*$/,"");
  navigator.serviceWorker.getRegistrations().then(rs=>{rs.forEach(r=>{try{const sc=new URL(r.scope).pathname;if(!sc.startsWith(base))r.unregister()}catch(e){}})}).catch(()=>{});
  navigator.serviceWorker.register("sw.js",{scope:"./"}).then(r=>{PUSH_REG=r;pushCheck()}).catch(()=>{});
  /* çevrimdışı açılış: yalnız bu sayfayı kapsayan ayrı yardımcı (bildirim sw.js'ine dokunmaz) */
  const page=location.pathname;if(!page.endsWith("/"))navigator.serviceWorker.register("maneviyat-sw.js",{scope:page}).catch(()=>{});
  fetch("maneviyat.webmanifest",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;document.querySelector('link[rel="manifest"]').href=new URL("maneviyat.webmanifest",location.href).href}).catch(()=>{
  try{const man={id:"/maneviyat-kulliyati/",name:"Maneviyat Külliyatı",short_name:"Maneviyat",display:"standalone",background_color:"#0e1517",theme_color:"#0e1517",start_url:location.origin+base,scope:location.origin+base,icons:[{src:document.querySelector('link[rel="apple-touch-icon"]').href,sizes:"180x180",type:"image/png"}]};
    document.querySelector('link[rel="manifest"]').href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}))}catch(e){}});
})();

/* ===================== İlerleme çubuğu: sürükle, sona çek = bitir ===================== */
let SCRUB=false;
function bitirSonraki(){const t=Q[qi];if(!t)return;if(t.key){DONE[t.key]=1;delete POS[t.key];store.set("mk_done",DONE);store.set("mk_pos",POS)}
  if(qi<Q.length-1||(t.group==="Yol Modu")){toast("✓ Bitti · sıradakine geçiliyor");next()}else{au.pause();toast("✓ Bitti olarak işaretlendi");updateMini();renderView()}}
(function(){const box=$("#mprogBox"),sc=$("#mscrub"),tip=$("#mtip"),bar=$("#mprog"),th=$("#mthumb");if(!sc)return;
  const ratio=e=>{const r=box.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
  let last=0;
  const show=x=>{const d=au.duration;bar.style.width=x*100+"%";th.style.left=x*100+"%";th.hidden=false;tip.hidden=false;tip.style.left=Math.max(8,Math.min(92,x*100))+"%";tip.textContent=x>=.985?"⏭ Bitir ve geç":fmt(x*d)+" / "+fmt(d)};
  sc.addEventListener("pointerdown",e=>{const t=Q[qi];if(!t||t.live||!isFinite(au.duration)||!au.duration)return;SCRUB=true;sc.classList.add("drag");try{sc.setPointerCapture(e.pointerId)}catch(x){}last=ratio(e);show(last);e.preventDefault()});
  sc.addEventListener("pointermove",e=>{if(!SCRUB)return;last=ratio(e);show(last)});
  const end=()=>{if(!SCRUB)return;SCRUB=false;sc.classList.remove("drag");tip.hidden=true;if(last>=.985)bitirSonraki();else{au.currentTime=last*au.duration;if(Q[qi]&&Q[qi].key){POS[Q[qi].key]=Math.floor(au.currentTime);store.set("mk_pos",POS)}}};
  sc.addEventListener("pointerup",end);sc.addEventListener("pointercancel",end);
  sc.addEventListener("keydown",e=>{if(!isFinite(au.duration))return;if(e.key==="ArrowRight")au.currentTime+=15;if(e.key==="ArrowLeft")au.currentTime-=15;if(e.key==="End")bitirSonraki()});
})();

  const p=POS[t.key];if(p)$("#miniS").textContent="Kaldığın yer "+fmt(p)+" · ▶ ile devam et";}catch(e){}}
