function bAlimler(){const f=$("#alimForm");if(f)f.onsubmit=e=>{e.preventDefault();const v=$("#alimIn").value.trim();if(!v){$("#alimIn").focus();return}$("#alimIn").blur();tab="dinle";dinleSeg="sohbet";store.set("mk_dseg","sohbet");doSearch(v);toTop()};
  document.querySelectorAll("[data-alimsoh]").forEach(b=>b.onclick=()=>{const i=$("#alimIn");if(i){i.value=b.dataset.alimsoh;i.scrollIntoView({block:"center"});i.focus();try{i.setSelectionRange(i.value.length,i.value.length)}catch(x){}toast("Yanına konu da yazabilirsin")}})}

const COCUK_ALIM=[
 ["İmam Gazâlî","İhyâu Ulûmi'd-Dîn","Çocuk, anne babasının elinde bir emanettir. Tertemiz kalbi, her türlü nakıştan uzak, saf ve kıymetli bir cevherdir; ona ne işlenirse kabul eder, neye yöneltilirse ona yönelir. Hayra alıştırılır ve hayır öğretilirse onun üzerine büyür; dünyada ve âhirette mutlu olur, anne babası ve öğretmenleri de sevabına ortak olur. Kötülüğe alıştırılır, başıboş bırakılırsa bedbaht olur; vebali de onu yetiştirmekle sorumlu olanın boynunadır."],
 ["İmam Gazâlî","İhyâu Ulûmi'd-Dîn","Çocukta güzel bir davranış görülürse ikram edilmeli, onu sevindirecek bir şeyle mükâfatlandırılmalı ve insanların yanında övülmelidir. Bir defa hata ederse görmezden gelinmeli, sırrı açılmamalıdır. Tekrar ederse baş başa uyarılmalıdır. Her an azarlanmamalıdır; çünkü çok azar, sözün tesirini yok eder."],
 ["İmam Gazâlî","İhyâu Ulûmi'd-Dîn","Çocuğu korumanın başı, onu kötü arkadaşlardan uzak tutmaktır. Ona edep, haya ve tevazu öğretilmeli; büyüklerin yanında edepli oturmak, çok konuşmamak, yalan söylememek ve yemin etmemek ona alıştırılmalıdır."],
 ["İmam-ı Rabbânî","Mektûbât (özet)","İnsanın önce itikadını Ehl-i sünnet âlimlerinin bildirdiği şekilde düzeltmesini, ardından farzları, helal ve haramları öğrenip onlarla amel etmesini, sonra kalbini arındırmaya yönelmesini öğütler. Çocuk eğitiminde de sıra budur: önce sağlam bir iman, sonra ibadet, sonra güzel ahlak."],
 ["İbn Haldûn","Mukaddime","Öğrenciye ve çocuğa sert ve baskıcı davranmak onun ruhunu daraltır, neşesini söndürür; onu tembelliğe, yalana ve hileye sevk eder. Çünkü korkutulan çocuk, cezadan kurtulmak için içindekini gizlemeyi öğrenir; bu da onda kalıcı bir huy hâline gelir."],
 ["İbn Kayyim el-Cevziyye","Tuhfetü'l-Mevdûd","Çocukların çoğunun bozulması, babalarının onları ihmal etmesinden; dinin farzlarını ve sünnetlerini onlara öğretmemelerinden kaynaklanır. Küçükken onları zayi ettiler; büyüyünce çocuklar ne kendilerine ne de babalarına fayda verdi."],
 ["Mevlânâ Celâleddîn-i Rûmî","Mesnevî (mana olarak)","Öğretmen ne kadar bilgili olursa olsun, çocuğa ders verirken onun diline iner; çocukla çocuğun anlayacağı gibi konuşur."]
];
const COCUK_HADIS=[["Her doğan fıtrat (İslâm'a yatkın tertemiz bir yaratılış) üzere doğar.","Buhârî, Cenâiz 80"],["Çocuklarınıza ikram edin ve onları güzel terbiye edin.","İbn Mâce, Edeb 3"],["Çocuklarınıza yedi yaşında namazı emredin (öğretin).","Ebû Dâvûd, Salât 26"],["Allah'tan korkun ve çocuklarınız arasında adaletli olun.","Buhârî, Hibe 13; Müslim, Hibât 13"],["Hiçbir baba çocuğuna güzel ahlaktan daha üstün bir hediye vermemiştir.","Tirmizî, Birr 33"],["Küçüklerimize merhamet etmeyen, büyüklerimize saygı göstermeyen bizden değildir.","Tirmizî, Birr 15"],["Peygamberimiz torunu Hasan'ı öptüğünde yanındaki “On çocuğum var, hiçbirini öpmedim” deyince: “Merhamet etmeyene merhamet olunmaz” buyurdu.","Buhârî, Edeb 18"]];
const COCUK_ARA=[["Çocuk eğitimi sohbet","Genel"],["Nureddin Yıldız çocuk","Nureddin Yıldız"],["Mehmet Yıldız çocuk","Mehmet Yıldız"],["Ömer Döngeloğlu çocuk","Ömer Döngeloğlu"],["Muhammed Emin Yıldırım çocuk","M. Emin Yıldırım"],["Halil İbrahim Genç çocuk","H. İbrahim Genç"],["Abdullah İmamoğlu çocuk","Abdullah İmamoğlu"],["Abdurrahman Ateş çocuk","Abdurrahman Ateş"],["Diyanet aile çocuk eğitimi","Diyanet"],["Peygamberimizin çocuk eğitimi","Siyer"]];
let cocukSeg=store.get("mk_ccseg","alim");
function cocukOkuCal(i){const art=makeArt("تربية","Çocuk Eğitimi",320);const L=COCUK_ALIM.map(([a,e,t],k)=>Object.assign(ttsTrack(a+". "+e+". "+t,"tr-TR",a+" · "+e,"Çocuk eğitimi",art,"Çocuk Eğitimi"),{ilimOku:1}));playQueue(L,i||0)}
function cocukHadisCal(i){const art=makeArt("تربية","Çocuk Eğitimi",320);playQueue(COCUK_HADIS.map(([t,s],k)=>Object.assign(ttsTrack(t+" "+s+".","tr-TR","Hadis "+(k+1),s,art,"Çocuk Eğitimi"),{ilimOku:1})),i||0)}
function vCocuk(){const seg=`<div class="seg">${[["alim","📚 Âlimlerden"],["ayet","📖 Âyet · Hadis"],["vaaz","🎧 Türkçe vaazlar"]].map(([k,l])=>`<button data-ccseg="${k}" class="${cocukSeg===k?"on":""}">${l}</button>`).join("")}</div>`;
  const ust=`<div class="bigcard cocukkart"><span class="small" style="font-weight:800;letter-spacing:.07em;color:#fff;opacity:.92">AİLE · ÇOCUK TERBİYESİ</span><div class="ttl" style="color:#fff">👨‍👩‍👧 Çocuk Eğitimi</div><div class="small" style="color:#fff;opacity:.94">“Çocuk, anne babasının elinde bir emanettir.” (İmam Gazâlî) · Hepsi okunabilir ve erkek doğal sesle dinlenebilir.</div></div>`;
  let b="";
  if(cocukSeg==="alim")b=`<button class="pill acc" data-ccoku="0" style="margin:10px 0 12px">▶ Hepsini sesli dinle</button>${COCUK_ALIM.map(([a,e,t],i)=>`<div class="dua"><div class="head"><h3>${esc(a)}</h3><span class="cnt">${esc(e)}</span></div><div class="mean" style="font-size:16.5px;line-height:1.7;color:var(--fg)">${esc(t)}</div><div class="ctrl"><button class="pill" data-ccoku="${i}">▶ Dinle</button></div></div>`).join("")}<div class="note">Âlimlerin sözleri mana olarak Türkçeleştirildi; eserlerinin adı yanında yazılıdır.</div>`;
  else if(cocukSeg==="ayet")b=`<h2>Kur'an'dan</h2>${DUALAR.egitim.map((d,i)=>duaCard(d,"egitim|"+i)).join("")}<h2>Peygamberimizden</h2><button class="pill acc" data-cchad="0" style="margin-bottom:10px">▶ Hepsini dinle</button><div class="list">${COCUK_HADIS.map(([t,s],i)=>`<div class="nrow"><span class="ts">${i+1}</span><span class="tx">${esc(t)}<span>${esc(s)}</span></span><button class="pill ghost" data-cchad="${i}" style="padding:6px 10px" aria-label="Dinle">🔊</button></div>`).join("")}</div>`;
  else b=`<div class="note" style="margin:10px 0 12px">Bir hocaya dokun; o hocanın çocuk eğitimi sohbetleri uygulamanın içinde aranır ve ekran kapalıyken dinlenir.</div><div class="list">${COCUK_ARA.map(([q,l],i)=>`<div class="nrow" style="align-items:center"><button class="tx" data-qs="${esc(q)}" style="font-size:15.5px"><b style="display:block">🎧 ${esc(l)}</b><span>${esc(q)}</span></button><a class="pill ghost" style="padding:6px 10px;font-size:13px" target="_blank" rel="noopener" href="${yt(q+" vaaz")}">YouTube</a></div>`).join("")}</div>
   <div class="bigcard" style="margin-top:12px"><b>Siyer TV · Peygamberimizi Çocuklarımıza Nasıl Anlatmalı?</b><div class="muted small">Siyer Vakfı'nın çocuklara Peygamber sevgisini anlatma üzerine programı.</div><a class="pill acc" style="justify-self:start" target="_blank" rel="noopener" href="https://www.siyertv.com/peygamberimizi-sas-cocuklarimiza-nasil-anlatmali-1-oturum/">İzle ›</a></div>`;
  return ust+seg+b}
document.addEventListener("click",e=>{const t=e.target;if(!t||!t.closest)return;let b;
  if((b=t.closest("[data-ccseg]"))){cocukSeg=b.dataset.ccseg;store.set("mk_ccseg",cocukSeg);renderView();return}
  if((b=t.closest("[data-ccoku]"))){cocukOkuCal(+b.dataset.ccoku);return}
  if((b=t.closest("[data-cchad]"))){cocukHadisCal(+b.dataset.cchad);return}
});

/* ---------- Bir bölüme dokununca büyük çalar ekranı açılsın ---------- */
let sonSatirTik=0;
document.addEventListener("click",e=>{const t=e.target;if(!t||!t.closest)return;if(t.closest(".nb,[data-nb],.x,a"))return;const r=t.closest("#view .row[data-ep],#view .row[data-pe],#view .row[data-arcf],#view .row[data-bdscal],#view .row[data-r2],#view .card[data-radio],#view [data-hemen],#view [data-archemen],#view [data-ccoku],#view [data-cchad],#view [data-sCont],#view #sCont,#view #podFirst,#view #podLast");if(r){sonSatirTik=1;setTimeout(()=>{sonSatirTik=0},0)}},true);
(function(){const eski=playQueue;playQueue=function(list,i){eski(list,i);if(sonSatirTik&&!(dinleSeg==="kuran"&&openSure&&tab==="dinle")){sonSatirTik=0;setTimeout(openSheet,60)}}})();
